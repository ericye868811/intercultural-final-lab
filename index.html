":"Proxemics","difficulty":"B","question_type":"T2","question":"Proxemics concerns:","options":["touch behavior.","the use and interpretation of interpersonal space.","vocal qualities such as pitch and pace."],"answer":1,"explanation":"Proxemics is about space and distance.","quick_rule":"space/distance → proxemics","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T084","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Kinesics","difficulty":"B","question_type":"T2","question":"Kinesics primarily concerns:","options":["physical touch.","time use.","body movement, gesture and posture."],"answer":2,"explanation":"Kinesics analyzes body movement in communication.","quick_rule":"movement/gesture → kinesics","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T085","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Haptics","difficulty":"B","question_type":"T2","question":"Haptics refers to communication through:","options":["touch.","time.","spatial distance."],"answer":0,"explanation":"Haptics concerns touch.","quick_rule":"touch → haptics","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T086","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Chronemics","difficulty":"B","question_type":"T2","question":"Chronemics concerns how communication is shaped by:","options":["voice quality.","the use and interpretation of time.","body posture."],"answer":1,"explanation":"Chronemics is the study of time in communication.","quick_rule":"time → chronemics","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T087","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Paralanguage","difficulty":"B","question_type":"T2","question":"Paralanguage includes:","options":["social rank only.","interpersonal distance only.","vocal features such as tone, pace, volume and pitch beyond the words themselves."],"answer":2,"explanation":"Paralanguage concerns how the voice sounds beyond lexical content.","quick_rule":"how voice sounds → paralanguage","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T088","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Multi-Channel","difficulty":"C","question_type":"T3","question":"A person says “I'm fine” while speaking very softly, avoiding eye contact and turning away. What is the safest interpretation?","options":["Verbal and nonverbal channels may be sending different cues, so clarification is needed.","The words alone prove the person is fine.","Avoided eye contact has one universal meaning across cultures."],"answer":0,"explanation":"Nonverbal cues are contextual and should not be read as universal fixed codes.","quick_rule":"mixed channels → clarify context","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T089","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Universalism Trap","difficulty":"C","question_type":"T2","question":"Which statement is most accurate?","options":["Every culture interprets eye contact identically.","Nonverbal behaviors can carry different meanings across contexts, so one gesture should not be assigned a universal interpretation automatically.","Personal distance has the same meaning in all settings."],"answer":1,"explanation":"Nonverbal meaning is context- and culture-sensitive.","quick_rule":"nonverbal cue ≠ universal fixed meaning","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T090","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Concept Integration","difficulty":"D","question_type":"T3","question":"A misunderstanding arises because one person interprets another's silence as agreement, while the other intended respectful hesitation. Which principle is most useful?","options":["Infer the speaker's national culture and stop asking questions.","Treat silence as a universal sign of agreement.","Interpret nonverbal/paralinguistic cues in context and verify meaning rather than assuming equivalence."],"answer":2,"explanation":"Silence is context-dependent; competent interpretation requires checking meaning.","quick_rule":"silence meaning → context + clarification","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"V2Q031","module":"Intercultural Scenarios","subcategory":"Nonverbal","topic":"Personal Space","difficulty":"A","question_type":"T4","question":"During a conversation, one student repeatedly steps backward because the other stands very close. Which concept should you check first?","options":["Proxemics","Chronemics","Power distance"],"answer":0,"explanation":"The immediate cue is interpersonal distance, the focus of proxemics.","quick_rule":"Distance first → proxemics.","source_ids":["SRC02"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q032","module":"Intercultural Scenarios","subcategory":"Business Communication","topic":"Gift Giving","difficulty":"B","question_type":"T4","question":"A Chinese employee is preparing a thank-you gift for Italian business partners. Which choice is safest according to the SFLEP ICT sample guidance?","options":["Remove visible price stickers","Use purple wrapping","Choose knives as symbolic gifts","Bring chrysanthemums"],"answer":0,"explanation":"The SFLEP sample identifies removing price labels as appropriate and warns against purple wrapping, sharp objects and chrysanthemums in this context.","quick_rule":"Official sample: remove price labels.","source_ids":["SRC01"],"status":"official_sample_adapted","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"O"},{"id":"V2Q033","module":"Intercultural Scenarios","subcategory":"Classroom","topic":"Participation Norms","difficulty":"B","question_type":"T4","question":"An international student rarely interrupts the professor and waits to be invited to speak. The professor reads this as lack of interest. What is the best first response?","options":["Clarify participation expectations and ask how the student understands respectful classroom behavior","Conclude that the student's culture discourages critical thinking","Require the student to adopt the professor's style immediately"],"answer":0,"explanation":"Intercultural competence favors clarification before attributing behavior to a fixed cultural trait.","quick_rule":"Clarify before judging.","source_ids":["SRC01","SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q034","module":"Intercultural Scenarios","subcategory":"Business Communication","topic":"Directness","difficulty":"B","question_type":"T4","question":"A project partner replies, 'We may need to revisit the timeline,' after being asked whether Friday is possible. What is the most interculturally competent next step?","options":["Ask a concrete follow-up question about whether Friday is feasible","Assume the partner has agreed","Assume the partner is being intentionally dishonest"],"answer":0,"explanation":"Indirect wording can be interpreted differently; clarification reduces the risk of imposing one's own communication norms.","quick_rule":"Ambiguous indirectness → clarify.","source_ids":["SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q035","module":"Intercultural Scenarios","subcategory":"Conflict","topic":"Face","difficulty":"B","question_type":"T4","question":"A team leader notices a colleague's mistake during a public meeting. Which response best demonstrates face sensitivity while still addressing the problem?","options":["Raise the issue privately and focus on correcting the work","Publicly identify the colleague to show accountability","Ignore the error permanently"],"answer":0,"explanation":"Private, task-focused correction can protect social image without abandoning the substantive issue.","quick_rule":"Protect face without avoiding the problem.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q036","module":"Intercultural Scenarios","subcategory":"CAT","topic":"Speech Adjustment","difficulty":"B","question_type":"T4","question":"A native speaker notices that a visitor is struggling and slows down slightly, avoids unnecessary idioms and checks understanding. Which concept best describes this?","options":["Convergence/accommodation","Divergence","Ethnocentrism"],"answer":0,"explanation":"The speaker adjusts communication to reduce distance and improve understanding, consistent with accommodation.","quick_rule":"Adjust toward listener → accommodation.","source_ids":["SRC04"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q037","module":"Intercultural Scenarios","subcategory":"Group Work","topic":"Multiple Perspectives","difficulty":"B","question_type":"T4","question":"Two students disagree about whether silence in a meeting signals respect or disengagement. What is the strongest intercultural response?","options":["Treat both interpretations as hypotheses and examine the specific context","Choose the interpretation common in your own culture","Assume silence has one universal meaning"],"answer":0,"explanation":"Nonverbal behavior is context-dependent; culturally competent analysis compares interpretations without treating one as universal.","quick_rule":"Behavior ≠ universal meaning.","source_ids":["SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q038","module":"Intercultural Scenarios","subcategory":"Hierarchy","topic":"Power Distance","difficulty":"B","question_type":"T4","question":"A junior employee expects the manager to make the final decision and is surprised when the manager asks the team to challenge her proposal. Which concept is most relevant?","options":["Power distance","Proxemics","Haptics"],"answer":0,"explanation":"The issue concerns expectations about hierarchy, authority and participation in decision-making.","quick_rule":"Hierarchy → power distance.","source_ids":["SRC05"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q039","module":"Intercultural Scenarios","subcategory":"AUM","topic":"First Encounter","difficulty":"B","question_type":"T4","question":"Before meeting a foreign client, an intern worries because he cannot predict the client's communication style. Which response is most consistent with AUM?","options":["Gather relevant information while remaining mindful of uncertainty rather than trying to eliminate it completely","Avoid the client until all uncertainty disappears","Rely on national stereotypes to predict the client"],"answer":0,"explanation":"AUM-oriented practice manages uncertainty and anxiety through mindful information seeking rather than avoidance or stereotyping.","quick_rule":"Manage uncertainty mindfully.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q040","module":"Intercultural Scenarios","subcategory":"Conflict","topic":"Integrating","difficulty":"B","question_type":"T4","question":"Two partners disagree about a launch date. They identify the underlying constraints of both sides and design a phased launch that satisfies both. Which style is strongest?","options":["Integrating","Avoiding","Dominating"],"answer":0,"explanation":"They work toward a solution addressing both sets of concerns, characteristic of integrating.","quick_rule":"Win-win problem solving → integrating.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q041","module":"Intercultural Scenarios","subcategory":"Attribution","topic":"Avoiding Stereotypes","difficulty":"C","question_type":"T4","question":"A colleague arrives ten minutes late to an informal meeting. Which interpretation best demonstrates intercultural competence?","options":["Ask about the circumstances before attributing the behavior to the colleague's national culture","Infer that people from the colleague's country do not value punctuality","Assume the colleague intended disrespect"],"answer":0,"explanation":"A single behavior has many possible causes; competent interpretation resists premature cultural attribution.","quick_rule":"One behavior ≠ proof of a cultural trait.","source_ids":["SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q042","module":"Intercultural Scenarios","subcategory":"Directness","topic":"Face + Context","difficulty":"C","question_type":"T4","question":"A partner says, 'Perhaps another option might work better,' while rejecting your proposal. Which analysis is most careful?","options":["The indirect form may reflect contextual communication and/or face management, but the specific motive should be clarified","The sentence proves the speaker comes from a high-context culture","The speaker is definitely avoiding responsibility"],"answer":0,"explanation":"The form is compatible with several mechanisms; intercultural analysis should avoid deterministic inference from one utterance.","quick_rule":"Recognize patterns; verify motives.","source_ids":["SRC02","SRC03","SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q043","module":"Intercultural Scenarios","subcategory":"CAT","topic":"Overaccommodation","difficulty":"C","question_type":"T4","question":"A manager speaks unnaturally slowly and uses childlike vocabulary with a fluent international employee, who feels patronized. Which interpretation is best?","options":["Accommodation can become inappropriate when it is poorly calibrated to the listener's actual needs","Any simplification is always competent convergence","The employee's reaction is best explained only by power distance"],"answer":0,"explanation":"CAT allows for accommodation that is miscalibrated and produces negative outcomes; adaptation should fit the interlocutor.","quick_rule":"Accommodation must be well calibrated.","source_ids":["SRC04"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q044","module":"Intercultural Scenarios","subcategory":"Conflict","topic":"Compromise vs Integration","difficulty":"C","question_type":"T4","question":"Two departments each give up half of their preferred budget without discussing why the money is needed. Which description is most accurate?","options":["Compromising rather than integrating","Integrating rather than compromising","Avoiding rather than compromising"],"answer":0,"explanation":"They split the difference but do not explore underlying interests, which fits compromising more than integrating.","quick_rule":"Trade concessions → compromise.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q045","module":"Intercultural Scenarios","subcategory":"Identity","topic":"Multiple Identity","difficulty":"C","question_type":"T4","question":"During a multinational project, a participant says, 'As an engineer I agree, but as a community volunteer I see another risk.' What does this best illustrate?","options":["Multiple identities can become relevant within the same interaction","Cultural identity is always the dominant identity","Professional identity eliminates cultural identity"],"answer":0,"explanation":"Identity is multidimensional, and different identities can become salient as interactional demands change.","quick_rule":"Identity is layered and contextual.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q046","module":"Intercultural Scenarios","subcategory":"Nonverbal","topic":"Touch and Space","difficulty":"C","question_type":"T4","question":"A student dislikes being touched on the arm and also prefers greater conversational distance. Which two nonverbal domains are most directly involved?","options":["Haptics and proxemics","Kinesics and chronemics","Paralanguage and power distance"],"answer":0,"explanation":"Touch is haptics and interpersonal space is proxemics.","quick_rule":"Touch + distance → haptics + proxemics.","source_ids":["SRC02"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q047","module":"Intercultural Scenarios","subcategory":"Intercultural Competence","topic":"Mutual Adaptation","difficulty":"C","question_type":"T4","question":"Two roommates have different expectations about privacy. Which solution best reflects mutual adaptation?","options":["State preferences explicitly, ask about the other's expectations and negotiate shared rules","Require the newcomer to follow one roommate's habits without discussion","Avoid discussing the issue to preserve harmony"],"answer":0,"explanation":"Competent interaction involves perspective-taking, clarification and negotiated adjustment rather than unilateral conformity or avoidance.","quick_rule":"Clarify → compare → negotiate.","source_ids":["SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q048","module":"Intercultural Scenarios","subcategory":"Business Communication","topic":"Hierarchy + Face","difficulty":"C","question_type":"T4","question":"A junior employee privately disagrees with a senior manager but does not challenge the proposal in a large meeting. Which interpretation is strongest?","options":["Both hierarchy expectations and face concerns could be relevant; more context is needed","The behavior proves low uncertainty avoidance","The behavior can only be explained by high-context communication"],"answer":0,"explanation":"Several constructs may jointly shape conflict behavior; careful analysis avoids a single-cause cultural label.","quick_rule":"Complex behavior can have multiple cultural and situational causes.","source_ids":["SRC03","SRC05"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q049","module":"Intercultural Scenarios","subcategory":"Integrated Scenario","topic":"Layered Diagnosis","difficulty":"D","question_type":"T4","question":"In a joint venture meeting, one side gives an indirect answer, avoids contradicting a senior executive publicly, and later proposes a private discussion. Which analysis is best?","options":["Indirect encoding may involve context; public restraint may involve hierarchy and face; the private discussion may be a conflict-management strategy","All three behaviors are fully explained by one national stereotype","The behaviors show that effective communication is impossible across the two cultures"],"answer":0,"explanation":"A strong intercultural analysis separates message style, hierarchy, face and strategy rather than reducing the case to a single cultural label.","quick_rule":"Layer mechanisms; do not essentialize.","source_ids":["SRC02","SRC03","SRC05","SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q050","module":"Intercultural Scenarios","subcategory":"Integrated Scenario","topic":"Best Response","difficulty":"D","question_type":"T4","question":"A teammate interprets another member's silence as agreement, while the silent member later says she was waiting for an invitation to speak. What is the best team-level intervention?","options":["Create explicit turn-taking and decision-confirmation norms so silence is not treated as automatic consent","Tell the silent member to become more direct because that style is universally superior","Continue using silence as agreement because it saves time"],"answer":0,"explanation":"The intervention reduces ambiguity without treating one communication style as universally correct and creates a shared team norm.","quick_rule":"Build explicit shared norms when meanings differ.","source_ids":["SRC01","SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"T17S001","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Indirect Refusal","difficulty":"C","question_type":"T4","question":"During a negotiation, your counterpart repeatedly says, “We will consider it,” but avoids committing after several follow-ups. What is the best response?","options":["Ask politely what conditions or concerns remain and clarify whether the proposal is still under consideration.","Assume the phrase is a definite yes and announce the agreement.","Conclude that the counterpart is dishonest because the refusal was not explicit."],"answer":0,"explanation":"A culturally competent response checks intended meaning without forcing a stereotype.","quick_rule":"ambiguous indirect response → clarify respectfully","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S002","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Face-Saving","difficulty":"C","question_type":"T4","question":"A manager notices that openly correcting a partner in front of the full delegation causes visible discomfort. What is the best next step?","options":["Avoid the issue permanently.","Move detailed correction to a more private setting and preserve the substantive issue for discussion.","Publicly repeat the criticism more strongly to prove clarity."],"answer":1,"explanation":"Private repair can address the task while reducing unnecessary face threat.","quick_rule":"solve issue + reduce public face threat","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S003","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Integrating","difficulty":"C","question_type":"T4","question":"Two firms disagree over delivery speed and quality control. Which move best demonstrates an integrating strategy?","options":["Insist that only one side's priority can be legitimate.","Split the difference mechanically without discussing interests.","Identify why each side needs its condition and redesign the schedule to protect both core interests."],"answer":2,"explanation":"Integrating explores underlying interests to seek a win-win solution.","quick_rule":"interests first → integrating","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S004","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Context","difficulty":"C","question_type":"T4","question":"One party gives a highly detailed written proposal; the other expects significant meaning to be negotiated through relationships and informal discussion. What should the team do?","options":["Use both explicit documentation and relational clarification instead of treating either style as inherently superior.","Force both sides to use only the written proposal.","Assume the relationship-oriented side is being intentionally vague."],"answer":0,"explanation":"Competence involves adapting channels and checking meaning.","quick_rule":"combine channels + clarify","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S005","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Hierarchy","difficulty":"C","question_type":"T4","question":"A junior representative remains silent while a senior colleague leads the meeting. What is the best interpretation?","options":["Silence proves the junior representative lacks ideas.","Several explanations are possible, including role hierarchy; ask about decision roles before judging participation.","The behavior automatically demonstrates high Power Distance in that individual."],"answer":1,"explanation":"Avoid attributing behavior to culture without checking situational roles.","quick_rule":"observe → hypothesize → verify","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S006","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"CAT","difficulty":"C","question_type":"T4","question":"A negotiator begins using less technical vocabulary after realizing the partner is unfamiliar with industry jargon. Which response best describes this?","options":["Evidence of high Uncertainty Avoidance.","A loss of professional identity.","A communicative accommodation intended to improve comprehension."],"answer":2,"explanation":"Adjusting language to an interlocutor's needs is accommodation.","quick_rule":"adjust language for partner → CAT","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S007","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Time Orientation","difficulty":"C","question_type":"T4","question":"One team treats the agenda as fixed; the other repeatedly extends discussion to resolve relational concerns. What is the best intervention?","options":["Make time expectations explicit and negotiate a meeting process that protects both schedule and relationship needs.","Label one team efficient and the other unprofessional.","Ignore the mismatch because time use is never cultural."],"answer":0,"explanation":"The response surfaces differing time/process expectations without stereotyping.","quick_rule":"make time norms explicit","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S008","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"AUM","difficulty":"C","question_type":"T4","question":"A negotiator is anxious because they cannot predict how unfamiliar partners will react. What is the most useful first step?","options":["Rely on a national-culture checklist as a complete prediction of each person.","Gather contextual information, ask clarifying questions, and avoid replacing uncertainty with stereotypes.","Avoid interaction until all uncertainty disappears."],"answer":1,"explanation":"AUM-oriented competence manages uncertainty through informed interaction.","quick_rule":"uncertainty → information, not stereotype","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S009","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Compromise vs Integrating","difficulty":"C","question_type":"T4","question":"Both sides immediately agree to cut their demands by 20%. Which description is most accurate?","options":["It is avoiding because neither side won fully.","It is automatically integrating because both sides agreed.","This is closer to compromising than integrating because it trades concessions without necessarily exploring underlying interests."],"answer":2,"explanation":"Mutual concessions characterize compromise.","quick_rule":"split difference → compromise","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S010","module":"Intercultural Scenarios","subcategory":"Business Negotiation","topic":"Intercultural Competence","difficulty":"D","question_type":"T4","question":"A partner behaves differently from what your cultural briefing predicted. What is the strongest response?","options":["Treat the briefing as a hypothesis, attend to the actual person and situation, and revise your expectations.","Assume the partner is an exception and keep using the briefing unchanged.","Conclude that cultural frameworks are useless in all contexts."],"answer":0,"explanation":"Frameworks should guide inquiry, not replace evidence from the interaction.","quick_rule":"framework = starting hypothesis","source_ids":["SRC01","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S011","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Participation","difficulty":"C","question_type":"T4","question":"A student contributes thoughtful ideas in writing but rarely interrupts fast-moving seminar discussion. What is the best teaching response?","options":["Lower the student's grade because silence always means disengagement.","Offer multiple participation channels and clarify turn-taking expectations rather than equating verbal speed with engagement.","Assume the student's national culture explains the behavior completely."],"answer":1,"explanation":"Inclusive design checks communication norms and provides multiple ways to participate.","quick_rule":"participation ≠ only fast speaking","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S012","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Direct Feedback","difficulty":"C","question_type":"T4","question":"A peer gives very direct feedback that another student experiences as personally harsh. What should the group do?","options":["Stop giving feedback to avoid discomfort.","Decide which culture's style is objectively correct.","Separate task criticism from personal judgment and agree on feedback norms with examples."],"answer":2,"explanation":"Explicit norm negotiation reduces misinterpretation.","quick_rule":"name feedback norms","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S013","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Group Decision","difficulty":"C","question_type":"T4","question":"Some group members want immediate voting; others want more discussion before anyone states a final position. What is the best response?","options":["Agree on a decision process that allows discussion before a clearly timed decision point.","Treat slower discussion as lack of confidence.","Let the most vocal member decide."],"answer":0,"explanation":"Process negotiation accommodates different expectations without essentializing them.","quick_rule":"negotiate the decision process","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S014","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Face","difficulty":"C","question_type":"T4","question":"A student realizes a teammate made an error in a public presentation. What response best balances task quality and face?","options":["Expose every mistake publicly to demonstrate honesty.","Correct only what is necessary in the moment, then discuss details privately and respectfully afterward.","Say nothing even if the error seriously misleads the audience."],"answer":1,"explanation":"Competence balances substantive accuracy with relational/face concerns.","quick_rule":"protect task + protect face","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S015","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"AUM","difficulty":"C","question_type":"T4","question":"An exchange student is unsure whether classmates' teasing is friendly or hostile and feels increasingly nervous. What should they do?","options":["Withdraw from all future group contact.","Assume the teasing reflects the entire national culture.","Seek contextual cues and ask a trusted classmate about the interaction rather than making an immediate group-level judgment."],"answer":2,"explanation":"Information seeking can reduce uncertainty without stereotyping.","quick_rule":"uncertain meaning → seek context","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S016","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Identity","difficulty":"C","question_type":"T4","question":"A group repeatedly asks one international student to speak for an entire country. What is the best correction?","options":["Recognize the student's individual perspective and avoid treating one person as a representative of a whole society.","Continue because nationality determines a person's cultural views.","Ask only questions about national stereotypes."],"answer":0,"explanation":"Individuals hold multiple identities and cannot represent an entire population.","quick_rule":"one person ≠ whole culture","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S017","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"CAT","difficulty":"C","question_type":"T4","question":"A multilingual team agrees to slow speech, avoid unnecessary idioms and summarize decisions in writing. This is best understood as:","options":["loss of linguistic identity.","mutual accommodation to improve comprehension.","high Power Distance."],"answer":1,"explanation":"The team adjusts communication to interlocutors' needs.","quick_rule":"mutual adjustment → accommodation","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S018","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Conflict","difficulty":"C","question_type":"T4","question":"Two students disagree strongly over the project method. Which move is most integrative?","options":["Avoid the topic until the deadline.","Tell each to give up half of the proposal immediately.","Ask each student to identify the underlying goal their preferred method is meant to protect, then search for a design satisfying both."],"answer":2,"explanation":"Integrating focuses on underlying interests.","quick_rule":"underlying interests → integrate","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S019","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Attribution","difficulty":"C","question_type":"T4","question":"A student is late twice. Which response best avoids a cultural-attribution error?","options":["Ask about the circumstances and expectations before deciding whether the pattern reflects culture, personality or situation.","Conclude that the student's culture does not value punctuality.","Assume lateness has no cultural dimension under any circumstances."],"answer":0,"explanation":"Good intercultural reasoning considers multiple explanations.","quick_rule":"don't jump from behavior to culture","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S020","module":"Intercultural Scenarios","subcategory":"Classroom & Teamwork","topic":"Competence","difficulty":"D","question_type":"T4","question":"A class debates whether one communication style is 'better.' Which principle is most defensible?","options":["The most direct style is always superior.","Evaluate whether a style is effective and appropriate for the specific context rather than ranking cultures globally.","The most indirect style is always more respectful."],"answer":1,"explanation":"Intercultural competence emphasizes contextual appropriateness and effectiveness.","quick_rule":"judge fit to context, not culture globally","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S021","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Personal Space","difficulty":"C","question_type":"T4","question":"A new acquaintance repeatedly steps back during conversation. What is the best immediate response?","options":["Assume the person dislikes you.","Move closer to show friendliness.","Allow more space and continue normally rather than interpreting the movement as rejection."],"answer":2,"explanation":"The behavior may reflect proxemic preference or situational comfort.","quick_rule":"distance cue → adjust, don't overinterpret","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S022","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Touch","difficulty":"C","question_type":"T4","question":"One friend frequently touches another's arm while speaking; the other appears uncomfortable. What is the most appropriate response?","options":["Reduce touch and, if needed, check the other person's comfort rather than assuming the gesture is universally friendly.","Continue because friendly touch has the same meaning everywhere.","Interpret discomfort as prejudice."],"answer":0,"explanation":"Haptic norms vary and consent/comfort should guide behavior.","quick_rule":"touch norms vary → follow comfort","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S023","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Compliments","difficulty":"C","question_type":"T4","question":"A compliment receives a modest denial rather than a direct 'thank you.' What is the best interpretation?","options":["The person definitely disliked the compliment.","It may be a culturally or personally preferred response strategy; avoid reading it immediately as rejection.","The response proves high Uncertainty Avoidance."],"answer":1,"explanation":"Compliment responses vary across norms and individuals.","quick_rule":"response convention may vary","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S024","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Silence","difficulty":"C","question_type":"T4","question":"During a serious conversation, one person pauses for several seconds before replying. What is the safest inference?","options":["Silence always means disapproval.","Silence always means agreement.","The pause can have several meanings; give space and use context or clarification before assigning intent."],"answer":2,"explanation":"Silence is context-dependent.","quick_rule":"silence ≠ one universal meaning","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S025","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Direct Refusal","difficulty":"C","question_type":"T4","question":"A friend responds to an invitation with “I may have something that evening” and changes the subject. What is the best response?","options":["Treat it as potentially noncommittal and give an easy opportunity to decline explicitly without pressure.","Keep insisting until the friend says the word 'no'.","Announce that the friend accepted."],"answer":0,"explanation":"Competent interaction leaves room for indirect refusal and clarifies gently.","quick_rule":"possible indirect no → reduce pressure","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S026","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Stereotype Check","difficulty":"C","question_type":"T4","question":"Someone says, “People from that country are always reserved, so I know why she is quiet.” What is the best reply?","options":["The national stereotype is enough to explain the behavior.","Culture may be one hypothesis, but personality, relationship and situation also need evidence.","Culture never influences communication."],"answer":1,"explanation":"Intercultural reasoning avoids deterministic attribution.","quick_rule":"culture = possible factor, not full explanation","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S027","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Face Repair","difficulty":"C","question_type":"T4","question":"You realize a joke embarrassed a new acquaintance in front of others. What is the best repair?","options":["Ignore the reaction to avoid losing your own face.","Explain publicly why the joke was objectively funny.","Acknowledge the effect, apologize without defending the joke, and give the person room to respond."],"answer":2,"explanation":"Repair should address impact and reduce further face threat.","quick_rule":"impact first → repair respectfully","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S028","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Identity","difficulty":"C","question_type":"T4","question":"A friend corrects the pronunciation of their name after you have said it incorrectly. What is the strongest response?","options":["Thank them, use the preferred pronunciation, and avoid making the correction itself awkward.","Explain that the alternative pronunciation is easier for you.","Continue using the old pronunciation because everyone else does."],"answer":0,"explanation":"Names can be identity-relevant; accommodation shows respect.","quick_rule":"preferred name/pronunciation → accommodate","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S029","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"High Context","difficulty":"C","question_type":"T4","question":"Two close friends understand a one-word message because of years of shared history. What best explains the efficiency?","options":["High Power Distance.","Shared context carries meaning that does not need to be fully verbalized.","Uncertainty Avoidance."],"answer":1,"explanation":"This is a classic context-rich communication situation.","quick_rule":"shared history → context carries meaning","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S030","module":"Intercultural Scenarios","subcategory":"Social Interaction","topic":"Competence","difficulty":"D","question_type":"T4","question":"You are unsure whether a behavior is a cultural norm or an individual preference. What should you do?","options":["Assume culture is irrelevant.","Choose the most common online stereotype.","Stay curious, adapt provisionally, and verify through interaction instead of demanding an immediate cultural label."],"answer":2,"explanation":"Competence tolerates uncertainty while seeking better evidence.","quick_rule":"curiosity + provisional adaptation + verify","source_ids":["SRC69","SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S031","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Power Distance","difficulty":"C","question_type":"T4","question":"Employees wait for a senior manager to invite questions before speaking. What is the best analytical approach?","options":["Consider hierarchy as one possible influence while also checking organizational norms and meeting design.","Assume every employee personally prefers hierarchy.","Conclude the employees lack ideas."],"answer":0,"explanation":"Power Distance is a cultural-level tendency, not a complete individual explanation.","quick_rule":"hierarchy hypothesis → verify context","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S032","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Face vs PDI","difficulty":"C","question_type":"T4","question":"An employee softens disagreement because publicly contradicting the boss could embarrass both parties. Which concept best explains the immediate motive?","options":["Power Distance alone","Face concern","Indulgence"],"answer":1,"explanation":"Hierarchy sets the context, but embarrassment/social image is the described mechanism.","quick_rule":"embarrassment → face","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S033","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Feedback","difficulty":"C","question_type":"T4","question":"A supervisor's blunt feedback is interpreted as disrespectful. What is the best intervention?","options":["Stop giving substantive feedback.","Tell the employee to adapt because the supervisor is senior.","Clarify that the goal is task improvement and agree on a feedback style that preserves clarity and respect."],"answer":2,"explanation":"Explicitly negotiating feedback conventions balances task and relationship.","quick_rule":"clarity + relational respect","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S034","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Meetings","difficulty":"C","question_type":"T4","question":"Some team members do not speak in large meetings but contribute extensively one-on-one afterward. What should the manager do?","options":["Use multiple channels for input and clarify how decisions incorporate both public and private contributions.","Count only public comments as genuine participation.","Assume quiet members agree with everything."],"answer":0,"explanation":"Different participation patterns can be accommodated structurally.","quick_rule":"multiple channels for voice","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S035","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Decision Rights","difficulty":"C","question_type":"T4","question":"A cross-border team keeps stalling because members disagree about who has authority to make the final decision. What is the best first step?","options":["Attribute the delay to national character.","Make decision rights and escalation rules explicit before debating the substantive issue further.","Let the most senior person decide without discussion even if roles are unclear."],"answer":1,"explanation":"Role ambiguity should be clarified directly.","quick_rule":"clarify authority architecture","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S036","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"CAT","difficulty":"C","question_type":"T4","question":"A manager notices non-native speakers missing rapid idioms and starts paraphrasing key points. This is:","options":["avoidance.","cultural assimilation.","communication accommodation for comprehension."],"answer":2,"explanation":"The manager adjusts communication to interlocutor needs.","quick_rule":"adjust expression → accommodation","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S037","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Identity","difficulty":"C","question_type":"T4","question":"An employee says colleagues reduce them to “the foreign expert” and ignore their professional specialization. What is the most appropriate response?","options":["Recognize multiple identities and engage the person's expertise rather than treating nationality as the dominant identity in every context.","Continue using nationality as the primary label because it is visible.","Avoid discussing professional identity."],"answer":0,"explanation":"Identity is multiple and context-sensitive.","quick_rule":"nationality ≠ whole professional identity","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S038","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Conflict Style","difficulty":"C","question_type":"T4","question":"A manager orders a solution without discussing employees' concerns. Which conflict style is closest?","options":["Integrating","Dominating","Obliging"],"answer":1,"explanation":"The manager prioritizes own position with little attention to the other side's concerns.","quick_rule":"impose own solution → dominating","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S039","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Uncertainty","difficulty":"C","question_type":"T4","question":"A newly formed global team creates a short glossary, decision template and question channel because members are unsure how work will be coordinated. What is the best interpretation?","options":["The behavior proves every member has high national UAI.","The team has eliminated all cultural difference.","The team is reducing interactional uncertainty through explicit shared structures."],"answer":2,"explanation":"Shared structures can reduce uncertainty without implying national-level traits.","quick_rule":"structure can manage team uncertainty","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S040","module":"Intercultural Scenarios","subcategory":"Workplace & Hierarchy","topic":"Intercultural Competence","difficulty":"D","question_type":"T4","question":"A diversity training slide gives one rule for how 'people from Country X' behave. What is the best critique?","options":["It may be useful as a tentative pattern only if paired with within-group variation, context and verification.","National rules should be followed literally for every person.","Any discussion of cultural patterns is inherently invalid."],"answer":0,"explanation":"Good training balances patterns with variation and situational evidence.","quick_rule":"pattern + variation + verification","source_ids":["SRC69","SRC71","SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S041","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Turn-Taking","difficulty":"C","question_type":"T4","question":"In video meetings, some members struggle to enter the conversation because others speak with almost no pause. What is the best fix?","options":["Tell quieter members to become more aggressive.","Create explicit turn-taking norms or use chat/hand-raise channels so participation does not depend on interruption speed.","Assume silence equals agreement."],"answer":1,"explanation":"The team can redesign interaction norms to support multiple styles.","quick_rule":"design turn-taking explicitly","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S042","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Time Zones","difficulty":"C","question_type":"T4","question":"A global team always schedules meetings at a convenient time for headquarters but at midnight for one region. What is the most interculturally competent change?","options":["Cancel collaboration across time zones.","Keep the schedule because headquarters has higher status.","Rotate inconvenient meeting times and document decisions asynchronously."],"answer":2,"explanation":"Equitable coordination accounts for structural time burdens.","quick_rule":"rotate burden + async support","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S043","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Written Tone","difficulty":"C","question_type":"T4","question":"A short email intended as efficient is read as cold by overseas colleagues. What is the best response?","options":["Clarify intent and adjust wording conventions rather than deciding one side is too sensitive.","Use even shorter messages to force adaptation.","Conclude that written communication is culture-free."],"answer":0,"explanation":"Written tone can be interpreted differently; explicit norm-setting helps.","quick_rule":"tone mismatch → clarify + adapt","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S044","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"AUM","difficulty":"C","question_type":"T4","question":"Team members become anxious because they cannot tell whether silence in a group chat means disagreement, delay or technical problems. What should the team do?","options":["Infer disagreement whenever someone is silent.","Create explicit response-time and acknowledgment norms.","Avoid messaging until uncertainty disappears."],"answer":1,"explanation":"Explicit norms reduce uncertainty in mediated interaction.","quick_rule":"ambiguous silence → shared protocol","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S045","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"CAT","difficulty":"C","question_type":"T4","question":"A team adopts plain English and avoids local slang because members have different first languages. This is best described as:","options":["Power Distance reduction.","cultural identity loss.","mutual communication accommodation."],"answer":2,"explanation":"The group adjusts language to improve mutual comprehensibility.","quick_rule":"shared language adjustment → CAT","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S046","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Identity","difficulty":"C","question_type":"T4","question":"A colleague's camera background displays religious objects, but they never discuss religion at work. What is the safest response?","options":["Do not infer the colleague's beliefs or desired identity salience from the background alone.","Treat religion as their dominant identity in all meetings.","Ask the team to classify the colleague culturally."],"answer":0,"explanation":"Identity salience should not be imposed from limited cues.","quick_rule":"visible cue ≠ invited identity label","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S047","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Directness","difficulty":"C","question_type":"T4","question":"A teammate writes, “Please revise section 3,” while another prefers “Could we perhaps revisit section 3?” What is the best team response?","options":["Declare the direct wording universally rude.","Agree on wording norms for requests and focus on intended task meaning rather than moralizing one style.","Declare the indirect wording universally inefficient."],"answer":1,"explanation":"Directness preferences can be negotiated explicitly.","quick_rule":"style difference → negotiate norm","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S048","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Conflict","difficulty":"C","question_type":"T4","question":"A disagreement escalates in text chat because each reply becomes shorter and harsher. What is the best repair?","options":["Add more participants to increase pressure.","Continue sending faster messages.","Move to a richer channel, restate interests and clarify intent before continuing the substantive dispute."],"answer":2,"explanation":"Channel change and clarification can reduce ambiguity and face threat.","quick_rule":"escalating text → richer channel + clarify","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S049","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Chronemics","difficulty":"C","question_type":"T4","question":"One team expects replies within an hour; another assumes next-business-day responses are normal. Which concept is especially relevant?","options":["Chronemics","Proxemics","Haptics"],"answer":0,"explanation":"The mismatch concerns time expectations in communication.","quick_rule":"response-time norms → chronemics","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S050","module":"Intercultural Scenarios","subcategory":"Virtual & Global Teams","topic":"Competence","difficulty":"D","question_type":"T4","question":"A team creates a 'culture guide' listing tendencies, then requires members to update it when lived experience contradicts the guide. Why is this strong practice?","options":["It guarantees all stereotypes become accurate.","It treats cultural knowledge as revisable hypotheses rather than fixed rules.","It eliminates the need to ask individuals about preferences."],"answer":1,"explanation":"Adaptive intercultural reasoning updates models with actual evidence.","quick_rule":"guide = revisable model","source_ids":["SRC69","SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S051","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Greeting","difficulty":"C","question_type":"T4","question":"You are unsure whether a new host prefers a handshake, bow, hug or no touch. What is the safest first move?","options":["Choose the most physically expressive greeting to show warmth.","Use the greeting common in your own culture regardless of reaction.","Observe the host's cue or use a neutral verbal greeting before initiating unfamiliar touch."],"answer":2,"explanation":"Observation and low-risk initiation reduce the chance of unwanted contact.","quick_rule":"uncertain greeting → observe / neutral start","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S052","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Dining","difficulty":"C","question_type":"T4","question":"At a formal meal, you are unsure when to begin eating. What is the best approach?","options":["Observe the host and table cues, then follow the established sequence.","Begin immediately to demonstrate confidence.","Ask everyone which national rule applies."],"answer":0,"explanation":"Contextual observation is more reliable than guessing from nationality.","quick_rule":"unknown dining norm → observe host","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S053","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Gift Giving","difficulty":"C","question_type":"T4","question":"You want to bring a business gift but are unsure about local taboos. What is the best preparation?","options":["Choose a symbolic object based on a stereotype.","Check a reliable current source or ask a knowledgeable local contact rather than relying on an unsourced internet list.","Assume gift meanings are universal."],"answer":1,"explanation":"Gift norms can be specific and should be verified.","quick_rule":"gift taboo → verify reliable source","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S054","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Personal Space","difficulty":"C","question_type":"T4","question":"A hotel guest steps back each time a staff member approaches closely to explain directions. What should the staff member do?","options":["Interpret the movement as hostility.","Move closer so the guest can hear better without asking.","Increase distance slightly while continuing to assist."],"answer":2,"explanation":"Adjusting to proxemic cues is low-cost accommodation.","quick_rule":"step back cue → give space","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S055","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Language Accommodation","difficulty":"C","question_type":"T4","question":"A visitor understands English but struggles with rapid local idioms. What is the most helpful response?","options":["Slow slightly, use plainer wording and check understanding without speaking condescendingly.","Repeat the same idioms louder.","Switch to exaggerated childlike speech."],"answer":0,"explanation":"Accommodation should improve comprehension without patronizing.","quick_rule":"accommodate, don't patronize","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S056","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Attribution","difficulty":"C","question_type":"T4","question":"A traveler sees one unusual behavior and says, “That must be what everyone here does.” What is the best correction?","options":["One vivid example is enough to identify national culture.","One observation is insufficient to infer a broad cultural norm; seek more contextual evidence.","Individual behavior never has cultural influences."],"answer":1,"explanation":"Intercultural inference requires more than one anecdote.","quick_rule":"one case ≠ cultural rule","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S057","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Face","difficulty":"C","question_type":"T4","question":"A guest complains privately about a service error but asks that a particular employee not be publicly blamed. Which concern may be especially relevant?","options":["Indulgence","Proxemics","Other-face / relational face"],"answer":2,"explanation":"The guest is concerned with avoiding public damage to another person's social image.","quick_rule":"protect another's public image → face","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S058","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Uncertainty","difficulty":"C","question_type":"T4","question":"A traveler feels anxious because they do not know whether tipping is expected. What is the best response?","options":["Check a reliable local source or ask discreetly rather than guessing from another country.","Tip according to the rule from home everywhere.","Avoid all service encounters."],"answer":0,"explanation":"Information seeking is a practical way to manage uncertainty.","quick_rule":"local norm uncertainty → verify","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S059","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Nonverbal","difficulty":"C","question_type":"T4","question":"A gesture that is friendly at home produces confusion abroad. What is the best lesson?","options":["Gestures have universal meanings.","Nonverbal signs can be context-specific; stop using the gesture until its local meaning is clear.","The other person is deliberately misunderstanding."],"answer":1,"explanation":"Nonverbal meaning is not universally fixed.","quick_rule":"gesture mismatch → suspend + clarify","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17S060","module":"Intercultural Scenarios","subcategory":"Travel & Hospitality","topic":"Competence","difficulty":"D","question_type":"T4","question":"A local host explains a norm that conflicts with a guidebook you read. What is the strongest response?","options":["Ignore all written guidance forever.","Correct the host using the guidebook.","Treat the guidebook as background information and explore the host's current contextual knowledge respectfully."],"answer":2,"explanation":"Local, current context can refine generalized guidance.","quick_rule":"source conflict → update with context","source_ids":["SRC01","SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"WC2Q001","module":"World Cultures","subcategory":"Germany","topic":"Punctuality","difficulty":"B","question_type":"T3","question":"A visitor has a 10:00 a.m. business appointment in Germany. Which choice best aligns with the official business guide?","options":["Treat the stated time as only an approximate starting point.","Arrive a few minutes early.","Arrive 20 minutes late to avoid appearing impatient."],"answer":1,"explanation":"The guide describes punctuality as important and recommends arriving about five minutes early.","quick_rule":"Germany: punctuality is part of professional respect.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q002","module":"World Cultures","subcategory":"Germany","topic":"Communication Style","difficulty":"B","question_type":"T4","question":"A German counterpart gives direct, detailed criticism of a proposal. What is the most appropriate first interpretation?","options":["It should be interpreted as deliberate rudeness.","It may reflect a direct and structured business communication style rather than personal hostility.","It proves the speaker has low concern for the other person’s face.","It necessarily signals a breakdown in the relationship."],"answer":1,"explanation":"The official guide notes that German business communication is often direct and structured and can include constructive criticism.","quick_rule":"Directness ≠ hostility.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Hall / communication style"},{"id":"WC2Q003","module":"World Cultures","subcategory":"Germany","topic":"Titles and Formality","difficulty":"B","question_type":"T3","question":"During an initial German business meeting, which form of address is the safest default?","options":["Use formal titles until invited to become more informal.","Use first names immediately to create equality.","Avoid professional titles because they can sound distant."],"answer":0,"explanation":"The guide advises respecting formal introductions and official titles, particularly at first.","quick_rule":"Initial contact: formal first, follow the other side’s lead.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q004","module":"World Cultures","subcategory":"Germany","topic":"Personal Space","difficulty":"C","question_type":"T4","question":"A visitor greets a new German business contact with an unexpected hug. The contact appears uncomfortable. Which response shows the best intercultural judgment?","options":["Assume the reaction is caused by high uncertainty avoidance.","Recognize that initial greetings may favor a handshake and more personal space, apologize lightly, and adapt.","Continue hugging to show that one’s own culture is equally valid.","Conclude that Germans dislike friendly behavior."],"answer":1,"explanation":"The guide recommends a handshake and notes the importance of personal space; competent adaptation avoids stereotyping the individual.","quick_rule":"Behavioral cue first; avoid national stereotypes.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Proxemics"},{"id":"WC2Q005","module":"World Cultures","subcategory":"Germany","topic":"Cross-Theory Distinction","difficulty":"C","question_type":"T2","question":"Which concept best explains the *form* of a message when a German manager states criticism explicitly and precisely?","options":["Anxiety/Uncertainty Management.","A relatively direct/low-context communication pattern.","Proxemics.","Individualism by itself."],"answer":1,"explanation":"The question concerns how explicitly meaning is encoded, which points to context/directness rather than group orientation or spatial behavior.","quick_rule":"Message explicitness → context/directness.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Hall"},{"id":"WC2Q006","module":"World Cultures","subcategory":"Germany","topic":"Gift Etiquette","difficulty":"C","question_type":"T3","question":"According to the official guide, which approach to gifts in an early German business relationship is safest?","options":["Treat gift-giving as obligatory at every meeting.","Give an expensive gift before negotiations to demonstrate commitment.","Do not rely on gifts to build the relationship; if one is given later, keep it modest and appropriate."],"answer":2,"explanation":"The guide says gifts are not common and may be inappropriate; a small, good-quality gift may be acceptable after negotiations or agreements.","quick_rule":"Germany: gifts are not a default relationship-building tool.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q007","module":"World Cultures","subcategory":"Germany","topic":"Best Response","difficulty":"C","question_type":"T4","question":"You are delayed and will reach a German appointment ten minutes late. What is the best response?","options":["Cancel automatically because any lateness makes the meeting impossible.","Say nothing because a ten-minute delay is culturally insignificant.","Call ahead, explain the delay, and arrive as soon as possible.","Send a gift instead of notifying the other party."],"answer":2,"explanation":"The guide treats punctuality seriously but explicitly recommends calling ahead when delayed.","quick_rule":"Norm + repair strategy matters more than rigid rule memorization.","source_ids":["SRC28"],"source_url":"https://www.trade.gov/country-commercial-guides/germany-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q008","module":"World Cultures","subcategory":"France","topic":"Formality","difficulty":"B","question_type":"T3","question":"Which feature is emphasized in the official guide to French business behavior?","options":["Deliberate informality from the first meeting.","Courtesy and a degree of formality.","Avoiding hierarchical titles in professional settings."],"answer":1,"explanation":"The guide identifies courtesy and formality as central characteristics of French business behavior.","quick_rule":"France: courtesy + formality.","source_ids":["SRC29"],"source_url":"https://www.trade.gov/country-commercial-guides/france-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q009","module":"World Cultures","subcategory":"France","topic":"Titles","difficulty":"B","question_type":"T4","question":"A visitor is unsure how to address a senior French executive at a first meeting. Which choice is most appropriate?","options":["Respect the person’s professional or hierarchical title until a less formal form is invited.","Use a nickname immediately.","Avoid any title because equality requires first-name address.","Address only by job function and never by name."],"answer":0,"explanation":"The official guide states that appointment schedules and hierarchical titles should be respected.","quick_rule":"Titles matter in formal French business interaction.","source_ids":["SRC29"],"source_url":"https://www.trade.gov/country-commercial-guides/france-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q010","module":"World Cultures","subcategory":"France","topic":"Handshake","difficulty":"B","question_type":"T3","question":"According to the official guide, a handshake in French business settings is customary:","options":["at the opening and closing of a business meeting.","only between people who already know each other well.","only when a contract is signed."],"answer":0,"explanation":"The guide states that a handshake is customary upon initiating and closing a business meet
