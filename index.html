":"Intangible heritage concerns knowledge and practice, not merely a material object.","quick_rule":"ICH often protects practice, not just object.","source_ids":["SRC43"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q060","module":"Chinese Culture","subcategory":"Cultural Heritage","topic":"Acupuncture & Moxibustion","difficulty":"A","question_type":"T3","question":"Acupuncture and moxibustion of traditional Chinese medicine were inscribed on UNESCO’s Representative List in:","options":["2010","2020","2001"],"answer":0,"explanation":"The element was inscribed in 2010.","quick_rule":"Acupuncture & moxibustion → 2010.","source_ids":["SRC43"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q061","module":"Chinese Culture","subcategory":"Cultural Heritage","topic":"Heritage Evidence","difficulty":"C","question_type":"T2","question":"Which statement is methodologically correct?","options":["UNESCO heritage recognition documents cultural significance; it should not be treated as proof of every scientific or medical claim connected to a tradition.","UNESCO inscription automatically proves clinical efficacy.","World Heritage status and medical regulation are the same process."],"answer":0,"explanation":"Heritage recognition concerns cultural safeguarding and significance, not automatic validation of unrelated scientific claims.","quick_rule":"heritage recognition ≠ scientific proof.","source_ids":["SRC43"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q062","module":"Chinese Culture","subcategory":"Cultural Heritage","topic":"ICH vs World Heritage","difficulty":"B","question_type":"T2","question":"Which is a World Heritage property rather than an intangible heritage element?","options":["The Great Wall","Chinese calligraphy","Taijiquan"],"answer":0,"explanation":"The Great Wall is a World Heritage property; calligraphy and Taijiquan are ICH elements.","quick_rule":"Great Wall = World Heritage.","source_ids":["SRC48","SRC09","SRC11"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q063","module":"Chinese Culture","subcategory":"Cultural Heritage","topic":"ICH vs World Heritage","difficulty":"B","question_type":"T2","question":"Which is an intangible cultural heritage element rather than a World Heritage property?","options":["Chinese calligraphy","Mogao Caves","Summer Palace"],"answer":0,"explanation":"Chinese calligraphy is ICH; Mogao Caves and Summer Palace are World Heritage properties.","quick_rule":"Calligraphy = ICH.","source_ids":["SRC09","SRC48"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q064","module":"Chinese Culture","subcategory":"Cultural Heritage","topic":"Memory of the World","difficulty":"B","question_type":"T2","question":"Chinese oracle-bone inscriptions are especially associated with which UNESCO programme?","options":["Memory of the World","World Network of Biosphere Reserves","Intangible Cultural Heritage Representative List"],"answer":0,"explanation":"The Chinese oracle-bone inscriptions are listed in UNESCO’s Memory of the World programme.","quick_rule":"oracle bones → Memory of the World.","source_ids":["SRC51"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q065","module":"Chinese Culture","subcategory":"Cultural Heritage","topic":"UNESCO Systems","difficulty":"C","question_type":"T2","question":"Which classification is correct?","opt l knowledge changes far less frequently.","quick_rule":"dynamic count → date-stamp.","source_ids":["SRC43","SRC48"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q071","module":"Chinese Culture","subcategory":"China & the World","topic":"Silk Roads","difficulty":"A","question_type":"T3","question":"The Silk Roads: Chang’an–Tianshan Corridor was inscribed on the World Heritage List in:","options":["2014","2008","2024"],"answer":0,"explanation":"The transnational corridor was inscribed in 2014.","quick_rule":"Silk Roads corridor → 2014.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q072","module":"Chinese Culture","subcategory":"China & the World","topic":"Silk Roads","difficulty":"B","question_type":"T3","question":"The Chang’an–Tianshan Corridor is a transnational World Heritage property shared by:","options":["China, Kazakhstan and Kyrgyzstan","China, Japan and the Republic of Korea","China, India and Nepal"],"answer":0,"explanation":"The property is shared by China, Kazakhstan and Kyrgyzstan.","quick_rule":"Silk Roads corridor → China + Kazakhstan + Kyrgyzstan.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q073","module":"Chinese Culture","subcategory":"China & the World","topic":"Silk Roads","difficulty":"C","question_type":"T2","question":"Which statement best captures the historical significance of the Silk Roads?","options":["They enabled exchanges of goods as well as religions, knowledge, technology, cultural practices and arts.","They were a single road used only for silk exports.","They connected only two cities and had no cultural effects."],"answer":0,"explanation":"UNE ulty":"B","question_type":"T3","question":"In the UNESCO corridor, Chang’an is associated with present-day:","options":["Xi’an","Beijing","Guangzhou"],"answer":0,"explanation":"The corridor starts from Chang’an/Luoyang, and ancient Chang’an corresponds to present-day Xi’an.","quick_rule":"Chang’an → Xi’an.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q077","module":"Chinese Culture","subcategory":"China & the World","topic":"Zhang Qian","difficulty":"C","question_type":"T2","question":"Which statement about Zhang Qian and the Silk Roads is the most careful?","options":["His Han-era missions are important to histories of western connections, but he should not be called the sole creator of the entire Silk Roads network.","He built every route personally.","The Silk Roads began only after his death and had no Han connection."],"answer":0,"explanation":"The routes evolved over time; Han-era contacts expanded long-distance links but the network cannot be reduced to one founder.","quick_rule":"Zhang Qian important ≠ sole creator.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q078","module":"Chinese Culture","subcategory":"China & the World","topic":"Oracle-Bone Inscriptions","difficulty":"B","question_type":"T3","question":"Chinese oracle-bone inscriptions are especially important for the study of:","options":["late Shang history and early Chinese writing","Ming maritime navigation only","modern simplified-character reform only"],"answer":0,"explanation":"Oracle bones preserve early writing and records from the late Shang context.","quick_rule":"oracle bones → Shang + early writing.","source_ids":["SRC51"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q079","module":"Chinese Culture","subcategory":"China & the World","topic":"Oracle-Bone Inscriptions","difficulty":"C","question_type":"T2","question":"Why does UNESCO place oracle-bone inscriptions under Memory of the World rather than ICH?","options":["The programme safeguards documentary heritage; the inscriptions are documentary records.","They are a living festival practice.","They are a natural landscape."],"answer":0,"explanation":"Memory of the World concerns documentary heritage, which fits the inscribed oracle-bone records.","quick_rule":"documentary heritage → Memory of the World.","source_ids":["SRC51"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q080","module":"Chinese Culture","subcategory":"China & the World","topic":"Intercultural Framing","difficulty":"C","question_type":"T4","question":"Which sentence gives the strongest intercultural interpretation of the Silk Roads?","options":["They illustrate long-term contact in which material exchange and cultural transformation moved across multiple societies.","They prove civilizations developed in complete isolation.","They show cultural exchange always moves in only one direction."],"answer":0,"explanation":"The corridor demonstrates interaction across many civilizations and forms of exchange.","quick_rule":"exchange is multidirectional.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A","theory_link":"Cultural exchange"},{"id":"CC3Q081","module":"Chinese Culture","subcategory":"China & the World","topic":"Heritage Cooperation","difficulty":"C","question_type":"T2","question":"What makes the Chang’an–Tianshan Corridor especially useful for a cross-cultural competition question?","options":["It is itself a jointly inscribed transnational heritage property linking several societies.","It is a purely domestic site with no cross-border dimension.","It is an intangible festival held in one village."],"answer":0,"explanation":"Its transnational inscription and exchange history directly embody cross-cultural interaction.","quick_rule":"transnational heritage → cross-cultural relevance.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"CC3Q082","module":"Chinese Culture","subcategory":"China & the World","topic":"China-Central Asia","difficulty":"D","question_type":"T4","question":"A student presents the Silk Roads as evidence that “Chinese culture simply spread outward unchanged.” Which response is best?","options":["The heritage record is better understood as interaction among multiple civilizations, involving two-way and multi-directional exchange and adaptation.","Yes; cultural contact never changes the cultures involved.","No; there was no Chinese participation in Silk Roads exchange."],"answer":0,"explanation":"UNESCO stresses a network connecting multiple civilizations and varied exchanges, not one-way unchanged diffusion.","quick_rule":"exchange ≠ one-way transmission.","source_ids":["SRC50"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A","theory_link":"Intercultural exchange"},{"id":"CC3Q083","module":"Chinese Culture","subcategory":"Literature","topic":"Dream of the Red Chamber","difficulty":"A","question_type":"T3","question":"Dream of the Red Chamber is most closely associated with which author?","options":["Cao Xueqin","Luo Guanzhong","Wu Cheng’en"],"answer":0,"explanation":"Modern scholarship strongly associates the first eighty chapters with Cao Xueqin.","quick_rule":"Hongloumeng → Cao Xueqin.","source_ids":["SRC52"],"status": on_tier":"A"},{"id":"GA4Q031","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"1972 World Heritage Convention","difficulty":"B","question_type":"T5","question":"Which UNESCO convention is associated with the protection of World Cultural and Natural Heritage?","options":["1972 Convention","2003 Convention","2005 Convention"],"answer":0,"explanation":"The 1972 Convention concerns World Cultural and Natural Heritage.","quick_rule":"1972 → World Heritage.","source_ids":["SRC63"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q032","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"2003 ICH Convention","difficulty":"B","question_type":"T5","question":"Which UNESCO convention focuses on safeguarding living practices, knowledge and skills recognized by communities as cultural heritage?","options":["1972 World Heritage Convention","2005 Diversity of Cultural Expressions Convention","2003 Intangible Cultural Heritage Convention"],"answer":2,"explanation":"The 2003 Convention safeguards intangible or living heritage.","quick_rule":"2003 → living heritage / ICH.","source_ids":["SRC63"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q033","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"2005 Cultural Diversity Convention","difficulty":"B","question_type":"T5","question":"The 2005 UNESCO Convention is primarily concerned with:","options":["the safeguarding of oral traditions only","the protection and promotion of the diversity of cultural expressions","the listing of natural World Heritage sites"],"answer":1,"explanation":"The 2005 Convention addresses diversity of cultural expressions and conditions for cultural goods, services and activities to flourish.","quick_rule":"2005 → diversity of cultural expressions.","source_ids":["SRC64"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q034","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"UNESCO Conventions","difficulty":"C","question_type":"T2","question":"Which sequence correctly matches UNESCO instruments with their main focus?","options":["1972 — World Heritage; 2003 — Intangible Cultural Heritage; 2005 — Diversity of Cultural Expressions","1972 — ICH; 2003 — World Heritage; 2005 — Peacekeeping","1972 — Documentary Heritage; 2003 — Trade; 2005 — Public Health"],"answer":0,"explanation":"The three conventions have distinct but complementary cultural-governance functions.","quick_rule":"1972 WH / 2003 ICH / 2005 expressions.","source_ids":["SRC63","SRC64"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q035","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"World Heritage vs ICH","difficulty":"C","question_type":"T2","question":"Which item is best suited to the framework of the 2003 Intangible Cultural Heritage Convention rather than the 1972 World Heritage Convention?","options":["A monumental archaeological complex of outstanding universal value","A protected natural landscape","A community's transmitted ritual practices and traditional craftsmanship knowledge"],"answer":2,"explanation":"The 2003 Convention focuses on living practices, expressions, knowledge and skills; the 1972 Convention covers cultural and natural properties.","quick_rule":"Living practice → ICH; site/property → World Heritage.","source_ids":["SRC63"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q036","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"World Heritage vs ICH","difficulty":"C","question_type":"T4","question":"A student proposes nominating 'a community's continuously transmitted oral tradition' as a natural World Heritage property. What is the strongest correction?","options":["Oral traditions cannot be recognized by UNESCO in any form.","It is better understood as intangible cultural heritage because it is a living practice transmitted by a community.","It must be a WTO trade issue."],"answer":1,"explanation":"Oral traditions are a classic domain of intangible cultural heritage under the 2003 Convention.","quick_rule":"Oral tradition → ICH.","source_ids":["SRC63"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q037","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"2005 Convention","difficulty":"C","question_type":"T2","question":"Which issue is most directly aligned with UNESCO's 2005 Convention?","options":["Creating conditions for diverse cultural goods, services and creative expressions to be produced and shared","Determining which monuments have outstanding universal value","Coordinating epidemic surveillance"],"answer":0,"explanation":"The 2005 Convention addresses the diversity of cultural expressions, including cultural and creative sectors.","quick_rule":"Creative expressions and cultural industries → 2005.","source_ids":["SRC64"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q038","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"2003 vs 2005","difficulty":"C","question_type":"T2","question":"Which distinction is most accurate?","options":["The 2003 and 2005 Conventions are identical except for their names.","The 2005 Convention replaced the 1972 World Heritage Convention.","The 2003 Convention emphasizes safeguarding living heritage transmitted by communities, while the 2005 Convention focuses on diversity in cultural expressions and cultural goods/services."],"answer":2,"explanation":"UNESCO explicitly distinguishes the safeguarding of community-based living heritage from the production and circulation of diverse cultural expressions.","quick_rule":"2003 = transmission; 2005 = expressions/creative sectors.","source_ids":["SRC63","SRC64"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q039","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"Memory of the World","difficulty":"B","question_type":"T5","question":"UNESCO's Memory of the World Programme is primarily concerned with:","options":["international trade rules","documentary heritage","intangible festival practices"],"answer":1,"explanation":"Memory of the World focuses on documentary heritage such as archives and documentary collections.","quick_rule":"Memory of the World → documentary heritage.","source_ids":["SRC65"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q040","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"Memory of the World","difficulty":"B","question_type":"T5","question":"In which year did UNESCO launch the Memory of the World Programme?","options":["1992","1972","2003"],"answer":0,"explanation":"UNESCO launched the Memory of the World Programme in 1992.","quick_rule":"Memory of the World → 1992.","source_ids":["SRC65"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q041","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"Heritage Classification","difficulty":"C","question_type":"T2","question":"Which classification is correct?","options":["Ancient manuscript collection — WTO; traditional ritual practice — World Heritage only; historic monument — WHO","All three belong to the same UNESCO programme.","Ancient manuscript collection — Memory of the World; traditional ritual practice — ICH; historic monument — World Heritage"],"answer":2,"explanation":"Documentary, intangible and site-based heritage are addressed through different UNESCO frameworks.","quick_rule":"Documents / practices / sites → three different frameworks.","source_ids":["SRC63","SRC65"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q042","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"ICH Safeguarding","difficulty":"C","question_type":"T2","question":"Which statement best reflects UNESCO's approach to intangible cultural heritage?","options":["Only experts, not communities, should define and safeguard the heritage.","Safeguarding should support continued transmission and recreation by communities rather than freezing a practice unchanged.","Inscription proves one cultural practice is superior to similar practices elsewhere."],"answer":1,"explanation":"The 2003 Convention treats ICH as living heritage recreated by communities and emphasizes safeguarding and transmission.","quick_rule":"ICH = living + community-based + transmitted.","source_ids":["SRC63"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q043","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"Intercultural Dialogue","difficulty":"C","question_type":"T4","question":"A cultural-policy project aims to increase the range of cultural expressions available and support creators from diverse backgrounds. Which UNESCO framework is most directly relevant?","options":["2005 Convention on the Diversity of Cultural Expressions","1972 World Heritage Convention","UN Security Council Charter"],"answer":0,"explanation":"The 2005 Convention is designed to protect and promote diverse cultural expressions and support cultural sectors.","quick_rule":"Creators + cultural expressions → 2005 Convention.","source_ids":["SRC64"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q044","module":"Global Awareness","subcategory":"Global Cultural Governance","topic":"UNESCO Frameworks","difficulty":"D","question_type":"T2","question":"Which statement best captures the relationship among UNESCO's 1972, 2003 and 2005 cultural conventions?","options":["Each convention simply updates and cancels the previous one.","All three focus exclusively on monuments.","They address different dimensions of culture and heritage and operate as complementary rather than interchangeable frameworks."],"answer":2,"explanation":"UNESCO describes these instruments as addressing distinct areas: tangible/natural heritage, living heritage, and diversity of cultural expressions.","quick_rule":"Complementary frameworks, different objects.","source_ids":["SRC63","SRC64"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q045","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Sustainable Development Goals","difficulty":"B","question_type":"T5","question":"How many Sustainable Development Goals are included in the 2030 Agenda?","options":["21","17","15"],"answer":1,"explanation":"The 2030 Agenda contains 17 Sustainable Development Goals.","quick_rule":"SDGs → 17.","source_ids":["SRC66"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q046","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"2030 Agenda","difficulty":"C","question_type":"T2","question":"Which statement about the SDGs is correct?","options":["They form a 17-goal framework within the 2030 Agenda and cover social, economic and environmental dimensions.","They are a WTO agreement consisting of 27 trade rules.","They apply only to climate policy."],"answer":0,"explanation":"The SDGs are a broad sustainable-development framework, not a climate-only programme.","quick_rule":"17 goals, broad development framework.","source_ids":["SRC66"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q047","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Pact for the Future","difficulty":"B","question_type":"T5","question":"When was the Pact for the Future adopted by world leaders at the UN Summit of the Future?","options":["22 September 2025","1 January 2030","22 September 2024"],"answer":2,"explanation":"The Pact for the Future was adopted on 22 September 2024.","quick_rule":"Pact for the Future → 22 Sep 2024.","source_ids":["SRC67"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q048","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Pact for the Future","difficulty":"C","question_type":"T2","question":"Which two documents were adopted as annexes to the Pact for the Future?","options":["World Heritage Convention and 2030 Agenda","Global Digital Compact and Declaration on Future Generations","Paris Agreement and UN Charter"],"answer":1,"explanation":"The Pact's two annexes are the Global Digital Compact and the Declaration on Future Generations.","quick_rule":"Pact annexes → GDC + Future Generations.","source_ids":["SRC67"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q049","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Global Digital Compact","difficulty":"B","question_type":"T5","question":"The Global Digital Compact was adopted as:","options":["an annex to the Pact for the Future","a new WTO trade agreement","a protocol to the World Heritage Convention"],"answer":0,"explanation":"The Global Digital Compact is one of the two annexes to the Pact for the Future.","quick_rule":"GDC → Pact annex.","source_ids":["SRC67"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q050","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Global Digital Compact","difficulty":"C","question_type":"T2","question":"Which issue is most directly associated with the Global Digital Compact?","options":["listing natural World Heritage sites","allocating seats on the UN Security Council","international digital cooperation and governance of digital technologies"],"answer":2,"explanation":"The Compact addresses digital cooperation, inclusion, data and technology governance, including AI governance.","quick_rule":"Digital cooperation → Global Digital Compact.","source_ids":["SRC67"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q051","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Declaration on Future Generations","difficulty":"B","question_type":"T5","question":"The Declaration on Future Generations is:","options":["a WTO accession agreement","an annex to the Pact for the Future","one of the six principal organs of the UN"],"answer":1,"explanation":"The Declaration was adopted as the second annex to the Pact for the Future.","quick_rule":"Future Generations → Pact annex.","source_ids":["SRC67"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q052","module":"Global Awareness","subcategory":"UN Global Frameworks","topic":"Pact vs SDGs","difficulty":"C","question_type":"T2","question":"Which statement is most accurate?","options":["The Pact for the Future does not replace the 2030 Agenda; it addresses a broader set of global-governance challenges while reaffirming sustainable-development commitments.","The Pact abolished the SDGs.","The SDGs were adopted as an annex to the Pact in 2024."],"answer":0,"explanation":"The Pact builds on existing commitments, including the 2030 Agenda, rather than replacing them.","quick_rule":"Pact complements; it does not cancel SDGs.","source_ids":["SRC67","SRC66"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q053","module":"Global Awareness","subcategory":"Recent Global Events","topic":"COP30","difficulty":"B","question_type":"T5","question":"Where was COP30, the 2025 UN Climate Change Conference, held?","options":["Dubai, United Arab Emirates","Baku, Azerbaijan","Belém, Brazil"],"answer":2,"explanation":"COP30 was held in Belém, Brazil, in November 2025.","quick_rule":"COP30 → Belém, Brazil.","source_ids":["SRC68"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q054","module":"Global Awareness","subcategory":"Recent Global Events","topic":"COP30","difficulty":"B","question_type":"T5","question":"COP30 took place in which year?","options":["2026","2025","2024"],"answer":1,"explanation":"The 30th UN Climate Change Conference was held in November 2025.","quick_rule":"COP30 → 2025.","source_ids":["SRC68"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q055","module":"Global Awareness","subcategory":"Recent Global Events","topic":"COP30","difficulty":"C","question_type":"T2","question":"Which pairing is correct?","options":["COP30 — Belém, Brazil","COP30 — Baku, Azerbaijan","COP30 — Dubai, United Arab Emirates"],"answer":0,"explanation":"Belém hosted COP30 in 2025.","quick_rule":"30 → Belém.","source_ids":["SRC68"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q056","module":"Global Awareness","subcategory":"Recent Global Events","topic":"Dynamic Fact Checking","difficulty":"C","question_type":"T4","question":"A practice question written in 2024 says 'ASEAN has ten members.' What should a 2026 training system do?","options":["Keep it unchanged because competition facts never expire.","Change the answer to 27 because that is the EU membership count.","Flag the item for updating because Timor-Leste became ASEAN's 11th member in 2025."],"answer":2,"explanation":"Dynamic institutional membership must be refreshed against current official sources.","quick_rule":"Current affairs → date-stamp and refresh.","source_ids":["SRC62"],"status":"official_guided_simulation","dynamic_fact":true,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q057","module":"Global Awareness","subcategory":"Recent Global Events","topic":"Dynamic Fact Checking","difficulty":"C","question_type":"T4","question":"Which fact most clearly requires periodic refreshing before the competition?","options":["The fact that the SDGs number 17","The current number of WTO members","The year the 2003 ICH Convention was adopted"],"answer":1,"explanation":"Membership counts can change, whereas the adoption year of a convention and the original number of SDGs are stable historical facts.","quick_rule":"Membership/leadership = dynamic; adoption year = stable.","source_ids":["SRC58","SRC63","SRC66"],"status":"official_guided_simulation","dynamic_fact":true,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q058","module":"Global Awareness","subcategory":"Recent Global Events","topic":"Institution Recognition","difficulty":"C","question_type":"T4","question":"A question mentions 2025, Belém and the UN climate process. Which answer should immediately come to mind?","options":["COP30","Global Digital Compact","WTO Ministerial Conference"],"answer":0,"explanation":"Belém hosted COP30 in November 2025.","quick_rule":"Belém 2025 → COP30.","source_ids":["SRC68"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q059","module":"Global Awareness","subcategory":"Recent Global Events","topic":"Global Governance","difficulty":"C","question_type":"T2","question":"Which event-document match is correct?","options":["COP30 2025 — Global Digital Compact adopted as a climate treaty","ASEAN Summit 2025 — creation of the European Union","Summit of the Future 2024 — Pact for the Future"],"answer":2,"explanation":"The Pact for the Future was the central outcome of the UN Summit of the Future in September 2024.","quick_rule":"Summit of the Future → Pact.","source_ids":["SRC67"],"status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"A"},{"id":"GA4Q060","module":"Global Awareness","subcategory":"Recent Global Events","topic":"Integrated Awareness","difficulty":"D","question_type":"T2","question":"Which set contains only facts that are current and accurate as of October 2026?","options":["ASEAN h const EXTRA_KNOWLEDGE_CARDS = {"Intercultural Theory|Iceberg Model":{"key":"Intercultural Theory|Iceberg Model","module":"Intercultural Theory","title":"Iceberg Model of Culture","subtitle":"文化冰山模型","summary":"Use the iceberg model to separate visible cultural products from deeper values, assumptions and worldview. It is a framing tool rather than a predictive law.","rules":["Visible layer: food, dress, language, rituals, festivals and observable etiquette.","Hidden layer: values, beliefs, assumptions, attitudes to authority, concepts of self, time and relationships.","Misunderstandings often arise when people react to visible behavior without examining the hidden assumptions behind it."],"traps":["The model simplifies reality; culture is not literally split into only two layers.","Visible difference does not automatically mean deep value conflict."],"topics":["Visible culture","Hidden assumptions","Values","Behavior"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"iceberg","memory":"Remember: what you notice first is only the tip; most meaning sits under the waterline."},"Intercultural Theory|Bennett DMIS":{"key":"Intercultural Theory|Bennett DMIS","module":"Intercultural Theory","title":"Bennett’s DMIS","subtitle":"本尼特跨文化敏感性发展模式","summary":"DMIS explains movement from ethnocentric to ethnorelative orientations in how people interpret cultural difference.","rules":["Ethnocentric stages: Denial → Defense → Minimization.","Ethnorelative stages: Acceptance → Adaptation → Integration.","Progress means greater ability to interpret difference without reducing it to threat or sameness."],"traps":["The stages are developmental tendencies, not rigid labels for judging people.","Minimization can sound tolerant but may erase real difference."],"topics":["Ethnocentrism","Ethnorelativism","Adaptation"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"dmis","memory":"Think of a staircase from “They are wrong” to “Difference can be understood and integrated.”"},"Intercultural Theory|Berry Acculturation":{"key":"Intercultural Theory|Berry Acculturation","module":"Intercultural Theory","title":"Berry’s Acculturation Strategies","subtitle":"贝瑞文化适应策略","summary":"Berry maps adaptation strategies with two questions: keep original culture? seek participation in the larger society?","rules":["Integration: keep original culture + participate in larger society.","Assimilation: do not maintain original culture + participate in larger society.","Separation: maintain original culture + low participation in larger society.","Marginalization: low maintenance + low participation."],"traps":["These are relational strategies shaped by context, not simply personal preference.","Integration is not the same as total assimilation."],"topics":["Acculturation","Integration","Assimilation","Separation","Marginalization"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"berry","memory":"Two yes/no questions create a four-box map."},"Intercultural Theory|Cultural Intelligence":{"key":"Intercultural Theory|Cultural Intelligence","module":"Intercultural Theory","title":"Cultural Intelligence (CQ)","subtitle":"文化智商 / 文化智力","summary":"CQ explains how people function effectively across cultural contexts through knowledge, motivation and flexible action.","rules":["Drive CQ: interest, confidence and motivation to function cross-culturally.","Knowledge CQ: understanding systems, norms and conventions.","Strategy CQ: planning, monitoring and revising one’s interpretation.","Action CQ: adapting verbal and nonverbal behavior appropriately."],"traps":["High CQ does not mean mimicking every behavior you see.","Knowledge without reflection and adjustment is not enough."],"topics":["CQ Drive","CQ Knowledge","CQ Strategy","CQ Action"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"cq","memory":"CQ works like four gears: want to learn, know the system, plan mindfully, act flexibly."},"Intercultural Theory|Identity Negotiation":{"key":"Intercultural Theory|Identity Negotiation","module":"Intercultural Theory","title":"Identity Negotiation Theory","subtitle":"身份协商理论","summary":"Identity negotiation focuses on how people seek security, inclusion, trust and recognition while presenting themselves in intercultural interaction.","rules":["Interaction quality improves when people feel understood, respected and affirmed.","Identity is not only carried by the self; it is negotiated through recognition from others.","Trust, empathy and mindful communication support smoother identity negotiation."],"traps":["Identity negotiation is broader than face-saving in a single conflict episode.","Recognition does not require full agreement."],"topics":["Identity security","Inclusion","Trust","Recognition"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"identityneg","memory":"Ask: Do I feel seen, safe and recognized here?"},"Intercultural Theory|CTI":{"key":"Intercultural Theory|CTI","module":"Intercultural Theory","title":"Communication Theory of Identity (CTI)","subtitle":"身份传播理论","summary":"CTI explains identity through layered frames and the gaps that can emerge among them.","rules":["Personal frame: self-concept.","Enacted frame: identity communicated in interaction.","Relational frame: identity shaped in relationships.","Communal frame: identity grounded in group membership."],"traps":["A mismatch between frames is common and analytically important.","Do not reduce identity to nationality alone."],"topics":["Personal frame","Enacted frame","Relational frame","Communal frame"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"cti","memory":"Think nested circles plus possible gaps between how I see myself and how identity is enacted or recognized."},"Intercultural Theory|URT":{"key":"Intercultural Theory|URT","module":"Intercultural Theory","title":"Uncertainty Reduction Theory (URT)","subtitle":"不确定性降低理论","summary":"URT examines how people seek information in initial interactions to make others more predictable and understandable.","rules":["Passive strategy: observe.","Active strategy: seek information indirectly, for example through others or background research.","Interactive strategy: ask directly and engage."],"traps":["URT focuses on early interaction and prediction; AUM adds anxiety and mindful management.","More information is useful only if interpreted carefully."],"topics":["Initial interaction","Information seeking","Prediction"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"urt","memory":"Three moves: watch, research, ask."},"Intercultural Theory|EVT":{"key":"Intercultural Theory|EVT","module":"Intercultural Theory","title":"Expectancy Violations Theory (EVT)","subtitle":"期待违背理论","summary":"EVT explains what happens when behavior departs from what we expected, especially in nonverbal and interactional contexts.","rules":["People hold expectations about distance, tone, turn-taking and appropriateness.","A violation triggers interpretation: positive, negative or ambiguous.","The effect depends on context, relationship and perceived reward/credibility of the communicator."],"traps":["A violation is not automatically bad.","Do not confuse expectation violation with direct cultural disrespect before checking context."],"topics":["Expectations","Nonverbal communication","Interpretation"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"evt","memory":"Expectation → surprise → interpretation."},"Intercultural Theory|Attribution":{"key":"Intercultural Theory|Attribution","module":"Intercultural Theory","title":"Attribution Theory","subtitle":"归因理论","summary":"Attribution theory explains how people interpret causes of behavior and why they may misread others across cultural contexts.","rules":["Internal attribution: explain behavior by personality, intention or character.","External attribution: explain behavior by situation, role, rules or context.","Intercultural errors often arise when situational constraints are ignored."],"traps":["Fundamental attribution error overweights personal causes.","One unfamiliar behavior should not trigger sweeping character judgments."],"topics":["Internal attribution","External attribution","Attribution error"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"attribution","memory":"Before judging character, ask what the situation is doing."},"Intercultural Theory|Co-cultural Theory":{"key":"Intercultural Theory|Co-cultural Theory","module":"Intercultural Theory","title":"Co-cultural Theory","subtitle":"共文化理论","summary":"Co-cultural theory studies how members of non-dominant groups communicate within structures shaped by dominant norms.","rules":["Common preferred outcomes: assimilation, accommodation, separation.","Common communication orientations: nonassertive, assertive, aggressive.","Strategies are shaped by context, risk, power and desired visibility."],"traps":["Do not collapse all non-dominant groups into one experience.","Communication choice is shaped by power structure, not only personal style."],"topics":["Power","Non-dominant groups","Communication strategy"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"cocultural","memory":"Think outcome + orientation = strategy choice."},"Intercultural Theory|Speech Codes":{"key":"Intercultural Theory|Speech Codes","module":"Intercultural Theory","title":"Speech Codes Theory","subtitle":"言语代码理论","summary":"Speech codes theory reminds us that communities develop patterned ways of speaking, valuing and interpreting communication.","rules":["Different communities develop different norms for directness, silence, emotion and authority.","Speech practices are tied to social meanings and identities.","To communicate well, identify the local code before evaluating the style."],"traps":["A community speech code is not identical to national culture.","One speaker may shift across multiple codes."],"topics":["Community norms","Meaning systems","Local speaking styles"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"speechcodes","memory":"Every group has a communication grammar beyond vocabulary."},"Intercultural Theory|Cultural Humility":{"key":"Intercultural Theory|Cultural Humility","module":"Intercultural Theory","title":"Cultural Humility","subtitle":"文化谦逊","summary":"Cultural humility stresses lifelong self-reflection, openness and attention to power rather than assuming one can completely master another culture.","rules":["Self-reflection is continuous.","Approach others with openness rather than expert certainty.","Notice power asymmetry and institutional effects, not only interpersonal style."],"traps":["Humility is not passivity or lack of standards.","Knowing facts about another culture is helpful but never complete."],"topics":["Self-reflection","Power","Lifelong learning"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"humility","memory":"From mastery posture to learning posture."},"Intercultural Theory|Third Culture Building":{"key":"Intercultural Theory|Third Culture Building","module":"Intercultural Theory","title":"Third Culture Building","subtitle":"第三文化建构","summary":"Third culture building describes how interactants create a workable shared communication space rather than insisting that one side fully adopts the other side’s norms.","rules":["Build a mutually acceptable local norm for the interaction.","Shared rules can concern timing, turn-taking, feedback or decision procedures.","The result is negotiated and practical, not culturally pure."],"traps":["Third culture is not simply splitting the difference mechanically.","A shared norm can still reflect unequal power if not examined."],"topics":["Shared norms","Negotiated interaction","Hybrid practice"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"thirdculture","memory":"Not my rules or your rules alone — build a workable “our rules.”"},"Intercultural Theory|Dialectical Approach":{"key":"Intercultural Theory|Dialectical Approach","module":"Intercultural Theory","title":"Dialectical Approach to Intercultural Communication","subtitle":"跨文化传播的辩证视角","summary":"A dialectical approach highlights tensions that coexist rather than choosing one side as permanently correct.","rules":["Common dialectics: cultural–individual, personal–contextual, differences–similarities, static–dynamic, history/past–present/future, privilege–disadvantage.","Effective analysis often requires holding both sides in view.","This approach is especially useful when binary stereotypes oversimplify reality."],"traps":["Dialectical thinking is not indecision; it is a way to handle complexity.","Similarity and difference often coexist."],"topics":["Tensions","Complexity","Context"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"dialectic","memory":"Think “both/and,” not only “either/or.”"},"Intercultural Theory|U-Curve Adaptation":{"key":"Intercultural Theory|U-Curve Adaptation","module":"Intercultural Theory","title":"U-Curve / W-Curve Adaptation","subtitle":"U型 / W型适应曲线","summary":"These adaptation curves describe emotional phases often discussed in study-abroad, migration or re-entry contexts.","rules":["U-curve: honeymoon → crisis/culture shock → recovery → adjustment.","W-curve adds re-entry shock when returning home.","The model is best used as a heuristic pattern, not a universal timeline."],"traps":["Not everyone follows the same sequence or intensity.","Emotional cycles should not replace structural analysis of support and power."],"topics":["Culture shock","Adjustment","Re-entry"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"ucurve","memory":"First excitement, then dip, then recovery; returning home can create a second dip."},"Intercultural Theory|Trompenaars":{"key":"Intercultural Theory|Trompenaars","module":"Intercultural Theory","title":"Trompenaars & Hampden-Turner","subtitle":"特罗姆彭纳斯文化维度","summary":"This framework compares how cultures handle rules, relationships, status, time and the environment, especially in organizational settings.","rules":["Universalism vs Particularism.","Individualism vs Communitarianism.","Neutral vs Emotional; Specific vs Diffuse.","Achievement vs Ascription; Sequential vs Synchronic time; Internal vs External control."],"traps":["Do not mix Trompenaars dimensions with Hofstede labels without naming the framework.","The framework is most useful for organizational and managerial comparison."],"topics":["Universalism","Particularism","Status","Time orientation"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"trompenaars","memory":"Ask how a culture handles rules, relationships, status, time and environment."},"Intercultural Theory|Social Identity Theory":{"key":"Intercultural Theory|Social Identity Theory","module":"Intercultural Theory","title":"Social Identity Theory","subtitle":"社会身份理论","summary":"Social identity theory explains how in-group and out-group categorization shapes perception, evaluation and behavior.","rules":["People classify self and others into groups.","Identification with a group can affect solidarity and bias.","Comparison between groups can shape self-esteem and behavior."],"traps":["Group identification does not erase personal identity.","In-group preference is not identical to explicit hostility."],"topics":["In-group","Out-group","Categorization","Bias"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"socialid","memory":"Who counts as “we” often changes how “they” are seen."},"Intercultural Theory|Intergroup Contact":{"key":"Intercultural Theory|Intergroup Contact","module":"Intercultural Theory","title":"Intergroup Contact Theory","subtitle":"群际接触理论","summary":"Contact theory explains how contact can reduce prejudice when the interaction conditions are supportive.","rules":["Classic facilitating conditions: equal status, common goals, cooperation and institutional support.","Meaningful contact can reduce anxiety and stereotype rigidity.","The quality of contact often matters more than simple frequency."],"traps":["Contact alone does not automatically reduce prejudice.","Unequal or competitive contact can reinforce hostility."],"topics":["Prejudice reduction","Contact conditions","Cooperation"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"contact","memory":"Contact works best when people work with, not against, each other."},"Intercultural Theory|Theory Map":{"key":"Intercultural Theory|Theory Map","module":"Intercultural Theory","title":"Intercultural Theory Map","subtitle":"跨文化理论总图","summary":"Use this atlas card as a navigation map: value frameworks, interaction theories, identity theories, adaptation theories and critical/power approaches answer different questions.","rules":["Values: Hofstede, Trompenaars, Hall’s time/context emphasis.","Interaction: AUM, URT, EVT, CAT, face, conflict styles.","Identity: Identity Negotiation, CTI, Social Identity Theory.","Adaptation: Berry, U-curve, Cross-cultural Adaptation, CQ.","Critical / power: Co-cultural Theory, Cultural Humility, Dialectical Approach."],"traps":["No single theory explains every intercultural problem.","Choose the theory that matches the mechanism highlighted by the question stem."],"topics":["Value frameworks","Interaction","Identity","Adaptation","Power"],"sourceIds":["SRC73"],"qids":[],"atlasOnly":true,"visual":"theorymap","memory":"First ask what kind of question this is, then choose the theory family."}};
