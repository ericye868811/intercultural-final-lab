const KNOWLEDGE_OVERRIDES = {"Intercultural Theory|Hall":{"title":"Hall: Context, Space & Time","subtitle":"霍尔：语境、空间与时间","summary":"Use Hall when the question asks where meaning is carried, how interpersonal space is used, or how time is organized in interaction.","rules":["High context: more meaning is inferred from context, relationship and shared knowledge.","Low context: more meaning is encoded explicitly in words.","Proxemics concerns interpersonal space.","Monochronic and polychronic orientations describe different ways of organizing time."],"traps":["High context does not mean “never direct.”","Low context is not the same concept as individualism.","National tendencies do not determine every individual interaction."]},"Intercultural Theory|Hofstede":{"title":"Hofstede Cultural Dimensions","subtitle":"霍夫斯泰德文化维度","summary":"Use Hofstede for broad societal value tendencies. Treat national scores as comparative tendencies, not personality tests for individuals.","rules":["PDI: acceptance/expectation of unequal power.","IDV: individual autonomy versus cohesive in-group ties.","UAI: discomfort with ambiguity and uncertainty.","LTO: pragmatic future orientation versus stronger short-term norm orientation.","IVR: relative freedom versus social restraint of gratification."],"traps":["UAI is not simply financial risk aversion.","Do not infer an individual personality directly from a country score.","Hofstede answers value questions; Hall answers communication-context questions."]},"Intercultural Theory|AUM":{"title":"Anxiety/Uncertainty Management Theory","subtitle":"焦虑/不确定性管理理论","summary":"AUM explains effective interaction with unfamiliar others through the management of predictive uncertainty and affective anxiety.","rules":["Uncertainty: difficulty predicting or explaining another person.","Anxiety: emotional unease about the interaction.","Effective communication requires manageable ranges, not zero anxiety and zero uncertainty.","Information seeking and mindful attention can reduce poor assumptions."],"traps":["AUM is interpersonal/intergroup; Hofstede UAI is a cultural-value dimension.","Too much certainty can produce overconfidence.","High anxiety can narrow information processing and encourage simplistic judgments."]},"Intercultural Theory|Face Negotiation":{"title":"Face-Negotiation Theory","subtitle":"面子协商理论","summary":"Use face theory when the stem highlights dignity, embarrassment, reputation, public image or the desire to protect self/other social identity during conflict.","rules":["Self-face: concern for one’s own social image.","Other-face: concern for the other person’s image.","Mutual-face: concern for both parties and the relationship.","Face concern helps explain why a strategy is chosen; conflict style describes how conflict is handled."],"traps":["Concern for face does not automatically mean avoidance.","Hierarchy may shape the setting, but embarrassment/dignity points more directly to face."]},"Intercultural Theory|Conflict Management":{"title":"Conflict Management Styles","subtitle":"冲突管理风格","summary":"Recognize the five common styles through concern for self and concern for others, then distinguish problem-solving from concession.","rules":["Integrating = high self + high other = joint problem solving.","Dominating = high self + low other.","Obliging = low self + high other.","Avoiding = low active concern for both in the immediate conflict.","Compromising = mutual concessions / middle ground."],"traps":["Integrating is not the same as splitting the difference.","No single style is universally best in every context."]},"Intercultural Theory|CAT":{"title":"Communication Accommodation Theory (CAT)","subtitle":"沟通顺应理论","summary":"CAT explains why and how people adjust communicative behavior during interaction and how those adjustments affect social distance and identity.","rules":["Convergence: become more communicatively similar.","Divergence: accentuate communicative difference.","Maintenance: keep one’s style without moving closer or farther.","Accommodation can involve speech rate, vocabulary, accent, register and other communicative features."],"traps":["Convergence is not automatically positive.","Local accommodation does not imply abandoning cultural identity.","CAT is interaction-level; cross-cultural adaptation is broader and longer-term."]},"Intercultural Theory|Identity":{"title":"Cultural & Social Identity","subtitle":"文化与社会身份","summary":"Identity is multiple, socially negotiated and context-sensitive. Different identities can become salient in different interactions.","rules":["People can hold national, regional, linguistic, professional, gender, student and many other identities simultaneously.","Identity salience changes by context.","Identity emerges through both self-understanding and social interaction."],"traps":["Nationality does not fully determine identity.","One international student cannot represent an entire society."]},"Intercultural Theory|Intercultural Competence":{"title":"Intercultural Competence","subtitle":"跨文化能力","summary":"Intercultural competence is about communicating effectively and appropriately while remaining attentive to context, multiple perspectives and evidence.","rules":["Use cultural knowledge as a hypothesis, not a verdict.","Clarify expectations when meanings conflict.","Seek multiple perspectives before judging.","Adapt provisionally and revise assumptions when new evidence appears."],"traps":["Directness is not universally superior.","Avoid essentializing whole national groups."]},"Intercultural Theory|Adaptation":{"title":"Cross-Cultural Adaptation","subtitle":"跨文化适应","summary":"Cross-cultural adaptation concerns broader, ongoing adjustment to living and communicating in a new cultural environment.","rules":["Think stress → adaptation → growth.","Adaptation unfolds through repeated learning and revision.","It is broader and longer-term than accommodation within one encounter."],"traps":["Adaptation does not require total assimilation.","One successful conversation does not complete adaptation."]},"Intercultural Theory|Nonverbal Communication":{"title":"Nonverbal Communication","subtitle":"非言语交际","summary":"Identify the communication channel first, then interpret it in context rather than assuming one universal meaning.","rules":["Proxemics = space/distance.","Kinesics = body movement/gesture/posture.","Haptics = touch.","Chronemics = time.","Paralanguage = tone, pace, volume and pitch beyond words."],"traps":["Eye contact, silence, touch and gestures can carry different meanings across contexts.","Mixed verbal/nonverbal cues call for clarification."]},"Intercultural Theory|Bias":{"title":"Stereotype, Prejudice & Discrimination","subtitle":"刻板印象、偏见与歧视","summary":"Distinguish cognition, evaluation and behavior. This three-step contrast is highly testable in short multiple-choice questions.","rules":["Stereotype = generalized belief.","Prejudice = evaluative attitude/feeling.","Discrimination = differential behavior/treatment."],"traps":["A stereotype can be positive-sounding and still overgeneralize.","Do not use one group belief to predict an individual."]},"Intercultural Theory|Integrated Theory":{"title":"Integrated Theory Diagnosis","subtitle":"综合理论辨析","summary":"When several theories appear plausible, identify what the stem is actually asking: message, cultural value, anxiety/prediction, social image, strategy, or behavioral adjustment.","rules":["Message/context → Hall.","Cultural value tendency → Hofstede.","Anxiety + prediction → AUM.","Dignity/image → Face.","Conflict behavior → conflict style.","Communication adjustment → CAT."],"traps":["One situation can involve several theories; choose the mechanism emphasized by the question."]},"Intercultural Scenarios|Business Negotiation":{"title":"Business Negotiation","subtitle":"商务谈判","summary":"Negotiate both task and relationship expectations explicitly: clarify indirect responses, decision rights, timing, face concerns and underlying interests.","rules":["Clarify ambiguous commitment rather than forcing a yes/no interpretation.","Use integrating problem solving when interests can be redesigned.","Treat cultural briefings as hypotheses and update them with actual interaction."],"traps":["Do not label relationship-oriented behavior as unprofessional.","Do not equate compromise with integration."]},"Intercultural Scenarios|Classroom & Teamwork":{"title":"Classroom & Teamwork","subtitle":"课堂与团队合作","summary":"Design participation and decision processes so different communication styles can contribute without turning differences into stereotypes.","rules":["Offer multiple channels for participation.","Make feedback and turn-taking norms explicit.","Separate task criticism from personal judgment."],"traps":["Silence does not automatically mean disengagement or agreement.","One student does not represent a whole country."]},"Intercultural Scenarios|Social Interaction":{"title":"Social Interaction","subtitle":"日常社交","summary":"Use low-risk adaptation, observation and clarification for personal space, touch, silence, compliments, names and indirect responses.","rules":["Follow comfort cues for space and touch.","Treat silence and indirectness as context-dependent.","Repair face threats by acknowledging impact and reducing public embarrassment."],"traps":["Friendly behavior is not universally interpreted the same way.","Avoid assigning one national explanation to a single behavior."]},"Intercultural Scenarios|Workplace & Hierarchy":{"title":"Workplace & Hierarchy","subtitle":"职场与层级","summary":"Distinguish hierarchy, face, participation and conflict mechanisms. Make roles and decision rights explicit before attributing problems to culture.","rules":["Hierarchy can be one factor without defining every employee.","Public embarrassment → face; rank expectations → Power Distance.","Use multiple channels for employee input."],"traps":["Do not treat quiet participation as lack of ideas.","Do not use country scores as individual personality tests."]},"Intercultural Scenarios|Virtual & Global Teams":{"title":"Virtual & Global Teams","subtitle":"虚拟与全球团队","summary":"Virtual communication magnifies ambiguity around tone, silence, response time and turn-taking, so teams benefit from explicit shared protocols.","rules":["Set response-time and acknowledgment norms.","Use multiple channels and rotate time-zone burdens.","Move conflict to a richer channel when text escalates ambiguity."],"traps":["Written communication is not culture-free.","Silence in chat does not automatically mean disagreement."]},"Intercultural Scenarios|Travel & Hospitality":{"title":"Travel & Hospitality","subtitle":"旅行与接待","summary":"When local etiquette is uncertain, observe the host, use low-risk behavior and verify current norms with reliable local or official sources.","rules":["Observe before initiating unfamiliar touch or greetings.","Verify gift/tipping norms from reliable sources.","Adapt language for comprehension without patronizing."],"traps":["One guidebook rule should not override current local context.","One unusual observation is not enough to infer a national norm."]},"Intercultural Scenarios|Integrated Scenario":{"title":"Integrated Scenario Judgment","subtitle":"综合情境判断","summary":"Choose the response that combines contextual evidence, multiple perspectives, respectful clarification and proportionate adaptation.","rules":["Observe → form a hypothesis → verify.","Aim for effectiveness and appropriateness.","Avoid premature national attribution."],"traps":["The “most interculturally competent” option is rarely the most absolute one."]},"Chinese Culture|Philosophy & Values":{"title":"Chinese Philosophy & Values","subtitle":"中国思想与价值","summary":"Focus on precise distinctions among Confucian and Daoist concepts, and explain them as ethical/philosophical ideas rather than modern national personality labels.","rules":["ren → humaneness / benevolence / love of others","li → ritual propriety / appropriate conduct","xiao → respectful care for parents","Daoism → Laozi / Zhuangzi / dao","wuwei ≠ doing nothing; think non-coercive / effortless action","Zhuangzi → Daoism / perspective / spontaneity"],"traps":["Do not reduce ren to simple kindness; it belongs to a broader program of moral cultivation.","Do not confuse ren with li (ritual propriety).","li is not simply 'law'.","Do not equate ritual observance with superficial ceremony only.","Filiality is broader than financial support.","Avoid defining xiao as unconditional obedience in every situation.","Daoism is not a single uniform doctrine.","Philosophical and religious Daoism should not be treated as identical."]},"Chinese Culture|Festivals & Customs":{"title":"Festivals & Customs","subtitle":"中国节庆与习俗","summary":"Know the symbolic meaning, timing and major practices of key traditional festivals, plus UNESCO status where relevant.","rules":["Spring Festival → reunion / new year / first lunar month","Qingming → remembrance / ancestors","Dragon Boat → duanwu / boats / zongzi / 2009 UNESCO","Mid-Autumn → 8th lunar month / full moon / reunion","Chongyang → respect for elders","24 Solar Terms → seasonal timekeeping / 2016 UNESCO"],"traps":["Do not confuse it with the Lantern Festival.","UNESCO inscription year is 2024.","Do not confuse Qingming with Mid-Autumn reunion symbolism.","Its core cultural theme is remembrance rather than harvest celebration.","Do not confuse it with the Spring Festival or Mid-Autumn Festival.","UNESCO inscription year: 2009.","Do not confuse it with Qingming ancestor remembrance.","Mooncakes are a custom, but reunion is the broader symbolic theme."]},"Chinese Culture|Arts & Aesthetics":{"title":"Arts & Aesthetics","subtitle":"中国艺术与审美","summary":"Connect major art forms with their materials, techniques, aesthetic logic and UNESCO heritage status.","rules":["calligraphy → seal / clerical(official) / cursive / running / regular","seal engraving → calligraphy + carving / reverse design","Xuan paper → Jing County, Anhui / calligraphy & painting","literati painting → brushwork / self-expression / calligraphic spirit","Peking opera → traditional theatre / 2010 UNESCO","shadow puppetry → silhouettes + light + screen / 2011"],"traps":["Calligraphy is more than handwriting for communication.","UNESCO inscription year: 2009.","Do not confuse it with woodblock printing.","The seal functions as both practical mark and art form.","Do not confuse Xuan paper with a generic term for all Chinese paper.","Its craft is linked specifically to Jing County.","Do not assume traditional Chinese painting rejects all color.","Literati painting is one tradition within Chinese painting, not the entirety of it."]},"Chinese Culture|Cultural Heritage":{"title":"Cultural Heritage Systems","subtitle":"中国文化遗产体系","summary":"Distinguish UNESCO World Heritage, Intangible Cultural Heritage and related programmes; date-stamp current counts and recent inscriptions.","rules":["China ICH count (checked 2026-10-19) → 45","tea heritage → 2022 / six categories","Taijiquan → 2020 UNESCO","zhusuan → abacus calculation / 2013","acupuncture & moxibustion → 2010 UNESCO","China World Heritage (checked 2026-10-19) → 61 = 42 cultural + 15 natural + 4 mixed","Beijing Central Axis → World Heritage / 2024"],"traps":["This is a dynamic fact and must be date-stamped.","Do not confuse ICH count with World Heritage properties.","The UNESCO element is broader than one tea such as Longjing.","It covers processing knowledge and social practices, not a single product.","Do not confuse UNESCO recognition with the origin date of the practice.","It is an ICH element, not a World Heritage property.","Do not define zhusuan as simply the physical abacus; it includes knowledge and calculation practices.","Heritage recognition does not itself establish medical efficacy claims."]},"Chinese Culture|China & the World":{"title":"China & the World","subtitle":"中国与世界交流","summary":"Treat the Silk Roads and related historical evidence as networks of multidirectional exchange involving trade, religion, knowledge, technology and art.","rules":["Silk Roads corridor → 2014 / China-Kazakhstan-Kyrgyzstan / exchange","Zhang Qian → Han-era western connections / Silk Roads","oracle bones → late Shang / early Chinese writing evidence / MoW 2017"],"traps":["It was not a single road.","Its significance extends beyond commodity trade to cultural and knowledge exchange.","Do not treat Zhang Qian as the sole 'creator' of the Silk Roads.","The Silk Roads developed as interconnected networks over long periods.","Memory of the World is different from World Heritage and ICH.","Oracle bones are important for both history and the study of early Chinese writing."]},"Chinese Culture|Literature":{"title":"Chinese Literature","subtitle":"中国文学","summary":"Know major classical novels, authorship traditions, alternative titles and the distinction between literary narrative and documentary history.","rules":["Hongloumeng → Cao Xueqin / 18th century / Story of the Stone","Journey to the West → Wu Cheng'en / Xuanzang / Ming","Three Kingdoms → Luo Guanzhong / historical novel","Water Margin → 108 outlaws / Mount Liang"],"traps":["Do not confuse it with Journey to the West or Romance of the Three Kingdoms.","Its alternate title is Shitouji / The Story of the Stone.","Xuanzang is the historical monk; Sun Wukong is a literary/mythic character.","Do not confuse the historical journey with the novel's fantasy narrative.","Historical fiction is not identical to historical record.","Do not treat all scenes as documentary history.","Avoid presenting disputed authorship as completely settled.","Do not confuse it with Romance of the Three Kingdoms."]},"World Cultures|Germany":{"title":"Germany — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Germany, not as deterministic rules for every individual.","rules":["Communication: direct","Communication: structured","Formality / hierarchy: formal introductions and professional titles are important, especially initially","Time: punctuality is important; arriving slightly early is recommended","Relationship: professionalism and expertise are valued","Etiquette: remain formal until invited to become more informal"],"traps":["Direct communication should not automatically be interpreted as hostility.","Low-context/direct communication is not the same concept as individualism."]},"World Cultures|France":{"title":"France — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in France, not as deterministic rules for every individual.","rules":["Communication: courtesy and formality are emphasized","Formality / hierarchy: hierarchical titles and professional forms of address should be respected","Time: appointments should be arranged in advance and schedules respected","Relationship: informal restaurant discussions can help develop working relationships","Etiquette: handshakes are customary at the opening and closing of business meetings","Etiquette: professional attire is expected"],"traps":["Formality does not imply lack of relationship-building.","Avoid treating all European business cultures as identical."]},"World Cultures|Italy":{"title":"Italy — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Italy, not as deterministic rules for every individual.","rules":["Communication: initial interactions tend to be relatively formal","Formality / hierarchy: titles are commonly used; avoid first names until a relationship is established","Time: business appointments are expected and punctuality is recommended","Relationship: an overly abrupt 'get down to business' approach may be poorly received in early meetings","Etiquette: conservative business attire is recommended"],"traps":["Do not generalize internet 'gift taboos' without a reliable source.","Relationship orientation and punctuality can coexist."]},"World Cultures|United Kingdom":{"title":"United Kingdom — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in United Kingdom, not as deterministic rules for every individual.","rules":["Communication: professional correspondence and sustained contact are important","Formality / hierarchy: business conduct may be more formal than in comparable U.S. contexts","Time: appointment schedules and longer lead times for meetings should be respected","Relationship: continued personal contact with potential partners is valued","Etiquette: prompt acknowledgement of correspondence is expected"],"traps":["UK and U.S. business practice should not be treated as identical.","British English vocabulary differences are linguistic, not themselves a cultural theory."]},"World Cultures|Japan":{"title":"Japan — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Japan, not as deterministic rules for every individual.","rules":["Communication: harmony and avoidance of direct confrontation are emphasized in many business settings","Formality / hierarchy: business interactions are structured and relatively formal","Formality / hierarchy: family names are commonly used in initial business relationships","Time: relationship-building and group decision processes can require time","Relationship: trust, loyalty and long-term commitment are emphasized","Etiquette: business cards remain important","Etiquette: gift presentation and packaging can matter"],"traps":["Group orientation does not mean every individual behaves collectivistically.","Indirectness may involve both high-context communication and face/harmony concerns; choose the concept asked by the stem."]},"World Cultures|South Korea":{"title":"South Korea — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in South Korea, not as deterministic rules for every individual.","rules":["Communication: a rigid negotiation style may be ineffective","Formality / hierarchy: titles and family names are important in formal business interactions","Relationship: cold calls may be viewed as inappropriate; introductions and established contact matter","Etiquette: business cards are commonly exchanged with both hands and treated respectfully","Etiquette: handshakes may be gentler than typical U.S. practice"],"traps":["Business-card etiquette is a social norm, not evidence by itself of Hofstede power distance.","Avoid turning etiquette into universal rules for every Korean individual."]},"World Cultures|Singapore":{"title":"Singapore — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Singapore, not as deterministic rules for every individual.","rules":["Communication: business discussions are often straightforward","Communication: English is widely used in business","Formality / hierarchy: forms of address vary across Singapore's multi-ethnic population; asking how someone prefers to be addressed is appropriate","Etiquette: business cards remain common and may be presented with both hands","Etiquette: digital name cards are increasingly common"],"traps":["Singapore is multi-ethnic; naming conventions differ across Chinese, Malay and Indian communities.","Do not assume a single 'Singaporean' naming pattern."]},"World Cultures|Thailand":{"title":"Thailand — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Thailand, not as deterministic rules for every individual.","rules":["Communication: communication may be indirect to avoid confrontation","Communication: nonverbal cues can be important","Formality / hierarchy: respect for age, status and authority is significant","Time: foreign visitors should not equate a relaxed social style with lack of professional expectations","Relationship: personal introductions and relationship networks can facilitate business contact","Etiquette: the wai is a traditional greeting","Etiquette: avoid touching another person's head"],"traps":["Indirectness may be linked to face concerns and hierarchy; identify what the question is testing.","Legal restrictions concerning the Royal Family are dynamic/current-affairs facts and should be date-stamped."]},"World Cultures|India":{"title":"India — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in India, not as deterministic rules for every individual.","rules":["Communication: practices vary substantially across regions and communities","Time: meeting schedules may require flexibility and last-minute changes can occur","Relationship: personal relationships, reputation, rapport and goodwill are important","Etiquette: handshakes are common; namaste/namaskar may also be used"],"traps":["India's internal diversity makes sweeping national generalizations especially risky.","A relationship-oriented approach should not be converted into a claim that punctuality never matters."]},"World Cultures|United Arab Emirates":{"title":"United Arab Emirates — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in United Arab Emirates, not as deterministic rules for every individual.","rules":["Communication: courtesy and initial small talk are important before moving to business","Formality / hierarchy: titles matter in formal meetings","Time: visitors are expected to be punctual even though meetings may run late","Relationship: relationship-building and hospitality form part of business interaction","Etiquette: Arabic coffee may be accepted with the right hand","Etiquette: business cards and gifts are commonly offered with the right hand"],"traps":["The UAE is highly multicultural; Emirati norms should not be assumed to describe every resident.","Punctuality expectations can coexist with meetings that run over time."]},"World Cultures|Brazil":{"title":"Brazil — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Brazil, not as deterministic rules for every individual.","rules":["Communication: important negotiations are often facilitated by in-person interaction","Formality / hierarchy: business dress may remain formal despite relatively informal interaction","Time: visitors should be punctual while allowing buffer for local transport delays","Relationship: continuity of contact and repeated meetings can be important","Etiquette: small promotional gifts may be acceptable; expensive gifts can be problematic"],"traps":["Relationship orientation does not equal lack of professionalism.","Transport delays should not be misread as a cultural preference for lateness."]},"World Cultures|Mexico":{"title":"Mexico — Context Card","subtitle":"世界文化情境卡","summary":"Use these as context-dependent tendencies for interpreting business/social situations in Mexico, not as deterministic rules for every individual.","rules":["Communication: tactful and indirect phrasing may be preferred in some business situations","Communication: small talk often precedes business discussion","Formality / hierarchy: professional appearance is valued in major business settings","Time: punctuality is the norm for many business/government appointments, while social time can be more flexible","Relationship: business lunches and relationship-building are important","Etiquette: business cards are commonly used"],"traps":["Do not confuse flexible social time with business punctuality.","An indirect 'yes' may function pragmatically rather than as a literal commitment in some contexts."]},"Global Awareness|International Organizations":{"title":"International Organizations","subtitle":"国际组织","summary":"Distinguish the UN, WHO, WTO and IMF by mandate, institutional status and current membership; current counts and leadership need periodic refresh.","rules":["UN → 193 Member States","UN principal organs → 6","UNSC → 15 = 5 permanent + 10 elected","WHO → 194 Member States / global health","WTO → 166 / Geneva / trade rules","WTO DG → Ngozi Okonjo-Iweala","IMF → 191 / monetary cooperation / financial stability"],"traps":["Do not confuse UN membership with WHO membership.","The General Assembly has universal representation among UN Member States.","Do not count WHO, UNESCO or WTO as principal organs of the UN.","The Trusteeship Council is still a principal organ although it suspended operations in 1994.","Do not confuse the 15 Security Council members with the 15 judges of the ICJ.","Non-permanent membership changes over time.","WHO is a specialized agency, not a UN principal organ.","Do not confuse WHO membership count with UN membership."]},"Global Awareness|Regional Organizations":{"title":"Regional Organizations","subtitle":"区域组织","summary":"Know current membership and institutional distinctions among the EU, euro area, African Union and ASEAN.","rules":["EU → 27","euro area → 21 of 27 EU countries","AU → 55 / launched 2002 / successor to OAU","ASEAN → 11 after Timor-Leste (2025)"],"traps":["The EU and euro area are not the same set of countries.","The United Kingdom is no longer an EU Member State.","EU membership does not automatically mean use of the euro.","This is a dynamic count.","Do not equate African Union membership with a simple count of UN-recognized African states without checking context.","OAU and AU are related but not identical institutions.","Older sources may still say ASEAN has 10 members.","This is a high-priority current-affairs update."]},"Global Awareness|Global Cultural Governance":{"title":"Global Cultural Governance","subtitle":"全球文化治理","summary":"Separate the 1972 World Heritage framework, 2003 Intangible Cultural Heritage Convention, 2005 Cultural Expressions Convention and Memory of the World Programme.","rules":["1972 → World Cultural + Natural Heritage","2003 → Intangible Cultural Heritage","2005 → Diversity of Cultural Expressions","Memory of the World → documentary heritage / 1992"],"traps":["Do not confuse it with the 2003 Intangible Cultural Heritage Convention.","World Heritage concerns cultural and natural properties, not living practices as such.","Do not confuse ICH with World Heritage properties.","ICH safeguarding focuses on living practices, knowledge and skills rather than monuments alone.","Do not confuse it with the 2003 ICH Convention.","Its focus includes cultural and creative industries and policy environments.","It is neither World Heritage nor Intangible Cultural Heritage.","Documentary heritage includes archives and library collections."]},"Global Awareness|UN Global Frameworks":{"title":"UN Global Frameworks","subtitle":"联合国全球框架","summary":"Know the 17 SDGs and the 2024 Pact for the Future, including its Global Digital Compact and Declaration on Future Generations annexes.","rules":["SDGs → 17","Pact for the Future → adopted 22 Sep 2024","Global Digital Compact → annex to Pact for the Future","Future Generations Declaration → Pact annex"],"traps":["Do not confuse the 17 SDGs with their larger set of targets.","The 2030 Agenda is broader than climate policy alone.","Do not confuse the Pact with the 2030 Agenda.","The Pact includes annexes rather than replacing the UN Charter.","It is not a separate treaty establishing a new UN principal organ.","It is paired with the Declaration on Future Generations as an annex to the Pact.","Do not confuse it with the Global Digital Compact; both are annexes.","It is not one of the 17 SDGs."]},"Global Awareness|Recent Global Events":{"title":"Recent Global Events","subtitle":"近期全球议题","summary":"Track only high-salience, competition-relevant events and date-stamp them; examples include COP30 and Timor-Leste becoming ASEAN’s 11th member.","rules":["COP30 → Belém, Brazil / Nov 2025","Timor-Leste → ASEAN 11th member"],"traps":["Do not confuse COP30 with COP28 or COP29.","COP numbers and host cities are time-sensitive current-affairs facts.","Do not use pre-October-2025 sources that still list only 10 ASEAN members.","Admission and full institutional integration are related but not identical processes."]}};

function adaptivePriority(q,seed=0){
  const s=statsFor(q.id);
  let score=0;
  if(!s.seen){
    score+=38;
    if(q.difficulty==='B'||q.difficulty==='C')score+=8;
  }else{
    score+=(100-mastery(s))*.72;
    score+=(1-s.correct/s.seen)*28;
    score+=Math.min(22,Math.max(0,avgTime(s)-12)*1.35);
    if(s.lastCorrect===false)score+=20;
    if(s.nextReview&&s.nextReview<=todayKey())score+=18;
  }
  if(q.verification_tier==='O')score+=5;
  else if(q.verification_tier==='A')score+=2;
  score+=((hash(q.id+seed)%1000)/1000);
  return score;
}
function rankAdaptive(pool,seed){return [...pool].sort((a,b)=>adaptivePriority(b,seed)-adaptivePriority(a,seed))}
function selectAdaptiveModule(moduleName,n,key){
  const pool=QUESTIONS.filter(q=>q.module===moduleName);
  const selected=[],used=new Set();
  const add=(arr,limit)=>{for(const q of arr){if(selected.length>=limit)break;if(!used.has(q.id)){selected.push(q);used.add(q.id)}}};
  const due=rankAdaptive(pool.filter(q=>{const s=statsFor(q.id);return s.seen&&((s.nextReview&&s.nextReview<=todayKey())||s.lastCorrect===false||avgTime(s)>20)}),key+'due');
  add(due,Math.ceil(n*.4));
  const weak=rankAdaptive(pool.filter(q=>statsFor(q.id).seen&&!used.has(q.id)),key+'weak');
  add(weak,Math.ceil(n*.7));
  const unseen=rankAdaptive(pool.filter(q=>!statsFor(q.id).seen&&!used.has(q.id)),key+'new');
  add(unseen,n);
  if(selected.length<n)add(rankAdaptive(pool.filter(q=>!used.has(q.id)),key+'fill'),n);
  return selected.slice(0,n);
}

function bankFiltered(){
  let arr=allBankItems();
  const q=(bankView.query||'').trim().toLowerCase();
  if(q)arr=arr.filter(x=>[x.question,x.topic,x.subcategory,x.module,x.explanation,...(x.options||[])].join(' ').toLowerCase().includes(q));
  if(bankView.group!=='all')arr=arr.filter(x=>bankProvenance(x)===bankView.group);
  if(bankView.module!=='all')arr=arr.filter(x=>x.module===bankView.module);
  if(bankView.difficulty!=='all')arr=arr.filter(x=>x.difficulty===bankView.difficulty);
  return arr;
}

function sprintIds(){const k=todayKey()+':' + (state.sprints.length+1);const picks=[];function add(m){const usedSub=new Set(picks.map(id=>qs(id).subcategory));let pool=QUESTIONS.filter(q=>q.module===m&&!usedSub.has(q.subcategory));pool=seededShuffle(pool,hash(k+m));if(pool.length)picks.push(pool[0].id)}add('Intercultural Theory');add('Intercultural Scenarios');add('Chinese Culture');add('World Cultures');if(hash(k)%2)add('Global Awareness');else add('Intercultural Theory');const remain=QUESTIONS.filter(q=>!picks.includes(q.id));if(picks.length<6)picks.push(...seededShuffle(remain,hash(k+'x')).slice(0,6-picks.length).map(q=>q.id));return seededShuffle(picks,hash(k+'shuffle'))}
function renderSprint(){const b=bestSprint(),recent=state.sprints.slice(-5).reverse();document.getElementById('sprint').innerHTML=`<div class="eyebrow">National Final Simulation</div><div class="h1">2-Minute Sprint</div><div class="sub">Six questions. 120 seconds. No explanation until submission or timeout.</div><div class="hero"><div class="card heroCard"><div><div class="eyebrow">Competition mode</div><h2 class="sectionTitle" style="font-size:34px">6 Questions · 120 Seconds</h2><div class="muted">Aim first for 5/6 under 120s, then 6/6 under 90s.</div></div><div><button class="btn red" id="startSprint">START SPRINT</button></div></div></div><div class="grid grid2"><div class="card metric"><div class="label">Personal Best</div><div class="value">${b?b.score+'/6':'—'}</div><div class="hint">${b?b.time+' seconds':'complete your first sprint'}</div></div><div class="card"><div class="eyebrow">Recent runs</div>${recent.length?recent.map(x=>`<div class="listItem"><span>${x.date}</span><span><b>${x.score}/6</b> · ${x.time}s</span></div>`).join(''):'<div class="empty" style="margin-top:12px">No sprint history yet.</div>'}</div></div>`;document.getElementById('startSprint').onclick=()=>startSession('2-Minute Sprint',sprintIds(),true,false);}
function renderReview(){const due=dueQuestions(),wrong=QUESTIONS.filter(q=>{const s=statsFor(q.id);return s.seen&&s.correct<s.seen}),slow=QUESTIONS.filter(q=>{const s=statsFor(q.id);return s.seen&&avgTime(s)>20});document.getElementById('review').innerHTML=`<div class="eyebrow">Adaptive Review</div><div class="h1">Review queue</div><div class="sub">Wrong answers, slow answers and low-mastery items are prioritized automatically.</div><div class="grid grid4 section"><div class="card metric"><div class="label">Due Today</div><div class="value">${due.length}</div></div><div class="card metric"><div class="label">Knowledge Gaps</div><div class="value">${wrong.length}</div></div><div class="card metric"><div class="label">Too Slow</div><div class="value">${slow.length}</div></div><div class="card metric"><div class="label">Reviewed</div><div class="value">${Object.values(state.stats).filter(s=>s.seen>1).length}</div></div></div><div class="section card"><div class="row" style="justify-content:space-between"><h2 class="sectionTitle" style="margin:0">Priority queue</h2><button class="btn" id="review10" ${due.length?'':'disabled'}>Review top 10</button></div><div style="margin-top:10px">${due.length?due.slice(0,20).map(q=>{const s=statsFor(q.id),kind=s.correct<s.seen?'Knowledge gap':avgTime(s)>20?'Too slow':'Due';const cls=kind==='Knowledge gap'?'tagBad':kind==='Too slow'?'tagSlow':'muted';return `<div class="reviewItem clickableReview" data-review-q="${q.id}"><div><div class="topic">${q.subcategory}</div><div class="small muted">${q.question}</div></div><div class="small ${cls}">${kind} · ${mastery(s)}%</div></div>`}).join(''):'<div class="empty">Nothing is due yet. Complete a practice set first.</div>'}</div></div>`;document.querySelectorAll('[data-review-q]').forEach(el=>el.onclick=()=>{const q=qs(el.dataset.reviewQ);if(q)openKnowledgeCard(knowledgeKey(q),q.id)});const b=document.getElementById('review10');if(b)b.onclick=()=>startSession('Smart Review',due.slice(0,10).map(q=>q.id),false,true);}
function renderProgress(){const os=overallStats();const weak=weakestSubcats(8);document.getElementById('progress').innerHTML=`<div class="eyebrow">Performance</div><div class="h1">Progress</div><div class="sub">Mastery combines accuracy, speed and short-term retention. It is a training metric, not an official competition score.</div><div class="grid grid4 section"><div class="card metric"><div class="label">Questions Seen</div><div class="value">${Object.keys(state.stats).length}</div><div class="hint">of ${QUESTIONS.length}</div></div><div class="card metric"><div class="label">Attempts</div><div class="value">${os.seen}</div></div><div class="card metric"><div class="label">Accuracy</div><div class="value">${os.seen?pct(os.correct,os.seen)+'%':'—'}</div></div><div class="card metric"><div class="label">Avg. Time</div><div class="value">${os.seen?os.avg.toFixed(1)+'s':'—'}</div></div></div><div class="grid grid2 section"><div class="card"><h2 class="sectionTitle">Module mastery</h2>${modules.map(m=>{const x=moduleMetrics(m);return `<div class="barRow"><span class="small">${moduleShort[m]}</span><div class="bar"><span style="width:${x.mastery}%"></span></div><b class="small">${x.mastery}%</b></div>`}).join('')}</div><div class="card"><h2 class="sectionTitle">Weakest topics</h2>${weak.length?weak.map(([w,m])=>`<div class="listItem"><span class="topic">${w}</span><span class="pill ${m<60?'red':''}">${m}%</span></div>`).join(''):'<div class="empty">No mastery data yet.</div>'}</div></div><div class="section card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Local data</div><h3 class="sectionTitle" style="margin:7px 0">Reset training history</h3><div class="muted small">This clears attempts, reviews and sprint history on this browser only.</div></div><button class="btn ghost" id="resetBtn">Reset</button></div></div>`;document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset all local training history?')){state=freshState();save();renderProgress()}};}
function startDaily(){const d=ensureDaily();const pending=d.ids.filter(id=>!d.done.includes(id));if(!pending.length){renderToday();return}startSession('Daily Core',pending,false,true,{daily:true})}
function startSession(title,ids,timed=false,feedback=true,extra={}){
  if(!ids.length)return;
  clearInterval(ticker);
  currentSession={title,ids,index:0,answers:[],started:Date.now(),qStarted:Date.now(),timed,feedback,extra,remaining:timed?120:null,qRemaining:extra.perQuestionLimit||null,locked:false};
  showSession();
  if(timed||extra.perQuestionLimit){
    ticker=setInterval(()=>{
      if(!currentSession)return;
      if(currentSession.extra&&currentSession.extra.perQuestionLimit){
        if(currentSession.locked)return;
        currentSession.qRemaining--;
        updateTimer();
        if(currentSession.qRemaining<=0)expireQuestion();
      }else{
        currentSession.remaining--;
        updateTimer();
        if(currentSession.remaining<=0)finishSession(true);
      }
    },1000);
  }
}
function showSession(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('session').classList.add('active');renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}
function renderQuestion(){
  const s=currentSession;if(!s)return;
  const q=qs(s.ids[s.index]);
  s.qStarted=Date.now();s.locked=false;
  if(s.extra&&s.extra.perQuestionLimit)s.qRemaining=s.extra.perQuestionLimit;
  const timerText=s.extra&&s.extra.perQuestionLimit?`${s.qRemaining}s`:s.timed?fmtTime(s.remaining):'≤ 20s target';
  document.getElementById('session').innerHTML=`<div class="sessionWrap"><div class="sessionTop"><div><div class="eyebrow">${s.title}</div><div class="small muted">Question ${s.index+1} / ${s.ids.length}</div></div><div class="timer ${s.extra&&s.extra.perQuestionLimit?'pressureTimer':''}" id="timer">${timerText}</div></div><div class="progressbar" style="margin-bottom:18px"><span style="width:${s.index/s.ids.length*100}%"></span></div><div class="card questionCard"><div class="qmeta"><span class="pill">${q.module}</span><span class="pill">${q.subcategory}</span><span class="pill">Level ${q.difficulty}</span><span class="pill red">${verificationLabel(q.verification_tier)}</span></div><h2 class="qtext">${q.question}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-opt="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join('')}</div><div class="kbdHelp"><span class="key">1</span>–<span class="key">4</span> choose · <span class="key">Enter</span> next</div><div class="feedback" id="feedback"></div></div><div class="sessionActions"><button class="btn ghost" id="quitSession">Exit</button><button class="btn" id="nextQ" style="display:none">${s.index===s.ids.length-1?'Finish':'Next →'}</button></div></div>`;
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>choose(+b.dataset.opt));
  document.getElementById('quitSession').onclick=()=>{currentSession=null;clearInterval(ticker);ticker=null;go('today')};
  document.getElementById('nextQ').onclick=()=>nextQuestion();
}
function choose(i){const s=currentSession;if(!s||s.locked)return;const q=qs(s.ids[s.index]);const elapsed=Math.max(.4,(Date.now()-s.qStarted)/1000);const correct=i===q.answer;s.locked=true;s.answers.push({id:q.id,choice:i,correct,time:elapsed});recordAttempt(q,correct,elapsed);if(s.extra&&s.extra.daily){const d=ensureDaily();if(!d.done.includes(q.id))d.done.push(q.id);d.totalTime+=elapsed;if(correct)d.score++;save()}document.querySelectorAll('.option').forEach((b,idx)=>{b.classList.toggle('selected',idx===i);if(s.feedback){if(idx===q.answer)b.classList.add('correct');else if(idx===i&&!correct)b.classList.add('wrong')}b.disabled=true});if(s.feedback){const f=document.getElementById('feedback');const ds=displaySources(q);f.innerHTML=`<h4>${correct?'✓ Correct':'✕ Not quite'}</h4><p style="font-size:16px;margin:8px 0 14px"><b>${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b></p><div class="feedbackGrid"><div class="feedbackBlock"><div class="cap">Why</div><div style="line-height:1.6">${q.explanation}</div></div><div class="feedbackBlock"><div class="cap">Quick rule</div><div class="quick">${quickRule(q)}</div></div></div><div class="sourceCard"><div><div class="cap">Source · Mainland-facing</div><div class="small">${sourceHTML(q,true)}<br>${verificationLabel(q.verification_tier)} · Updated ${q.knowledge_updated_at||q.fact_checked_at||'—'}</div></div></div>`;f.classList.add('show');const kbtn=document.createElement('button');kbtn.className='btn ghost knowledgeAction';kbtn.textContent='Open knowledge card';kbtn.onclick=()=>openKnowledgeCard(knowledgeKey(q),q.id);f.appendChild(kbtn);document.getElementById('nextQ').style.display='inline-block'}else{setTimeout(()=>nextQuestion(),120)}}
function expireQuestion(){
  const s=currentSession;if(!s||s.locked)return;
  const q=qs(s.ids[s.index]),limit=s.extra.perQuestionLimit||20;
  s.locked=true;
  s.answers.push({id:q.id,choice:null,correct:false,time:limit,timeout:true});
  recordAttempt(q,false,limit);
  document.querySelectorAll('.option').forEach(b=>b.disabled=true);
  setTimeout(()=>nextQuestion(),180);
}

function recordAttempt(q,correct,time){let s=statsFor(q.id);s={...s};s.seen++;if(correct)s.correct++;s.totalTime+=time;s.lastSeen=todayKey();s.lastCorrect=correct;s.streak=correct?(s.streak||0)+1:0;if(!correct)s.nextReview=todayKey();else if(time>20)s.nextReview=dayAdd(2);else{const intervals=[1,3,7,14,30];s.nextReview=dayAdd(intervals[Math.min((s.streak||1)-1,intervals.length-1)])}state.stats[q.id]=s;save()}
function nextQuestion(){const s=currentSession;if(!s)return;if(!s.locked && !s.feedback){return}if(s.index>=s.ids.length-1){finishSession(false);return}s.index++;renderQuestion()}
function finishSession(timeout=false){const s=currentSession;if(!s)return;clearInterval(ticker);ticker=null;const elapsed=Math.min(s.timed?120:999999,Math.round((Date.now()-s.started)/1000));const runScore=s.answers.filter(a=>a.correct).length;if(s.timed){state.sprints.push({date:new Date().toLocaleString(),score:runScore,time:elapsed,answers:s.answers});if(state.sprints.length>50)state.sprints=state.sprints.slice(-50);}if(s.extra&&s.extra.mode){state.modeRuns=state.modeRuns||[];state.modeRuns.push({date:new Date().toLocaleString(),mode:s.extra.mode,score:runScore,total:s.ids.length,time:elapsed});if(state.modeRuns.length>100)state.modeRuns=state.modeRuns.slice(-100);}state.sessions=(state.sessions||0)+1;save();const score=s.answers.filter(a=>a.correct).length,total=s.ids.length,avg=s.answers.length?s.answers.reduce((a,b)=>a+b.time,0)/s.answers.length:0;const missed=s.ids.filter(id=>!s.answers.some(a=>a.id===id));document.getElementById('session').innerHTML=`<div class="result"><div class="eyebrow">${timeout?'Time':'Session'} complete</div><div class="bigScore">${score}/${total}</div><div class="sub">${s.title}${missed.length?` · ${missed.length} unanswered`:''}</div><div class="resultGrid"><div class="resultMetric"><span class="small muted">Accuracy</span><b>${pct(score,total)}%</b></div><div class="resultMetric"><span class="small muted">Time</span><b>${elapsed}s</b></div><div class="resultMetric"><span class="small muted">Avg/question</span><b>${avg?avg.toFixed(1)+'s':'—'}</b></div></div><div class="card"><h3 class="sectionTitle">Answer review</h3>${s.answers.map(a=>{const q=qs(a.id);return `<div class="listItem"><div><div class="topic">${q.subcategory}</div><div class="small muted">${q.question}</div></div><span class="pill ${a.correct?'':'red'}">${a.timeout?'Timeout':a.correct?'Correct':'Wrong'} · ${a.time.toFixed(1)}s</span></div>`}).join('')}${missed.map(id=>{const q=qs(id);return `<div class="listItem"><div><div class="topic">${q.subcategory}</div><div class="small muted">${q.question}</div></div><span class="pill red">Unanswered</span></div>`}).join('')}</div><div class="row" style="margin-top:18px"><button class="btn red" id="doneBtn">Back to Today</button>${s.timed?'<button class="btn secondary" id="againBtn">Another Sprint</button>':''}</div></div>`;const wasTimed=s.timed;currentSession=null;document.getElementById('doneBtn').onclick=()=>go('today');const ab=document.getElementById('againBtn');if(ab)ab.onclick=()=>startSession('2-Minute Sprint',sprintIds(),true,false);}
function fmtTime(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function updateTimer(){const el=document.getElementById('timer');if(el&&currentSession){if(currentSession.extra&&currentSession.extra.perQuestionLimit){el.textContent=currentSession.qRemaining+'s';el.classList.toggle('danger',currentSession.qRemaining<=5)}else el.textContent=fmtTime(currentSession.remaining)}}

document.addEventListener('keydown',e=>{
  if(!currentSession)return;
  const tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  if(['select','input','textarea'].includes(tag))return;
  if(!currentSession.locked && ['1','2','3','4'].includes(e.key)){
    const idx=Number(e.key)-1;const q=qs(currentSession.ids[currentSession.index]);
    if(idx<q.options.length){e.preventDefault();choose(idx)}
  }else if(currentSession.locked && e.key==='Enter'){
    const n=document.getElementById('nextQ');
    if(n&&n.style.display!=='none'){e.preventDefault();nextQuestion()}
  }
});

renderNav();renderToday();initPublicRelease();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.getElementById('knowledgeOverlay');if(o&&o.classList.contains('show')){closeKnowledgeCard();e.preventDefault();return}const p=document.getElementById('publicModalOverlay');if(p&&p.classList.contains('show')){p.classList.remove('show');e.preventDefault();}}});
</script>
</body></html>
