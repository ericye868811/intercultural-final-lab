nty","It measures anxiety during one specific conversation"],"answer":1,"explanation":"Uncertainty avoidance concerns cultural responses to ambiguity and uncertainty, not simple risk aversion or momentary anxiety.","quick_rule":"Cultural ambiguity → UAI.","source_ids":["SRC05"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q007","module":"Intercultural Theory","subcategory":"AUM","topic":"AUM vs UAI","difficulty":"B","question_type":"T2","question":"A student is nervous because she cannot predict how a new international roommate will interpret her jokes. Which concept is most directly involved?","options":["Anxiety/Uncertainty Management","Uncertainty Avoidance","Power Distance"],"answer":0,"explanation":"The situation centers on interpersonal anxiety and uncertainty in an encounter, which is the focus of AUM.","quick_rule":"Interaction anxiety + prediction → AUM.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q008","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face Concern","difficulty":"B","question_type":"T2","question":"In Face-Negotiation Theory, 'face' is best understood as:","options":["a person's claimed social image in interaction","the physical expression shown during conflict","a fixed personality trait"],"answer":0,"explanation":"Face concerns the socially situated image or identity a person wants respected in interaction.","quick_rule":"Dignity / social image → face.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q009","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Integrating Style","difficulty":"B","question_type":"T2","question":"Which conflict style is characterized by high concern for both self and the other party?","options":["Integrating","Dominating","Avoiding"],"answer":0,"explanation":"Integrating seeks solutions that address both parties' concerns and is commonly associated with win-win problem solving.","quick_rule":"High self + high other → integrating.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q010","module":"Intercultural Theory","subcategory":"CAT","topic":"Convergence","difficulty":"B","question_type":"T2","question":"A speaker deliberately adjusts vocabulary and speech rate to become more similar to an interlocutor. CAT describes this as:","options":["Convergence","Divergence","Assimilation"],"answer":0,"explanation":"Within Communication Accommodation Theory, convergence reduces communicative or social distance by adjusting toward the other.","quick_rule":"Become more similar → convergence.","source_ids":["SRC04"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q011","module":"Intercultural Theory","subcategory":"CAT","topic":"Divergence","difficulty":"B","question_type":"T2","question":"Which example best illustrates divergence in Communication Accommodation Theory?","options":["Using stronger regional speech to emphasize one's group identity","Slowing down to help a listener understand","Adopting a colleague's preferred technical vocabulary"],"answer":0,"explanation":"Divergence accentuates communicative difference or social distance; the other options are forms of accommodation toward the interlocutor.","quick_rule":"Emphasize difference → divergence.","source_ids":["SRC04"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q012","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic":"Kinesics / Haptics / Proxemics","difficulty":"B","question_type":"T2","question":"Which pairing is correct?","options":["Haptics — touch","Kinesics — interpersonal distance","Proxemics — vocal tone"],"answer":0,"explanation":"Haptics concerns touch; kinesics concerns body movement and gesture; proxemics concerns space.","quick_rule":"Touch = haptics; movement = kinesics; space = proxemics.","source_ids":["SRC02"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q013","module":"Intercultural Theory","subcategory":"Identity","topic":"Cultural Identity","difficulty":"B","question_type":"T2","question":"Which statement best reflects contemporary intercultural approaches to identity?","options":["People can hold multiple identities whose salience changes across contexts","Cultural identity is fixed at birth and remains unchanged","A person's national identity fully predicts individual behavior"],"answer":0,"explanation":"Intercultural scholarship treats identity as multiple, contextual and socially negotiated rather than mechanically determined by nationality.","quick_rule":"Identity = multiple + contextual.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q014","module":"Intercultural Theory","subcategory":"Intercultural Competence","topic":"Appropriateness and Effectiveness","difficulty":"B","question_type":"T2","question":"An interculturally competent response should generally aim to be:","options":["both effective and appropriate in context","maximally direct in every culture","identical to the communication style of the host culture"],"answer":0,"explanation":"Intercultural competence is commonly framed around effective and contextually appropriate interaction, not one universal style.","quick_rule":"Competence = effective + appropriate.","source_ids":["SRC25","SRC01"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q015","module":"Intercultural Theory","subcategory":"Hall","topic":"Context vs Individualism","difficulty":"B","question_type":"T2","question":"A question asks whether a message's meaning is carried mainly by explicit wording or inferred from relationships and context. Which framework is most directly relevant?","options":["Hall's context dimension","Hofstede's individualism–collectivism","Face-Negotiation Theory"],"answer":0,"explanation":"The question is about where meaning is located in communication, which is Hall's high-/low-context distinction.","quick_rule":"Message encoding → Hall.","source_ids":["SRC02"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q016","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face vs Conflict Style","difficulty":"B","question_type":"T2","question":"Which statement best distinguishes face concern from a conflict-management style?","options":["Face concern addresses social image; conflict style describes how a person handles the disagreement","Face concern describes physical distance; conflict style describes social hierarchy","They are interchangeable terms"],"answer":0,"explanation":"Face concerns help explain why people manage conflict in certain ways, while conflict styles describe the behavioral strategy itself.","quick_rule":"Why protect image? → face; how handle conflict? → style.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q017","module":"Intercultural Theory","subcategory":"AUM","topic":"AUM Principle","difficulty":"B","question_type":"T2","question":"According to AUM-oriented thinking, effective intercultural communication requires people to:","options":["manage anxiety and uncertainty within workable limits","eliminate all uncertainty before speaking","avoid interaction whenever anxiety is present"],"answer":0,"explanation":"AUM emphasizes managing rather than completely eliminating anxiety and uncertainty.","quick_rule":"Manage, not eliminate.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q018","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Cross-Cultural Adaptation","difficulty":"B","question_type":"T2","question":"Which situation is best described as cross-cultural adaptation rather than communication accommodation?","options":["An exchange student gradually adjusts to academic and social life over a year","A lecturer slows down for one international student","A speaker changes one greeting to match a colleague"],"answer":0,"explanation":"Cross-cultural adaptation concerns broader, ongoing adjustment to a new cultural environment; CAT can explain moment-to-moment communication adjustment.","quick_rule":"Adjust life over time → adaptation.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q019","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Power Distance","difficulty":"B","question_type":"T2","question":"Which question is most directly related to power distance?","options":["How acceptable are unequal distributions of authority and status?","How much meaning is conveyed nonverbally?","How much physical distance separates speakers?"],"answer":0,"explanation":"Power distance concerns the acceptance of unequal power relations.","quick_rule":"Hierarchy / accepted inequality → PDI.","source_ids":["SRC05"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q020","module":"Intercultural Theory","subcategory":"Hall","topic":"Indirectness and Face","difficulty":"C","question_type":"T2","question":"An employee says, 'That could be difficult,' instead of directly rejecting a manager's proposal. If the question asks HOW the refusal is encoded, which concept is the best answer?","options":["High-context communication","Face concern","Power distance"],"answer":0,"explanation":"Face and hierarchy may influence the choice, but the wording of the question asks how meaning is encoded; indirect contextual encoding points most directly to high-context communication.","quick_rule":"HOW meaning is encoded → context; WHY dignity matters → face.","source_ids":["SRC02","SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q021","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Indirectness and Face","difficulty":"C","question_type":"T2","question":"The same employee avoids saying 'no' because a direct refusal might publicly embarrass the manager. If the question asks WHY the speaker avoids direct rejection, which concept is strongest?","options":["Face concern","High-context communication","Chronemics"],"answer":0,"explanation":"The causal focus is protection of the manager's social image, making face concern the strongest explanation.","quick_rule":"Embarrassment / dignity → face.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q022","module":"Intercultural Theory","subcategory":"Hofstede","topic":"UAI vs Risk","difficulty":"C","question_type":"T2","question":"A culture scores high on uncertainty avoidance. Which inference is most defensible?","options":["People may show a stronger preference for structure and predictability in ambiguous situations","People will always refuse risky investments","Every individual will feel anxious when meeting foreigners"],"answer":0,"explanation":"UAI is a cultural-level tendency concerning ambiguity and uncertainty. It does not mechanically predict financial risk behavior or every individual's emotional state.","quick_rule":"UAI ≠ simple risk avoidance.","source_ids":["SRC05"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q023","module":"Intercultural Theory","subcategory":"CAT","topic":"Accommodation vs Assimilation","difficulty":"C","question_type":"T2","question":"A bilingual employee switches temporarily to a colleague's preferred language during a meeting. Which interpretation is most accurate?","options":["It can be convergence without implying long-term cultural assimilation","It necessarily proves the employee has abandoned the original cultural identity","It is best classified as uncertainty avoidance"],"answer":0,"explanation":"A momentary communication adjustment can be convergence under CAT; it does not by itself imply assimilation.","quick_rule":"Temporary communicative adjustment ≠ assimilation.","source_ids":["SRC04"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q024","module":"Intercultural Theory","subcategory":"Bias","topic":"Stereotype to Discrimination","difficulty":"C","question_type":"T2","question":"A manager believes older workers are poor with technology, feels reluctant to hire them, and then excludes applicants above a certain age. Which sequence best matches the concepts?","options":["stereotype → prejudice → discrimination","prejudice → stereotype → accommodation","ethnocentrism → convergence → discrimination"],"answer":0,"explanation":"The belief is a stereotype, the negative evaluative attitude is prejudice, and the exclusionary action is discrimination.","quick_rule":"Think → feel → act.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q025","module":"Intercultural Theory","subcategory":"Identity","topic":"Identity Salience","difficulty":"C","question_type":"T2","question":"During an international student debate, a participant first speaks as an economics major and later as a Chinese student. Which idea best explains the shift?","options":["Different identities can become salient in different contexts","Identity is determined only by nationality","Cultural identity disappears in task-oriented settings"],"answer":0,"explanation":"People hold multiple identities, and different aspects may become salient depending on the interaction.","quick_rule":"Multiple identities; changing salience.","source_ids":["SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q026","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Integrating vs Compromising","difficulty":"C","question_type":"T2","question":"Two teams exchange concessions so that each gives up part of what it wanted, but neither explores a solution satisfying both sets of underlying interests. Which style best fits?","options":["Compromising","Integrating","Obliging"],"answer":0,"explanation":"Compromising typically involves mutual give-and-take; integrating seeks a more fully win-win solution that addresses underlying concerns.","quick_rule":"Split the difference → compromise; solve both needs → integrate.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q027","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Self-face vs Other-face","difficulty":"C","question_type":"T2","question":"A negotiator is primarily concerned that the counterpart not be humiliated in front of colleagues. Which face orientation is most directly involved?","options":["Other-face","Self-face","No face concern"],"answer":0,"explanation":"The concern centers on protecting the counterpart's social image, which is other-face concern.","quick_rule":"Protect the other person's image → other-face.","source_ids":["SRC03"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q028","module":"Intercultural Theory","subcategory":"Intercultural Competence","topic":"Avoiding Essentialism","difficulty":"C","question_type":"T2","question":"Which statement shows the most interculturally responsible use of a national-culture framework?","options":["It can suggest broad tendencies, but individual behavior must still be interpreted in context","A national score allows us to predict how any citizen will behave","If two countries differ on one dimension, their citizens will usually misunderstand each other"],"answer":0,"explanation":"Culture-level frameworks can support hypotheses about tendencies, but they should not be used as deterministic predictions of individuals.","quick_rule":"Use dimensions as lenses, not labels.","source_ids":["SRC05","SRC25"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q029","module":"Intercultural Theory","subcategory":"Hall + Hofstede","topic":"Multi-Theory Distinction","difficulty":"C","question_type":"T2","question":"A case involves indirect wording, strong concern for group harmony, and discomfort with vague procedures. Which mapping is most accurate?","options":["indirect wording—Hall; group orientation—individualism/collectivism; ambiguity—uncertainty avoidance","indirect wording—power distance; group orientation—AUM; ambiguity—proxemics","indirect wording—haptics; group orientation—face; ambiguity—chronemics"],"answer":0,"explanation":"The three clues point to distinct constructs and should not be collapsed into one national stereotype.","quick_rule":"Message → Hall; self/group → IDV; ambiguity → UAI.","source_ids":["SRC02","SRC05"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"V2Q030","module":"Intercultural Theory","subcategory":"Integrated Theory","topic":"Best Explanation","difficulty":"D","question_type":"T2","question":"A newly arrived employee avoids asking a senior manager for clarification. He worries that a question may expose his ignorance, cannot predict the manager's reaction, and comes from an organization where status differences are strongly emphasized. Which answer best separates the mechanisms?","options":["Face concern explains fear of embarrassment; AUM explains unpredictability; power distance helps frame the hierarchical context","High-context communication alone explains all three features","Uncertainty avoidance explains embarrassment, hierarchy and interpersonal prediction equally well"],"answer":0,"explanation":"The strongest analysis keeps distinct mechanisms separate: social-image concern, interpersonal uncertainty, and hierarchical expectations.","quick_rule":"Complex cases often need layered—not single-label—analysis.","source_ids":["SRC03","SRC05","SRC26"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"B"},{"id":"T17T001","module":"Intercultural Theory","subcategory":"Hall","topic":"High/Low Context","difficulty":"B","question_type":"T2","question":"Which statement best distinguishes high-context from low-context communication?","options":["High-context communication relies more on contextual and relational cues; low-context communication relies more on explicit verbal coding.","High-context communication always avoids direct language, while low-context communication never uses nonverbal cues.","High-context communication is collectivist, while low-context communication is individualist by definition."],"answer":0,"explanation":"The distinction concerns where meaning is carried, not a deterministic personality or national label.","quick_rule":"message location → Hall","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T002","module":"Intercultural Theory","subcategory":"Hall","topic":"High Context","difficulty":"B","question_type":"T2","question":"A message is brief, but both parties understand it because they share extensive background knowledge. Which concept best fits?","options":["Power distance","High-context communication","Uncertainty avoidance"],"answer":1,"explanation":"Shared assumptions and relational context carry part of the message.","quick_rule":"shared context carries meaning → high context","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T003","module":"Intercultural Theory","subcategory":"Hall","topic":"Low Context","difficulty":"B","question_type":"T2","question":"Which situation most clearly illustrates low-context communication?","options":["A family member uses a familiar look to communicate a request without words.","A colleague hints at disagreement because both sides know the unstated issue.","A contract states expectations explicitly so that meaning does not depend heavily on shared background knowledge."],"answer":2,"explanation":"Low-context communication places more information in explicit verbal or written form.","quick_rule":"explicit coding → low context","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T004","module":"Intercultural Theory","subcategory":"Hall","topic":"Context vs Face","difficulty":"C","question_type":"T2","question":"An employee says, “That may be difficult,” instead of “No,” because a direct refusal could embarrass a senior colleague. If the question asks WHY the employee avoids embarrassment, which concept is most directly relevant?","options":["Face concern","High-context communication","Uncertainty avoidance"],"answer":0,"explanation":"Indirect wording may be high-context, but concern about another person's social image is a face issue.","quick_rule":"why protect dignity? → face","source_ids":["SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T005","module":"Intercultural Theory","subcategory":"Hall","topic":"Monochronic Time","difficulty":"B","question_type":"T2","question":"Which description best fits a monochronic orientation to time?","options":["Several activities are handled flexibly at once as relationships reshape the schedule.","Tasks and schedules are treated sequentially, with emphasis on planned time blocks.","Time is interpreted mainly through social hierarchy."],"answer":1,"explanation":"Monochronic time emphasizes sequencing, scheduling and task separation.","quick_rule":"one thing / schedule blocks → monochronic","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T006","module":"Intercultural Theory","subcategory":"Hall","topic":"Polychronic Time","difficulty":"B","question_type":"T2","question":"Which behavior most closely reflects a polychronic orientation?","options":["Avoiding uncertainty through detailed written procedures.","Finishing one scheduled task before beginning another whenever possible.","Allowing several activities and relational demands to overlap rather than treating the schedule as rigid."],"answer":2,"explanation":"Polychronic time allows greater overlap and relational flexibility.","quick_rule":"overlap + relational flexibility → polychronic","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T007","module":"Intercultural Theory","subcategory":"Hall","topic":"Theory Scope","difficulty":"C","question_type":"T2","question":"Which use of Hall's high-/low-context framework is most defensible?","options":["Use it as a tendency that can help form hypotheses, then check the actual context and individual.","Use a national label to predict how every individual will communicate.","Treat high-context communication as evidence that speakers are less precise thinkers."],"answer":0,"explanation":"Cultural frameworks are interpretive tools, not deterministic rules about individuals.","quick_rule":"framework → hypothesis, not destiny","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T008","module":"Intercultural Theory","subcategory":"Hall","topic":"Message Interpretation","difficulty":"C","question_type":"T3","question":"A listener focuses only on literal wording and misses meaning carried by relationship history and silence. Which analytical lens is most relevant?","options":["Long-term orientation","High-context communication","Indulgence"],"answer":1,"explanation":"The problem concerns meaning carried beyond explicit wording.","quick_rule":"meaning beyond words → high context","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T009","module":"Intercultural Theory","subcategory":"Hall","topic":"Directness Trap","difficulty":"C","question_type":"T2","question":"Which statement is most accurate?","options":["Indirectness automatically proves that a culture has high power distance.","Directness is simply another name for individualism.","Directness can be related to low-context communication, but directness and individualism are conceptually different."],"answer":2,"explanation":"Hall's message-context dimension and Hofstede's value dimensions address different questions.","quick_rule":"message style ≠ value dimension","source_ids":["SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T010","module":"Intercultural Theory","subcategory":"Hall","topic":"Context Sensitivity","difficulty":"C","question_type":"T3","question":"Two colleagues from the same country communicate very differently in a legal contract and at a family dinner. What is the best conclusion?","options":["Context level can vary by setting; a cultural framework should not erase situational differences.","One of the colleagues must be communicating incorrectly.","National culture should predict the same communication style across all settings."],"answer":0,"explanation":"Communication is context-sensitive even within the same society.","quick_rule":"same society ≠ same style everywhere","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T011","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Power Distance","difficulty":"B","question_type":"T2","question":"Power Distance primarily concerns:","options":["how directly messages are encoded in words.","the extent to which unequal distributions of power are accepted or expected.","how comfortable people feel with physical closeness."],"answer":1,"explanation":"Power Distance addresses acceptance/expectation of unequal power.","quick_rule":"hierarchy acceptance → PDI","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T012","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Individualism","difficulty":"B","question_type":"T2","question":"Which issue is most directly addressed by Individualism versus Collectivism?","options":["the amount of meaning carried by nonverbal context.","the degree of discomfort with ambiguous situations.","the relative priority of individual autonomy and cohesive in-group ties."],"answer":2,"explanation":"IDV concerns the relation between self and in-groups.","quick_rule":"self vs in-group → IDV","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T013","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Uncertainty Avoidance","difficulty":"B","question_type":"T2","question":"Uncertainty Avoidance is best defined as:","options":["the extent to which ambiguity and uncertainty are experienced as threatening and structure is preferred.","the tendency to avoid any activity involving financial or physical risk.","an individual's nervousness during one specific intercultural conversation."],"answer":0,"explanation":"UAI concerns ambiguity at the cultural-value level, not risk aversion in general or momentary anxiety.","quick_rule":"ambiguity + structure → UAI","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T014","module":"Intercultural Theory","subcategory":"Hofstede","topic":"UAI vs Risk","difficulty":"C","question_type":"T2","question":"Which statement is most accurate about Uncertainty Avoidance?","options":["It is equivalent to low willingness to invest in risky assets.","High Uncertainty Avoidance does not simply mean that people avoid all risks; it concerns discomfort with ambiguity and uncertainty.","It measures how often strangers feel anxious when first meeting."],"answer":1,"explanation":"Risk and uncertainty are not interchangeable in this framework.","quick_rule":"UAI ≠ risk avoidance","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T015","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Achievement Dimension","difficulty":"B","question_type":"T2","question":"The achievement-oriented side of Hofstede's MAS dimension emphasizes:","options":["tolerance of ambiguous information.","ritual propriety and social harmony.","achievement, assertiveness and material success."],"answer":2,"explanation":"The dimension contrasts stronger achievement/assertiveness orientation with stronger consensus/care orientation.","quick_rule":"achievement/assertiveness → MAS high side","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T016","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Long-Term Orientation","difficulty":"B","question_type":"T2","question":"Long-Term Orientation most directly concerns:","options":["a pragmatic, future-oriented perspective versus stronger short-term normative orientation.","the amount of personal space expected in conversation.","the degree to which meaning is explicitly verbalized."],"answer":0,"explanation":"LTO concerns time horizon in values and adaptation.","quick_rule":"future/pragmatic horizon → LTO","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T017","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Indulgence","difficulty":"B","question_type":"T2","question":"Indulgence versus Restraint concerns:","options":["formal versus informal hierarchy.","the relative freedom or control surrounding gratification of desires and enjoyment of life.","direct versus indirect refusal strategies."],"answer":1,"explanation":"IVR addresses social regulation of gratification.","quick_rule":"gratification freedom/control → IVR","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T018","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Level of Analysis","difficulty":"C","question_type":"T2","question":"Which is the safest way to use Hofstede's national-culture dimensions?","options":["Treat a country's score as proof of how any specific meeting will unfold.","Use national scores as personality tests for individual people.","Compare broad societal tendencies while avoiding assumptions that every individual matches the national score."],"answer":2,"explanation":"The model is a country-level comparative framework, not an individual diagnostic tool.","quick_rule":"national tendency ≠ individual personality","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T019","module":"Intercultural Theory","subcategory":"Hofstede","topic":"PDI vs Face","difficulty":"C","question_type":"T2","question":"An employee avoids contradicting a manager publicly because public disagreement might humiliate the manager. If the stem emphasizes humiliation and social image, what is the best concept?","options":["Face concern","Power Distance","Long-Term Orientation"],"answer":0,"explanation":"Hierarchy may be relevant, but the highlighted mechanism is protection of social image.","quick_rule":"image/dignity → face","source_ids":["SRC71","SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T020","module":"Intercultural Theory","subcategory":"Hofstede","topic":"PDI Application","difficulty":"C","question_type":"T3","question":"A workplace assumes that senior managers should make major decisions with little consultation simply because of rank. Which dimension is most relevant?","options":["Indulgence","Power Distance","High-context communication"],"answer":1,"explanation":"The situation concerns expected hierarchy and authority.","quick_rule":"ranked authority → PDI","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T021","module":"Intercultural Theory","subcategory":"Hofstede","topic":"IDV Application","difficulty":"C","question_type":"T3","question":"A policy debate centers on whether personal choice or obligations to a close in-group should receive priority. Which dimension is most relevant?","options":["Monochronic versus polychronic time","Uncertainty Avoidance","Individualism versus Collectivism"],"answer":2,"explanation":"The key contrast is autonomy versus in-group obligations.","quick_rule":"autonomy vs in-group → IDV","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T022","module":"Intercultural Theory","subcategory":"Hofstede","topic":"UAI Application","difficulty":"C","question_type":"T3","question":"A team requests detailed procedures before starting a novel project because unclear rules make members uncomfortable. Which dimension best fits?","options":["Uncertainty Avoidance","Communication Accommodation","Proxemics"],"answer":0,"explanation":"The scenario highlights discomfort with ambiguity and desire for structure.","quick_rule":"unclear rules + structure → UAI","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T023","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Model Distinction","difficulty":"C","question_type":"T2","question":"Which pairing is conceptually correct?","options":["Hall → national risk preference; Hofstede → personal space only.","Hall → context in communication; Hofstede → comparative cultural-value dimensions.","Hall → conflict styles; Hofstede → anxiety thresholds in stranger interaction."],"answer":1,"explanation":"Hall and Hofstede address different analytic dimensions.","quick_rule":"Hall = communication context; Hofstede = value dimensions","source_ids":["SRC72","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T024","module":"Intercultural Theory","subcategory":"Hofstede","topic":"Interpretation","difficulty":"D","question_type":"T3","question":"A country-level index suggests relatively high Power Distance. What is the strongest inference you can reasonably make?","options":["Managers from that country will always reject employee participation.","Every employee in that country prefers authoritarian management.","Hierarchical expectations may be more culturally accepted on average, but the behavior of a specific person still requires contextual evidence."],"answer":2,"explanation":"Country-level cultural scores support probabilistic comparison, not deterministic individual predictions.","quick_rule":"average tendency, not universal rule","source_ids":["SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T025","module":"Intercultural Theory","subcategory":"AUM","topic":"Core Distinction","difficulty":"B","question_type":"T2","question":"In AUM theory, uncertainty and anxiety are best distinguished as:","options":["uncertainty is difficulty predicting or explaining others; anxiety is affective unease about the interaction.","uncertainty is emotional discomfort; anxiety is lack of factual knowledge only.","they are interchangeable labels for the same psychological state."],"answer":0,"explanation":"AUM distinguishes a cognitive/predictive component from an affective component.","quick_rule":"uncertainty = predict; anxiety = feel","source_ids":["SRC70","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T026","module":"Intercultural Theory","subcategory":"AUM","topic":"Optimal Range","difficulty":"C","question_type":"T2","question":"Which statement best reflects AUM theory?","options":["Communication becomes effective only when uncertainty reaches zero.","Effective interaction requires managing anxiety and uncertainty within workable ranges rather than eliminating both completely.","Any anxiety automatically prevents effective intercultural communication."],"answer":1,"explanation":"AUM proposes manageable minimum/maximum ranges rather than total elimination.","quick_rule":"manage, don't eliminate","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T027","module":"Intercultural Theory","subcategory":"AUM","topic":"Too Much Certainty","difficulty":"C","question_type":"T2","question":"Why can extremely low uncertainty sometimes be problematic in AUM theory?","options":["It causes speakers to become more low-context.","It necessarily creates high Power Distance.","Overconfidence can encourage mistaken assumptions about the other person."],"answer":2,"explanation":"Too much certainty may produce unwarranted confidence and inaccurate prediction.","quick_rule":"too certain → overconfidence risk","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T028","module":"Intercultural Theory","subcategory":"AUM","topic":"Anxiety Effect","difficulty":"C","question_type":"T2","question":"Very high anxiety may undermine intercultural interaction because it can:","options":["narrow information processing and increase reliance on simplistic judgments.","automatically increase empathy and curiosity.","convert low-context communication into high-context communication."],"answer":0,"explanation":"Excessive anxiety can impair processing and contribute to stereotyping.","quick_rule":"too anxious → poorer processing","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T029","module":"Intercultural Theory","subcategory":"AUM","topic":"AUM vs UAI","difficulty":"B","question_type":"T2","question":"Which contrast is correct?","options":["AUM and UAI are two names for the same theory.","AUM focuses on anxiety/uncertainty in interaction; UAI is a cultural-value dimension concerning ambiguity.","AUM measures national hierarchy; UAI measures personal space."],"answer":1,"explanation":"They operate at different conceptual levels.","quick_rule":"interaction → AUM; cultural ambiguity → UAI","source_ids":["SRC70","SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T030","module":"Intercultural Theory","subcategory":"AUM","topic":"Interaction Trigger","difficulty":"B","question_type":"T3","question":"A student says, “I cannot predict how my unfamiliar partner will react, and that makes me nervous.” Which theory is most directly relevant?","options":["Communication Accommodation Theory","Power Distance","Anxiety/Uncertainty Management theory"],"answer":2,"explanation":"Both prediction uncertainty and affective anxiety are explicitly present.","quick_rule":"can't predict + nervous → AUM","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T031","module":"Intercultural Theory","subcategory":"AUM","topic":"Effective Communication","difficulty":"C","question_type":"T2","question":"In AUM-oriented reasoning, a useful response to uncertainty is to:","options":["seek information mindfully and avoid acting as if one's first assumptions are certain.","replace uncertainty with national stereotypes.","avoid all communication until the other person's behavior becomes predictable."],"answer":0,"explanation":"Managing uncertainty involves informed, attentive interaction rather than stereotyping or withdrawal.","quick_rule":"uncertainty → information, not stereotype","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T032","module":"Intercultural Theory","subcategory":"AUM","topic":"Theory Scope","difficulty":"C","question_type":"T2","question":"Which scenario is LEAST directly explained by AUM?","options":["A stranger feels nervous about how an unfamiliar cultural partner will react.","A society broadly prefers formal rules and predictability when situations are ambiguous.","A newcomer struggles to interpret another person's intentions during a first meeting."],"answer":1,"explanation":"The society-wide preference is closer to Hofstede's UAI.","quick_rule":"society-wide ambiguity preference → UAI","source_ids":["SRC70","SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T033","module":"Intercultural Theory","subcategory":"AUM","topic":"Thresholds","difficulty":"C","question_type":"T2","question":"AUM's idea of thresholds implies that:","options":["thresholds are fixed and identical for all individuals.","the lower the anxiety and uncertainty, the better in every case.","both excessively high and excessively low levels of anxiety/uncertainty can be less useful than a manageable range."],"answer":2,"explanation":"The theory allows an optimal/manageable range and individual variation.","quick_rule":"not zero; not one fixed threshold","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T034","module":"Intercultural Theory","subcategory":"AUM","topic":"Stereotyping","difficulty":"C","question_type":"T3","question":"A person feels highly anxious in an unfamiliar intercultural interaction and begins relying on crude group stereotypes. Which explanation is most consistent with AUM?","options":["Excessive anxiety can reduce nuanced information processing and encourage simplistic categorization.","High anxiety proves that the person's culture has high Uncertainty Avoidance.","Stereotyping is simply a form of communication convergence."],"answer":0,"explanation":"The key mechanism is anxiety affecting information processing.","quick_rule":"high anxiety → simplistic processing risk","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T035","module":"Intercultural Theory","subcategory":"AUM","topic":"Prediction","difficulty":"B","question_type":"T2","question":"Within AUM, uncertainty most directly concerns difficulty:","options":["maintaining physical distance.","predicting and explaining another person's attitudes or behavior.","protecting another person's public image."],"answer":1,"explanation":"Uncertainty is primarily about prediction/explanation.","quick_rule":"predict/explain → uncertainty","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T036","module":"Intercultural Theory","subcategory":"AUM","topic":"Individual Variation","difficulty":"D","question_type":"T2","question":"Which statement is most defensible?","options":["Experienced communicators must have no uncertainty at all.","All successful intercultural interactions require exactly the same anxiety level.","The workable range of anxiety and uncertainty can vary by individual and experience."],"answer":2,"explanation":"AUM-oriented research treats effective ranges as variable rather than universal fixed points.","quick_rule":"manageable range varies","source_ids":["SRC70"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T037","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Self-Face","difficulty":"B","question_type":"T2","question":"Self-face concern primarily refers to concern for:","options":["one's own social image and identity claims.","the other person's social image only.","the physical distance between speakers."],"answer":0,"explanation":"Self-face centers on one's own desired social image.","quick_rule":"own image → self-face","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T038","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Other-Face","difficulty":"B","question_type":"T2","question":"Other-face concern primarily refers to:","options":["concern only for one's own reputation.","concern for the other person's social image.","preference for explicit verbal messages."],"answer":1,"explanation":"Other-face focuses on protecting or attending to the other person's face.","quick_rule":"their image → other-face","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T039","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Mutual-Face","difficulty":"B","question_type":"T2","question":"Mutual-face is best understood as:","options":["the national level of Power Distance.","complete avoidance of disagreement.","concern for both parties' images and the relational face of the interaction."],"answer":2,"explanation":"Mutual-face extends concern to both sides and the relationship.","quick_rule":"both images / relationship → mutual-face","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T040","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face vs Strategy","difficulty":"C","question_type":"T2","question":"Which distinction is most accurate?","options":["Face concern addresses social-image motives; conflict style describes how conflict is managed behaviorally.","Face and conflict style are identical concepts.","Face concerns physical appearance; conflict style concerns spoken language."],"answer":0,"explanation":"Face is an explanatory mechanism; styles are behavioral approaches.","quick_rule":"why image matters vs how conflict handled","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T041","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Self-Face Application","difficulty":"C","question_type":"T3","question":"During a dispute, a speaker becomes preoccupied with defending personal status and winning publicly. Which face orientation is most salient?","options":["Other-face","Self-face","Mutual-face"],"answer":1,"explanation":"The emphasis is on protecting one's own image.","quick_rule":"protect my image → self-face","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T042","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Other-Face Application","difficulty":"C","question_type":"T3","question":"A speaker carefully rephrases criticism to avoid publicly humiliating a colleague. Which concern is most directly shown?","options":["Uncertainty Avoidance","Self-face","Other-face"],"answer":2,"explanation":"The action protects the colleague's social image.","quick_rule":"protect their dignity → other-face","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T043","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face and Conflict","difficulty":"C","question_type":"T2","question":"Research testing face-negotiation theory found self-face to be positively associated especially with which conflict style?","options":["Dominating","Obliging","Avoiding"],"answer":0,"explanation":"Cross-cultural empirical work linked self-face positively with dominating behavior.","quick_rule":"self-face ↔ dominating","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T044","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face and Integrating","difficulty":"C","question_type":"T2","question":"Which statement is supported by face-negotiation research?","options":["Other-face necessarily produces only avoidance.","Other-face can be positively related to integrating as well as avoiding conflict styles.","Integrating requires no concern for the other person's image."],"answer":1,"explanation":"Empirical work finds more complex relations than the stereotype that face always means passive avoidance.","quick_rule":"face concern ≠ automatic avoidance","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T045","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face Trap","difficulty":"C","question_type":"T2","question":"Which interpretation should be avoided?","options":["Distinguishing face motive from the specific strategy selected.","Treating face as a social-image concern that may influence different conflict strategies.","Assuming that concern for face means a person will always avoid conflict."],"answer":2,"explanation":"Face concerns can relate to several strategies, including integrating.","quick_rule":"face ≠ always avoid","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T046","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face vs Hall","difficulty":"C","question_type":"T2","question":"A speaker uses an indirect phrase specifically to protect another person's dignity. If asked for the underlying motive, the best answer is:","options":["Other-face concern","High-context communication","Polychronic time"],"answer":0,"explanation":"Indirect form may be contextual, but the stated motive is protection of dignity.","quick_rule":"motive = dignity → face","source_ids":["SRC71","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T047","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Face vs Hierarchy","difficulty":"D","question_type":"T3","question":"A junior employee softens disagreement with a senior manager because public contradiction could embarrass both parties. Which explanation best captures the immediate mechanism?","options":["Power Distance alone","Mutual/other-face concern","Long-Term Orientation"],"answer":1,"explanation":"Hierarchy may shape the setting, but the immediate concern described is social image for both sides.","quick_rule":"embarrassment/social image → face","source_ids":["SRC71","SRC72"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T048","module":"Intercultural Theory","subcategory":"Face Negotiation","topic":"Theory Logic","difficulty":"C","question_type":"T2","question":"Which statement best captures face-negotiation theory?","options":["Face concern affects only nonverbal distance.","Conflict behavior is determined by nationality alone.","Culture and self-construal can influence conflict behavior partly through face concerns."],"answer":2,"explanation":"Empirical tests treat face as a mechanism connecting cultural/self-construal factors with conflict styles.","quick_rule":"culture/self → face → conflict behavior","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T049","module":"Intercultural Theory","subcategory":"CAT","topic":"Convergence","difficulty":"B","question_type":"T2","question":"In Communication Accommodation Theory, convergence means:","options":["adjusting communication to become more similar to an interlocutor.","emphasizing communicative differences to create distance.","refusing to change one's communication under any circumstances."],"answer":0,"explanation":"Convergence increases similarity in communicative behavior.","quick_rule":"more similar → convergence","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T050","module":"Intercultural Theory","subcategory":"CAT","topic":"Divergence","difficulty":"B","question_type":"T2","question":"Divergence refers to:","options":["making speech more similar to the interlocutor.","accentuating communicative differences from an interlocutor.","reducing uncertainty by asking questions."],"answer":1,"explanation":"Divergence emphasizes difference and can increase social distance.","quick_rule":"emphasize difference → divergence","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T051","module":"Intercultural Theory","subcategory":"CAT","topic":"Maintenance","difficulty":"B","question_type":"T2","question":"A speaker keeps the same communication style without moving closer to or farther from the partner's style. This is:","options":["divergence","convergence","maintenance"],"answer":2,"explanation":"Maintenance means no accommodation toward similarity or difference.","quick_rule":"no adjustment → maintenance","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T052","module":"Intercultural Theory","subcategory":"CAT","topic":"Scope","difficulty":"B","question_type":"T2","question":"CAT seeks to explain:","options":["why, when and how people adjust communicative behavior during interaction and what consequences follow.","how societies tolerate ambiguity at the national level.","how heritage is classified by UNESCO."],"answer":0,"explanation":"CAT is about communicative adjustment in interpersonal/intergroup interaction.","quick_rule":"adjust communication → CAT","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T053","module":"Intercultural Theory","subcategory":"CAT","topic":"Speech Rate","difficulty":"C","question_type":"T3","question":"A lecturer slows speech and reduces idioms after noticing comprehension difficulty. Which CAT process is most evident?","options":["Divergence","Convergence/accommodation toward the listener's communicative needs","Power Distance"],"answer":1,"explanation":"The lecturer changes communicative behavior to improve alignment/comprehension.","quick_rule":"adapt speech toward partner → convergence","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T054","module":"Intercultural Theory","subcategory":"CAT","topic":"Identity Function","difficulty":"C","question_type":"T3","question":"A speaker deliberately strengthens a regional accent when outsiders mock the speaker's community. Which CAT concept best fits?","options":["Integrating conflict style","Convergence","Divergence"],"answer":2,"explanation":"The speaker accentuates difference to signal identity and social distance.","quick_rule":"identity difference emphasized → divergence","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T055","module":"Intercultural Theory","subcategory":"CAT","topic":"CAT vs Adaptation","difficulty":"C","question_type":"T2","question":"Which statement best distinguishes CAT from cross-cultural adaptation theory?","options":["CAT focuses on communicative adjustment in interaction; adaptation addresses broader longer-term adjustment to a cultural environment.","CAT is always long-term, while adaptation occurs only within one conversation.","They are interchangeable theories."],"answer":0,"explanation":"The scales and processes differ.","quick_rule":"adjust speech now → CAT; adjust life over time → adaptation","source_ids":["SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T056","module":"Intercultural Theory","subcategory":"CAT","topic":"CAT vs High Context","difficulty":"C","question_type":"T2","question":"A speaker changes vocabulary to match an interlocutor's level of technical knowledge. Which concept is more directly relevant than high-/low-context communication?","options":["High-context communication","Communication accommodation","Power Distance"],"answer":1,"explanation":"The defining feature is adjustment to the partner.","quick_rule":"partner-driven adjustment → CAT","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T057","module":"Intercultural Theory","subcategory":"CAT","topic":"Consequences","difficulty":"C","question_type":"T2","question":"Which is the best general claim about convergence?","options":["It necessarily causes assimilation of cultural identity.","It is always evaluated positively.","It can support rapport or comprehension, but its effects depend on how the adjustment is perceived."],"answer":2,"explanation":"Accommodation effects depend on context and perception; convergence is not automatically positive.","quick_rule":"convergence ≠ always good","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T058","module":"Intercultural Theory","subcategory":"CAT","topic":"Overgeneralization","difficulty":"D","question_type":"T2","question":"Which inference is least defensible?","options":["A person who converges in one conversation is abandoning their cultural identity.","A person may adjust speech rate for comprehension without changing identity.","Accommodation can serve interpersonal and intergroup functions."],"answer":0,"explanation":"Local communicative adjustment does not imply total identity assimilation.","quick_rule":"local adjustment ≠ identity abandonment","source_ids":["SRC69"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T059","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Integrating","difficulty":"B","question_type":"T2","question":"Integrating conflict management is characterized by:","options":["high concern for self and low concern for others.","high concern for self and high concern for others, with a problem-solving orientation.","low concern for self and high concern for others."],"answer":1,"explanation":"Integrating seeks a win-win solution by addressing both sides' concerns.","quick_rule":"high self + high other → integrating","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T060","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Dominating","difficulty":"B","question_type":"T2","question":"Dominating is best represented by:","options":["low concern for both sides.","low concern for self and high concern for others.","high concern for self and low concern for others."],"answer":2,"explanation":"Dominating prioritizes one's own position.","quick_rule":"high self + low other → dominating","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T061","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Obliging","difficulty":"B","question_type":"T2","question":"Obliging is best represented by:","options":["low concern for self and high concern for others.","high concern for self and high concern for others.","high concern for self and low concern for others."],"answer":0,"explanation":"Obliging/accommodating yields to the other side's concerns.","quick_rule":"low self + high other → obliging","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T062","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Avoiding","difficulty":"B","question_type":"T2","question":"Avoiding generally reflects:","options":["high concern for both sides.","low active concern for both one's own and the other side's substantive goals in the immediate conflict.","high concern for self and low concern for others."],"answer":1,"explanation":"Avoiding withdraws from active engagement with the conflict.","quick_rule":"low/low → avoiding","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T063","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Compromising","difficulty":"B","question_type":"T2","question":"Compromising is best described as:","options":["complete withdrawal from the issue.","a full problem-solving attempt to satisfy both sides maximally.","a middle-ground give-and-take in which each side gives up something."],"answer":2,"explanation":"Compromise seeks an intermediate settlement.","quick_rule":"split difference / give-and-take → compromise","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T064","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Integrating vs Compromise","difficulty":"C","question_type":"T2","question":"Which statement best distinguishes integrating from compromising?","options":["Integrating seeks a solution addressing both parties' underlying concerns; compromising accepts mutual concessions.","Integrating means avoiding disagreement; compromising means dominating.","They are identical strategies."],"answer":0,"explanation":"Integrating aims for joint problem solving; compromise trades concessions.","quick_rule":"solve needs vs split difference","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T065","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Style Recognition","difficulty":"C","question_type":"T3","question":"Two negotiators identify each side's core interests and redesign the proposal so both can achieve their most important goals. This is:","options":["Compromising","Integrating","Obliging"],"answer":1,"explanation":"The solution attempts to satisfy both sets of underlying interests rather than merely split the difference.","quick_rule":"joint problem-solving → integrating","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T066","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Style Recognition","difficulty":"C","question_type":"T3","question":"One party accepts the other's preferred solution mainly to preserve the relationship, despite giving up its own preference. This is:","options":["Integrating","Dominating","Obliging"],"answer":2,"explanation":"The party places the other's concern above its own.","quick_rule":"yield to other → obliging","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T067","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Style Recognition","difficulty":"C","question_type":"T3","question":"Both sides agree to reduce their demands by the same amount to reach a settlement quickly. This is:","options":["Compromising","Integrating","Avoiding"],"answer":0,"explanation":"Equal concessions are characteristic of compromise rather than deeper integrative problem solving.","quick_rule":"mutual concession → compromise","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T068","module":"Intercultural Theory","subcategory":"Conflict Management","topic":"Style Trap","difficulty":"D","question_type":"T2","question":"Which statement is most defensible?","options":["Integrating is always culturally appropriate regardless of context.","A conflict style should be interpreted in context; no single style is universally best for every intercultural situation.","Avoiding always indicates low intercultural competence."],"answer":1,"explanation":"Appropriateness depends on goals, relationships, timing and context.","quick_rule":"style effectiveness is contextual","source_ids":["SRC71"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T069","module":"Intercultural Theory","subcategory":"Identity","topic":"Multiple Identities","difficulty":"B","question_type":"T2","question":"Which statement about identity is most accurate?","options":["Identity is determined entirely by personal choice with no social influence.","A person has one fixed cultural identity that never changes in relevance.","People can hold multiple social and cultural identities that become more or less salient across contexts."],"answer":2,"explanation":"Identity is multiple and context-sensitive.","quick_rule":"identity = multiple + contextual","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T070","module":"Intercultural Theory","subcategory":"Identity","topic":"Social Construction","difficulty":"B","question_type":"T2","question":"Which claim best reflects an intercultural communication perspective on identity?","options":["Identity is shaped through both self-understanding and social interaction.","Identity is solely inherited at birth.","Identity is simply another term for nationality."],"answer":0,"explanation":"Identity involves social processes and negotiated meanings.","quick_rule":"self + interaction → identity","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T071","module":"Intercultural Theory","subcategory":"Identity","topic":"Salience","difficulty":"C","question_type":"T3","question":"A bilingual student emphasizes professional identity in a conference, regional identity with hometown friends, and student identity in class. What does this illustrate?","options":["Uncertainty Avoidance","Context-dependent identity salience","Divergence only"],"answer":1,"explanation":"Different identities can become salient in different contexts.","quick_rule":"which identity matters now → salience","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T072","module":"Intercultural Theory","subcategory":"Identity","topic":"Identity vs Stereotype","difficulty":"C","question_type":"T2","question":"Which distinction is correct?","options":["Stereotype is always self-chosen, whereas identity is always externally imposed.","Identity and stereotype are interchangeable.","Identity concerns how people locate/understand themselves socially; stereotype is a generalized belief about a group."],"answer":2,"explanation":"The two concepts operate differently.","quick_rule":"self/social positioning vs generalized group belief","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T073","module":"Intercultural Theory","subcategory":"Identity","topic":"Negotiation","difficulty":"C","question_type":"T2","question":"Identity negotiation emphasizes that:","options":["people present and negotiate identity meanings with others during interaction.","identity is irrelevant to communication.","national identity always overrides every other identity."],"answer":0,"explanation":"Identity meanings emerge and are negotiated relationally.","quick_rule":"identity is negotiated in interaction","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T074","module":"Intercultural Theory","subcategory":"Identity","topic":"Overgeneralization","difficulty":"C","question_type":"T2","question":"Which statement should be rejected?","options":["National identity may matter in some contexts but coexist with many other identities.","Knowing someone's nationality is enough to determine their complete identity.","Professional, linguistic, regional and relational identities may also become salient."],"answer":1,"explanation":"Nationality is one possible identity dimension, not a complete description of a person.","quick_rule":"nationality ≠ whole identity","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T075","module":"Intercultural Theory","subcategory":"Identity","topic":"Identity and CAT","difficulty":"D","question_type":"T3","question":"A speaker emphasizes a heritage dialect during a group encounter to signal belonging to an in-group. Which two concepts are especially relevant?","options":["Long-Term Orientation and chronemics","Uncertainty Avoidance and proxemics","Identity salience and communicative divergence"],"answer":2,"explanation":"The behavior both marks identity and increases communicative distinctiveness.","quick_rule":"identity signal + difference → identity + CAT","source_ids":["SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T076","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Long-Term Adjustment","difficulty":"B","question_type":"T2","question":"Cross-cultural adaptation theory is most directly concerned with:","options":["broader ongoing adjustment to living and communicating in a new cultural environment.","one temporary change in speech rate during a conversation.","national preferences for hierarchy."],"answer":0,"explanation":"Adaptation is broader and longer-term than local accommodation.","quick_rule":"adjust to host environment over time → adaptation","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T077","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Stress-Adaptation-Growth","difficulty":"B","question_type":"T2","question":"Which sequence is most associated with Young Yun Kim's adaptation perspective?","options":["stereotype → prejudice → discrimination","stress → adaptation → growth","convergence → divergence → maintenance"],"answer":1,"explanation":"Kim's integrative perspective describes a dynamic stress-adaptation-growth process.","quick_rule":"stress–adaptation–growth","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T078","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Dynamic Process","difficulty":"C","question_type":"T2","question":"Which statement is most accurate about cross-cultural adaptation?","options":["It requires giving up all prior cultural identities.","It is completed after the first successful conversation.","It is a dynamic process that can involve repeated challenges and adjustments rather than a simple one-way linear path."],"answer":2,"explanation":"Adaptation unfolds through continuing engagement and adjustment.","quick_rule":"ongoing process, not one event","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T079","module":"Intercultural Theory","subcategory":"Adaptation","topic":"CAT Distinction","difficulty":"C","question_type":"T2","question":"An international student gradually learns how to navigate classroom norms, housing, friendships and daily institutions over a year. Which framework best fits?","options":["Cross-cultural adaptation","Communication Accommodation Theory","Proxemics"],"answer":0,"explanation":"The adjustment is broad, long-term and environmental.","quick_rule":"whole-life adjustment over time → adaptation","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T080","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Assimilation Trap","difficulty":"C","question_type":"T2","question":"Which statement is least defensible?","options":["Adaptation can involve learning to function effectively while retaining prior identities.","Successful adaptation necessarily requires abandoning one's original cultural identity.","People may develop expanded intercultural repertoires through adaptation."],"answer":1,"explanation":"Adaptation does not inherently require total identity replacement.","quick_rule":"adaptation ≠ total assimilation","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T081","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Host Environment","difficulty":"C","question_type":"T3","question":"A newcomer becomes more effective after repeatedly learning local interaction norms and revising unsuccessful strategies. Which concept is central?","options":["Indulgence","Power Distance","Cross-cultural adaptation"],"answer":2,"explanation":"Repeated learning and adjustment to a new cultural environment are adaptation processes.","quick_rule":"learn + revise in host environment → adaptation","source_ids":["SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T082","module":"Intercultural Theory","subcategory":"Adaptation","topic":"Scale","difficulty":"D","question_type":"T2","question":"Which distinction is strongest?","options":["Accommodation can occur within a single encounter; adaptation usually refers to broader adjustment across time and contexts.","Accommodation is cultural and adaptation is purely biological.","Adaptation is always immediate while accommodation always takes years."],"answer":0,"explanation":"The key distinction is scale and duration, not absolute exclusivity.","quick_rule":"interaction scale vs life-context scale","source_ids":["SRC69","SRC73"],"status":"simulation_verified","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"T17T083","module":"Intercultural Theory","subcategory":"Nonverbal Communication","topic
