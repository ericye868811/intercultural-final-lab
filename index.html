ing.","quick_rule":"Meeting opening/closing → handshake.","source_ids":["SRC29"],"source_url":"https://www.trade.gov/country-commercial-guides/france-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q011","module":"World Cultures","subcategory":"France","topic":"Relationship Building","difficulty":"C","question_type":"T4","question":"Which statement best reflects the French guide’s treatment of relationship-building?","options":["Formality makes informal relationship-building inappropriate.","Restaurant discussions should never include business.","Formal business conduct can coexist with informal restaurant discussions that strengthen working relations.","Business relationships are expected to remain entirely impersonal."],"answer":2,"explanation":"The guide combines formal meeting norms with the observation that informal restaurant discussions can promote good working relations.","quick_rule":"Formality and relationship-building can coexist.","source_ids":["SRC29"],"source_url":"https://www.trade.gov/country-commercial-guides/france-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q012","module":"World Cultures","subcategory":"France","topic":"Concept Distinction","difficulty":"C","question_type":"T2","question":"A French meeting begins with careful greetings, titles, and professional formality. Which conclusion is the most defensible?","options":["They demonstrate that every French person has high power distance.","These are contextual business norms; they do not by themselves prove a particular individual’s power-distance orientation.","They necessarily indicate high-context communication.","They are direct evidence of proxemics."],"answer":1,"explanation":"Observed etiquette should not be overextended into deterministic claims about an individual or a national score.","quick_rule":"Etiquette ≠ automatic proof of a cultural dimension.","source_ids":["SRC29"],"source_url":"https://www.trade.gov/country-commercial-guides/france-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Avoiding essentialism"},{"id":"WC2Q013","module":"World Cultures","subcategory":"France","topic":"Appointments","difficulty":"B","question_type":"T4","question":"A colleague repeatedly changes agreed appointment times with French partners without notice. Which aspect of the official guide is being neglected?","options":["Respect for appointment schedules.","A norm against professional attire.","A preference for spontaneous meetings.","A ban on written correspondence."],"answer":0,"explanation":"The French guide explicitly says appointment schedules should be respected.","quick_rule":"Schedule respect is a concrete norm, not a stereotype.","source_ids":["SRC29"],"source_url":"https://www.trade.gov/country-commercial-guides/france-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q014","module":"World Cultures","subcategory":"Italy","topic":"First Names and Titles","difficulty":"B","question_type":"T3","question":"At an initial Italian business meeting, which approach is recommended?","options":["Insist on first names immediately.","Avoid acknowledging professional positions.","Use titles and avoid first names until a stronger relationship is established."],"answer":2,"explanation":"The guide advises greater formality than typical U.S. practice and recommends waiting before using first names.","quick_rule":"Italy: titles first; familiarity later.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q015","module":"World Cultures","subcategory":"Italy","topic":"Getting Down to Business","difficulty":"C","question_type":"T4","question":"A visitor opens an Italian first meeting by immediately presenting prices and asking for a decision. The other side seems put off. Which interpretation best matches the guide?","options":["The problem is primarily personal-space distance.","The approach may feel abrupt; allowing the prospective buyer to take the lead can be more appropriate early on.","Italian business culture rejects discussion of price.","The reaction proves the buyers dislike foreign firms."],"answer":1,"explanation":"The guide cautions that an immediate “get down to business” approach can be perceived as abrupt in early stages.","quick_rule":"Opening rhythm matters: do not rush the relationship.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q016","module":"World Cultures","subcategory":"Italy","topic":"Punctuality","difficulty":"B","question_type":"T3","question":"Which statement about Italian business appointments is supported by the official guide?","options":["Appointments are expected and visitors should be punctual.","Business appointments are generally unnecessary.","Arriving late is the preferred way to signal status."],"answer":0,"explanation":"The guide states that business appointments are required and visitors are expected to be punctual.","quick_rule":"Italy business: appointment + punctuality.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q017","module":"World Cultures","subcategory":"Italy","topic":"Correspondence","difficulty":"B","question_type":"T4","question":"An Italian firm sends a detailed inquiry. Which response best follows the official guide?","options":["Use silence to encourage the other side to follow up.","Acknowledge it promptly and provide a timely reply.","Reply only after an in-person meeting.","Wait several weeks so as not to appear overeager."],"answer":1,"explanation":"Prompt replies and acknowledgment of correspondence are described as prerequisites for success.","quick_rule":"Responsiveness is a concrete business norm.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q018","module":"World Cultures","subcategory":"Italy","topic":"Delivery Commitments","difficulty":"C","question_type":"T4","question":"A supplier is unsure whether it can meet an early delivery date for an Italian buyer. What is the safer strategy?","options":["Promise a later date that can be met reliably.","Assume schedule changes will not matter.","Promise the earliest possible date even if it is uncertain.","Avoid discussing delivery timing until after shipment."],"answer":0,"explanation":"The guide emphasizes honoring stated delivery dates and recommends a later reliable date over an unrealistic early promise.","quick_rule":"Reliability beats optimistic overpromising.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q019","module":"World Cultures","subcategory":"Italy","topic":"Language and Courtesy","difficulty":"C","question_type":"T3","question":"For a first written approach to an Italian firm, the guide recommends that correspondence:","options":["must always be in English.","be in Italian when possible.","avoid any written material and rely only on calls."],"answer":1,"explanation":"The guide says first contact in Italian is regarded as a courtesy and can improve attention and accuracy.","quick_rule":"First contact: local-language effort can signal respect.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q020","module":"World Cultures","subcategory":"Italy","topic":"Theory Integration","difficulty":"C","question_type":"T2","question":"A visitor avoids first names until invited and lets the Italian buyer set the pace of the first meeting. What is the best interpretation?","options":["Evidence that all Italians are high in uncertainty avoidance.","Context-sensitive adaptation to local interaction norms.","A case of divergence in Communication Accommodation Theory.","Complete assimilation of personal identity."],"answer":1,"explanation":"Adjusting behavior to contextual norms is intercultural adaptation in interaction; it does not require deterministic cultural labeling.","quick_rule":"Adapt behavior without essentializing people.","source_ids":["SRC30"],"source_url":"https://www.trade.gov/country-commercial-guides/italy-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Intercultural competence"},{"id":"WC2Q021","module":"World Cultures","subcategory":"United Kingdom","topic":"Appointment Planning","difficulty":"B","question_type":"T3","question":"Compared with typical U.S. practice, the UK guide recommends:","options":["confirming appointments only after arrival.","avoiding appointments and relying on drop-in visits.","allowing a longer lead time when arranging appointments."],"answer":2,"explanation":"The guide notes longer lead times for appointments and adherence to schedules.","quick_rule":"UK: plan ahead and respect the schedule.","source_ids":["SRC31"],"source_url":"https://www.trade.gov/country-commercial-guides/united-kingdom-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q022","module":"World Cultures","subcategory":"United Kingdom","topic":"Sustained Contact","difficulty":"B","question_type":"T4","question":"A company makes one brief sales visit to a potential UK partner and then stops communicating. What has it most likely neglected?","options":["A cultural preference against email.","A norm requiring gift exchange after every meeting.","A rule that negotiations must occur at dinner.","The expectation of sustained personal contact with potential partners."],"answer":3,"explanation":"The guide says sustained personal contact with potential business partners is expected.","quick_rule":"One contact is not the same as relationship maintenance.","source_ids":["SRC31"],"source_url":"https://www.trade.gov/country-commercial-guides/united-kingdom-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q023","module":"World Cultures","subcategory":"United Kingdom","topic":"Formality","difficulty":"C","question_type":"T3","question":"Which statement best reflects the UK guide?","options":["UK and U.S. business customs are identical.","British business is always less formal than U.S. business.","Business can be somewhat more formal than comparable U.S. practice even though the two systems share many similarities."],"answer":2,"explanation":"The guide explicitly notes similarities alongside greater formality in some UK business conduct.","quick_rule":"Similarity does not erase contextual differences.","source_ids":["SRC31"],"source_url":"https://www.trade.gov/country-commercial-guides/united-kingdom-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q024","module":"World Cultures","subcategory":"United Kingdom","topic":"Correspondence","difficulty":"B","question_type":"T4","question":"A British partner emails a business inquiry. Which action best aligns with the guide?","options":["Delay the reply to signal seniority.","Avoid written replies because email is uncommon.","Switch immediately to informal messaging only.","Acknowledge the correspondence promptly."],"answer":3,"explanation":"Prompt acknowledgment of correspondence is identified as a business norm.","quick_rule":"Professional responsiveness matters.","source_ids":["SRC31"],"source_url":"https://www.trade.gov/country-commercial-guides/united-kingdom-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q025","module":"World Cultures","subcategory":"United Kingdom","topic":"Avoiding Overgeneralization","difficulty":"C","question_type":"T2","question":"Which inference is least defensible from the fact that UK business may be more formal than U.S. business?","options":["Every British individual prefers hierarchy in all areas of life.","Meeting conventions can differ even between culturally similar countries.","Formality may shape address and scheduling practices."],"answer":0,"explanation":"A business guideline describes tendencies in a context; it cannot establish every individual’s personal values.","quick_rule":"Contextual norm ≠ individual personality.","source_ids":["SRC31"],"source_url":"https://www.trade.gov/country-commercial-guides/united-kingdom-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Avoiding essentialism"},{"id":"WC2Q026","module":"World Cultures","subcategory":"United Kingdom","topic":"Best Adaptation","difficulty":"C","question_type":"T4","question":"A visitor assumes that because the UK and U.S. share English, identical meeting practices will apply. What is the better approach?","options":["Assume language similarity guarantees cultural similarity.","Treat every difference as evidence of communication failure.","Ignore local practices unless a conflict occurs.","Keep the linguistic similarity in mind but verify local expectations about formality, scheduling, and relationship maintenance."],"answer":3,"explanation":"The guide specifically notes cultural differences despite broad similarities between the UK and U.S.","quick_rule":"Shared language ≠ identical interaction norms.","source_ids":["SRC31"],"source_url":"https://www.trade.gov/country-commercial-guides/united-kingdom-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q027","module":"World Cultures","subcategory":"Japan","topic":"Harmony","difficulty":"B","question_type":"T3","question":"Which feature is emphasized in the official guide to Japanese business culture?","options":["Immediate individual decision-making without consultation.","Public confrontation as the preferred way to test commitment.","Maintaining harmony and avoiding direct confrontation."],"answer":2,"explanation":"The guide describes Japanese society as placing strong emphasis on harmony and avoiding direct confrontation.","quick_rule":"Japan guide: harmony + less direct confrontation.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q028","module":"World Cultures","subcategory":"Japan","topic":"Relationship Building","difficulty":"B","question_type":"T4","question":"A foreign firm expects a first meeting in Japan to produce an immediate sale. Which adjustment is most appropriate?","options":["Replace all meetings with email to improve efficiency.","Treat relationship-building as irrelevant to business.","Push for a public yes/no decision at the start.","Allow time for trust and long-term relationship-building before expecting commitment."],"answer":3,"explanation":"The guide says relationship-building often precedes a first-time sale or agreement and highlights trust, loyalty, and long-term commitment.","quick_rule":"Relationship before transaction can be important.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q029","module":"World Cultures","subcategory":"Japan","topic":"Group Decision-Making","difficulty":"B","question_type":"T3","question":"The official guide describes Japanese group decision-making as often:","options":["a bottom-up rather than purely top-down process.","an exclusively individual process.","a process in which the most junior person decides immediately."],"answer":0,"explanation":"The guide explicitly notes the importance of group decision-making and its often bottom-up character.","quick_rule":"Do not equate hierarchy with purely top-down decisions.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q030","module":"World Cultures","subcategory":"Japan","topic":"Indirectness vs Face","difficulty":"C","question_type":"T2","question":"A Japanese colleague avoids openly contradicting a senior person in a meeting. If the question asks *why public confrontation is avoided to preserve harmony*, which concept is most relevant?","options":["Uncertainty Avoidance alone.","Proxemics.","Face/harmony concern.","Chronemics."],"answer":2,"explanation":"The scenario emphasizes preserving relational harmony and avoiding public confrontation, which aligns most closely with face-related concerns.","quick_rule":"Harmony/dignity motive → face; message form may separately involve context.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Face-Negotiation"},{"id":"WC2Q031","module":"World Cultures","subcategory":"Japan","topic":"High Context vs Collectivism","difficulty":"C","question_type":"T2","question":"Which distinction is most accurate when analyzing Japanese business communication?","options":["Group decision-making is a form of proxemics.","Indirect message interpretation and group orientation are related possibilities but describe different dimensions.","High-context communication measures hierarchy.","Indirectness and collectivism are the same concept."],"answer":1,"explanation":"How meaning is communicated differs conceptually from how individuals relate to groups; they should not be collapsed into one variable.","quick_rule":"Message pattern ≠ self–group value dimension.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Hall vs Hofstede"},{"id":"WC2Q032","module":"World Cultures","subcategory":"Japan","topic":"English Meetings","difficulty":"C","question_type":"T4","question":"A visitor assumes that because a Japanese meeting is conducted in English, Western business norms automatically apply. What is the best response?","options":["Assume the Japanese participants reject local norms by using English.","Do not make that assumption; language choice does not erase local social and business norms.","English automatically makes the interaction culturally neutral.","Use only Western norms unless explicitly corrected."],"answer":1,"explanation":"The official guide explicitly warns against assuming Western norms apply merely because meetings are conducted in English.","quick_rule":"Language used ≠ culture erased.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q033","module":"World Cultures","subcategory":"Japan","topic":"Intercultural Competence","difficulty":"C","question_type":"T4","question":"A Japanese partner is slow to commit because several colleagues are consulting internally. Which response is most interculturally competent?","options":["Label the process inefficient and demand an immediate answer.","Assume no one wants the deal.","Bypass the group and pressure one junior employee to decide.","Ask about the decision process and timeline, then adapt expectations without assuming indecision or incompetence."],"answer":3,"explanation":"The guide emphasizes group decision-making; effective communication requires interpreting the process contextually rather than negatively.","quick_rule":"Clarify process before judging behavior.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Intercultural competence"},{"id":"WC2Q034","module":"World Cultures","subcategory":"Japan","topic":"Essentialism","difficulty":"D","question_type":"T2","question":"Which statement best avoids essentializing Japanese culture?","options":["National culture completely predicts negotiating behavior.","Every Japanese manager is collectivist to the same degree.","Japanese people always avoid disagreement.","The guide identifies group orientation and harmony as useful contextual tendencies, but individual behavior can vary by person, organization, and situation."],"answer":3,"explanation":"Country guides provide contextual tendencies, not deterministic rules for individuals.","quick_rule":"Use cultural patterns as hypotheses, not verdicts.","source_ids":["SRC32"],"source_url":"https://www.trade.gov/country-commercial-guides/japan-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Avoiding essentialism"},{"id":"WC2Q035","module":"World Cultures","subcategory":"South Korea","topic":"Titles","difficulty":"B","question_type":"T3","question":"In formal South Korean business interaction, the official guide recommends:","options":["using first names immediately.","dropping titles to reduce hierarchy.","using titles with family names."],"answer":2,"explanation":"The guide advises using Mr., Mrs., or an appropriate title followed by the last name.","quick_rule":"Korea: title + family name is a safe formal default.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q036","module":"World Cultures","subcategory":"South Korea","topic":"Business Cards","difficulty":"B","question_type":"T3","question":"Which practice is recommended when exchanging business cards in South Korea?","options":["Put the received card immediately into a back pocket.","Write extensive notes on the card while the giver watches.","Present the card with both hands and treat a received card respectfully."],"answer":2,"explanation":"The guide describes two-handed presentation and careful treatment of received cards.","quick_rule":"Card exchange is an interaction ritual, not merely information transfer.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q037","module":"World Cultures","subcategory":"South Korea","topic":"Cold Calls","difficulty":"B","question_type":"T4","question":"A salesperson wants to enter the Korean market by making unsolicited cold calls to senior executives. According to the guide, what is the main risk?","options":["Cold calls are required before any introduction.","The issue is mainly personal-space distance.","Cold calls can be viewed as culturally inappropriate or disrespectful.","Executives generally refuse all phone communication."],"answer":2,"explanation":"The guide states that cold calls are generally unacceptable and seen as inappropriate and disrespectful.","quick_rule":"Introductions and established contact matter.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q038","module":"World Cultures","subcategory":"South Korea","topic":"Negotiation","difficulty":"C","question_type":"T4","question":"A negotiator insists on an inflexible “take it or leave it” position in South Korea. Which adjustment best matches the guide?","options":["Become even more rigid to show confidence.","Replace negotiation with gift-giving.","Use a less rigid negotiating style and remain responsive to the relationship and process.","Avoid all direct discussion of business terms."],"answer":2,"explanation":"The guide explicitly says a rigid negotiating style does not work well in Korea.","quick_rule":"Flexibility in process is distinct from surrendering objectives.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q039","module":"World Cultures","subcategory":"South Korea","topic":"Theory Integration","difficulty":"C","question_type":"T2","question":"A visitor carefully studies a Korean partner’s business card before placing it on the table. What is the best theoretical interpretation?","options":["It directly measures power distance.","It proves the visitor has assimilated culturally.","It is an example of proxemics.","It is accommodation to a local interaction norm; the behavior alone does not prove a Hofstede dimension."],"answer":3,"explanation":"Business-card etiquette is a contextual social norm; adapting to it is appropriate accommodation without requiring broad cultural inference.","quick_rule":"Etiquette → contextual adaptation, not automatic dimension score.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Intercultural competence"},{"id":"WC2Q040","module":"World Cultures","subcategory":"South Korea","topic":"Handshake","difficulty":"B","question_type":"T3","question":"How does the official guide characterize a typical Korean business handshake relative to a firm Western-style handshake?","options":["It is normally replaced by a hug.","It may be gentler.","It must always be avoided."],"answer":1,"explanation":"The guide notes that Korean handshakes are typically gentler than the firm Western-style handshake.","quick_rule":"Nonverbal norms can differ in degree, not only in kind.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q041","module":"World Cultures","subcategory":"South Korea","topic":"Best Response","difficulty":"C","question_type":"T4","question":"You receive a Korean executive’s card and immediately place it in your back pocket. After learning this can be disrespectful, what is the best intercultural response?","options":["Avoid accepting any future business cards.","Acknowledge the mistake, adapt the behavior, and avoid turning the incident into a stereotype about Koreans.","Conclude that Korean culture values objects more than people.","Insist that card treatment has no communicative meaning."],"answer":1,"explanation":"Intercultural competence combines knowledge of the norm with flexible repair and non-stereotyped interpretation.","quick_rule":"Learn, repair, adapt.","source_ids":["SRC33"],"source_url":"https://www.trade.gov/country-commercial-guides/south-korea-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Intercultural competence"},{"id":"WC2Q042","module":"World Cultures","subcategory":"Singapore","topic":"Business Language","difficulty":"B","question_type":"T3","question":"Which statement is supported by the Singapore business guide?","options":["English is widely used in business.","Business is normally conducted only in Mandarin.","English is generally avoided in professional settings."],"answer":0,"explanation":"The guide states that most businesspeople speak English.","quick_rule":"Singapore business: English is widely used, but society remains multilingual.","source_ids":["SRC34"],"source_url":"https://www.trade.gov/country-commercial-guides/singapore-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q043","module":"World Cultures","subcategory":"Singapore","topic":"Communication","difficulty":"B","question_type":"T3","question":"The official guide characterizes many Singapore business discussions as:","options":["straightforward.","necessarily highly indirect.","ritualized to the point that business topics are delayed for hours."],"answer":0,"explanation":"The guide says business discussions are usually very straightforward.","quick_rule":"Do not infer communication style from geography alone.","source_ids":["SRC34"],"source_url":"https://www.trade.gov/country-commercial-guides/singapore-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q044","module":"World Cultures","subcategory":"Singapore","topic":"Names and Diversity","difficulty":"C","question_type":"T4","question":"A visitor assumes that every Singaporean business contact follows a Chinese family-name-first pattern. What is wrong with this approach?","options":["Names have no relevance to forms of address.","Family names are never used in Singapore.","All Singaporeans use Western first names.","Singapore is multi-ethnic, and naming conventions differ across Chinese, Malay, Indian, and other communities."],"answer":3,"explanation":"The guide specifically distinguishes naming practices among different ethnic communities in Singapore.","quick_rule":"Multi-ethnic context → verify the person’s preferred form of address.","source_ids":["SRC34"],"source_url":"https://www.trade.gov/country-commercial-guides/singapore-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q045","module":"World Cultures","subcategory":"Singapore","topic":"Addressing People","difficulty":"B","question_type":"T4","question":"When unsure how to address a Singaporean business contact, what is the safest intercultural strategy?","options":["Use only first names regardless of context.","Infer ethnicity from appearance and choose a naming rule.","Use a respectful form and follow the person’s own introduction or ask their preference.","Avoid using any name at all."],"answer":2,"explanation":"Because naming conventions vary across communities, respectful clarification is safer than assumption.","quick_rule":"Ask/observe rather than guess identity conventions.","source_ids":["SRC34"],"source_url":"https://www.trade.gov/country-commercial-guides/singapore-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Identity"},{"id":"WC2Q046","module":"World Cultures","subcategory":"Singapore","topic":"Theory Distinction","difficulty":"C","question_type":"T2","question":"Singapore business discussions are described as straightforward. Which conclusion is most defensible?","options":["A regional stereotype such as “all Asian communication is indirect” is unreliable.","Singapore cannot contain high-context communication in any setting.","Straightforward business talk proves all Singaporeans are individualists.","Directness eliminates the importance of cultural context."],"answer":0,"explanation":"The guide demonstrates why broad geographic stereotypes cannot substitute for context-specific evidence.","quick_rule":"Region ≠ one communication style.","source_ids":["SRC34"],"source_url":"https://www.trade.gov/country-commercial-guides/singapore-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Avoiding essentialism"},{"id":"WC2Q047","module":"World Cultures","subcategory":"Singapore","topic":"Intercultural Competence","difficulty":"C","question_type":"T4","question":"A Chinese-Singaporean contact introduces herself with an English given name and a family name. What should a visitor do?","options":["Use the form she presents and remain open to her stated preference rather than imposing a generic cultural rule.","Assume her English name is informal and should never be used.","Reorder her name according to the visitor’s own convention.","Ask her ethnicity before beginning the meeting."],"answer":0,"explanation":"The guide shows that naming practices are diverse; individual self-presentation is the strongest immediate cue.","quick_rule":"Identity cue from the person > stereotype.","source_ids":["SRC34"],"source_url":"https://www.trade.gov/country-commercial-guides/singapore-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Identity negotiation"},{"id":"WC2Q048","module":"World Cultures","subcategory":"Thailand","topic":"Hierarchy","difficulty":"B","question_type":"T3","question":"Which factor is emphasized in the Thai business guide?","options":["A norm requiring first-name equality in every formal setting.","Deliberate disregard for rank.","Respect for age, status, and authority."],"answer":2,"explanation":"The guide highlights respect for elders, superiors, patrons, age, and authority.","quick_rule":"Thailand guide: attend to status and hierarchy.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q049","module":"World Cultures","subcategory":"Thailand","topic":"Indirect Communication","difficulty":"B","question_type":"T4","question":"A Thai colleague gives a vague negative response rather than saying “no” directly. What is the best initial interpretation?","options":["The response may reflect an indirect style intended to avoid confrontation or discomfort.","The answer must mean yes.","The colleague is necessarily being dishonest.","The behavior is best explained by proxemics."],"answer":0,"explanation":"The guide says negative reactions may not be expressed directly and communication tends to be indirect to avoid confrontation.","quick_rule":"Indirect negative response: read context before judging intent.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"High-context / face"},{"id":"WC2Q050","module":"World Cultures","subcategory":"Thailand","topic":"Face","difficulty":"C","question_type":"T2","question":"A manager remains calm during a frustrating Thai negotiation because publicly losing composure could damage respect. Which concept is most relevant?","options":["Communication accommodation through convergence.","Face concern.","Chronemics.","Uncertainty Avoidance only."],"answer":1,"explanation":"The guide explicitly links losing composure with losing face and others’ respect.","quick_rule":"Public dignity/reputation → face.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Face-Negotiation"},{"id":"WC2Q051","module":"World Cultures","subcategory":"Thailand","topic":"Wai","difficulty":"B","question_type":"T3","question":"What is the wai?","options":["A traditional Thai greeting and gesture of respect using palms together with a slight bow.","A formal written contract ritual.","A style of business card printing."],"answer":0,"explanation":"The guide describes the wai as a traditional greeting and leave-taking gesture of respect.","quick_rule":"Wai → greeting/respect gesture.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q052","module":"World Cultures","subcategory":"Thailand","topic":"Head and Feet","difficulty":"B","question_type":"T3","question":"Which etiquette pairing is supported by the Thai guide?","options":["Touching the head is a standard greeting and pointing with the feet is neutral.","Avoid touching someone’s head and avoid pointing with the feet.","Shoes should remain on when entering temples."],"answer":1,"explanation":"The guide describes the head as sacred and the feet as the lowest/unclean part of the body in this etiquette framework.","quick_rule":"Head/feet carry symbolic meanings in Thai etiquette.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q053","module":"World Cultures","subcategory":"Thailand","topic":"Business Cards","difficulty":"B","question_type":"T4","question":"You receive a Thai business card during a meeting. Which action should you avoid according to the guide?","options":["Bringing enough cards for meetings.","Reading the card before putting it away.","Writing notes on the card in the giver’s presence.","Treating the exchange as part of networking."],"answer":2,"explanation":"The guide says it is impolite to write on someone’s business card in their presence.","quick_rule":"Object-handling can communicate respect.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q054","module":"World Cultures","subcategory":"Thailand","topic":"Best Response","difficulty":"C","question_type":"T4","question":"A Thai partner does not give a direct refusal, but pauses, changes the subject, and gives a noncommittal answer. What should you do?","options":["Assume silence equals agreement.","Attend to nonverbal and contextual cues and clarify politely without forcing a public confrontation.","Demand an immediate yes/no answer in front of everyone.","Conclude that indirect communication is deceptive."],"answer":1,"explanation":"The guide stresses indirect communication, nonverbal cues, face, and avoidance of confrontation.","quick_rule":"Read context + clarify gently.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"High-context + face"},{"id":"WC2Q055","module":"World Cultures","subcategory":"Thailand","topic":"Theory Integration","difficulty":"D","question_type":"T2","question":"A Thai employee avoids contradicting a senior colleague publicly. Which explanation is strongest if the stem highlights both status and the risk of embarrassment?","options":["Proxemics and chronemics.","A combination of hierarchy awareness and face concern.","Only Communication Accommodation Theory.","Only national identity, with no situational factors."],"answer":1,"explanation":"The guide explicitly emphasizes both respect for hierarchy and avoidance of causing discomfort or loss of face.","quick_rule":"Complex scenarios can require two interacting concepts.","source_ids":["SRC35"],"source_url":"https://www.trade.gov/country-commercial-guides/thailand-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Power distance/hierarchy + face"},{"id":"WC2Q056","module":"World Cultures","subcategory":"India","topic":"Diversity","difficulty":"B","question_type":"T3","question":"What is the most important caution when using national-level cultural information about India?","options":["India contains major regional, linguistic, religious, and cultural diversity, so broad rules should be used cautiously.","Local variation is negligible in professional settings.","India has one uniform business culture across all regions."],"answer":0,"explanation":"The official guide foregrounds India’s large internal diversity and the resulting variety of business customs.","quick_rule":"India: internal diversity is a core fact.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q057","module":"World Cultures","subcategory":"India","topic":"Relationships","difficulty":"B","question_type":"T3","question":"Which factor does the India guide identify as broadly important in business?","options":["Avoiding all personal contact before signing a contract.","Personal relationships, rapport, reputation, and goodwill.","Replacing relationships with purely anonymous online interaction."],"answer":1,"explanation":"The guide emphasizes personal relationships and building reputation, rapport, and goodwill.","quick_rule":"India: relationship-building is a recurring business theme.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q058","module":"World Cultures","subcategory":"India","topic":"Scheduling","difficulty":"C","question_type":"T4","question":"You are planning several business meetings in India. Which scheduling strategy is most appropriate?","options":["Schedule every meeting back-to-back with no buffer.","Build flexibility into the itinerary because delays or last-minute changes can occur.","Assume all meetings will start exactly on time in every context.","Avoid making appointments at all."],"answer":1,"explanation":"The guide recommends flexibility because meeting times may not always be followed strictly and cancellations can occur.","quick_rule":"Plan buffer; do not turn variability into a stereotype.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q059","module":"World Cultures","subcategory":"India","topic":"Greetings","difficulty":"B","question_type":"T3","question":"Which statement about greetings is supported by the official India guide?","options":["Handshakes are prohibited in all business contexts.","A handshake is common, while namaste/namaskar may also be used.","Namaste is the only acceptable greeting nationwide."],"answer":1,"explanation":"The guide presents both the handshake and namaste/namaskar as possible greetings.","quick_rule":"Multiple greeting forms coexist.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q060","module":"World Cultures","subcategory":"India","topic":"Essentialism","difficulty":"C","question_type":"T2","question":"A manager says, “Indian culture is relationship-oriented, so punctuality never matters there.” What is the best critique?","options":["It is correct because relationship orientation eliminates time norms.","The statement converts a contextual tendency into an absolute rule and ignores India’s internal diversity.","It proves the manager is using proxemics incorrectly.","It is wrong only because India is low-context."],"answer":1,"explanation":"The guide emphasizes both relationship-building and substantial internal variation; absolutes are not warranted.","quick_rule":"Tendency ≠ universal rule.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Avoiding essentialism"},{"id":"WC2Q061","module":"World Cultures","subcategory":"India","topic":"Intercultural Competence","difficulty":"C","question_type":"T4","question":"A meeting in India is rescheduled at short notice. Which response is most interculturally competent?","options":["Publicly complain that the culture does not respect time.","Assume future meetings will also be canceled.","Adjust practically, confirm the new plan, and avoid attributing one event to an entire national culture.","Stop communicating with the partner."],"answer":2,"explanation":"The guide recommends scheduling flexibility, while intercultural competence requires avoiding overgeneralization from one incident.","quick_rule":"Adapt to event; do not stereotype population.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Intercultural competence"},{"id":"WC2Q062","module":"World Cultures","subcategory":"India","topic":"Relationship vs Task","difficulty":"C","question_type":"T2","question":"Which distinction best captures a common exam trap when discussing India?","options":["Strong relationships eliminate the need for communication skills.","Relationship orientation means business goals are secondary in every case.","Relationship-building is the same concept as high-context communication.","Relationship-building can be important without implying that task competence or formal agreements are unimportant."],"answer":3,"explanation":"The guide highlights personal relationships, but that does not justify reducing all business behavior to one cultural dimension.","quick_rule":"Relationship orientation ≠ rejection of task orientation.","source_ids":["SRC36"],"source_url":"https://www.trade.gov/country-commercial-guides/india-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Concept distinction"},{"id":"WC2Q063","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Small Talk","difficulty":"B","question_type":"T4","question":"A visitor begins discussing contract terms immediately after sitting down at a UAE business meeting. Which adjustment best matches the official guide?","options":["Remain silent until the host signs a document.","Discuss only the host’s family before any business topic.","Skip greetings because efficiency is preferred.","Allow time for greetings and small talk before moving to business topics."],"answer":3,"explanation":"The guide says formal greetings can take several minutes and it is impolite to begin business without some small talk.","quick_rule":"Greeting + small talk can be part of business protocol.","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q064","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Punctuality","difficulty":"C","question_type":"T3","question":"Which statement best captures the UAE guide’s treatment of time?","options":["Visitors are expected to be punctual even though meetings may run late.","Appointments are generally optional.","Because meetings can run late, visitors should also arrive late."],"answer":0,"explanation":"The guide explicitly combines visitor punctuality with the possibility that meetings run late.","quick_rule":"Do not collapse “meeting duration” and “arrival norm.”","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q065","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Right Hand","difficulty":"B","question_type":"T3","question":"According to the UAE guide, which practice is appropriate in a formal business setting?","options":["Offer business cards or gifts with the right hand.","Use the left hand specifically to signal respect.","Avoid accepting any hospitality."],"answer":0,"explanation":"The guide notes that business cards and gifts should be offered with the right hand.","quick_rule":"Right-hand etiquette is a concrete interaction norm.","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q066","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Arabic Coffee","difficulty":"B","question_type":"T4","question":"You are offered Arabic coffee at a UAE meeting. Which action best matches the guide?","options":["Hold the cup in the right hand and, if possible, accept at least one cup.","Finish by placing the cup upside down on the table.","Hold the cup only in the left hand.","Refuse without acknowledgment to show efficiency."],"answer":0,"explanation":"The guide describes right-hand use and recommends accepting at least one cup when Arabic coffee is offered.","quick_rule":"Hospitality rituals can carry relational meaning.","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q067","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Multicultural Context","difficulty":"C","question_type":"T2","question":"Why should “UAE culture” be used cautiously as a predictor of individual behavior?","options":["National context is irrelevant to business.","All residents follow identical Emirati customs.","Cultural context never influences communication.","The UAE is highly multicultural, with expatriates from many countries forming a large share of the population."],"answer":3,"explanation":"The official guide emphasizes the UAE’s highly multicultural population.","quick_rule":"UAE context is diverse; verify who and what setting you are dealing with.","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Identity / diversity"},{"id":"WC2Q068","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Titles","difficulty":"B","question_type":"T4","question":"A visitor repeatedly addresses a senior UAE official informally despite being introduced with a title. Which norm is most directly being ignored?","options":["A preference for anonymous communication.","A ban on small talk.","Attention to formal titles.","Proxemics."],"answer":2,"explanation":"The guide specifically states that attention to titles is important.","quick_rule":"Title use is contextual respect, not proof of personality.","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q069","module":"World Cultures","subcategory":"United Arab Emirates","topic":"Theory Integration","difficulty":"C","question_type":"T2","question":"A UAE meeting begins with extended greetings and hospitality before the agenda. Which is the best interpretation?","options":["The participants are avoiding all task-oriented communication.","The hospitality ritual is a form of proxemics.","Relational protocol and courtesy are part of the interaction context; they should not automatically be labeled inefficiency.","The meeting demonstrates uncertainty avoidance."],"answer":2,"explanation":"The guide explicitly emphasizes formal greetings, small talk, courtesy, and hospitality as part of business interaction.","quick_rule":"Interpret sequence within its relational context.","source_ids":["SRC37"],"source_url":"https://www.trade.gov/country-commercial-guides/united-arab-emirates-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Contextual communication"},{"id":"WC2Q070","module":"World Cultures","subcategory":"Brazil","topic":"Relationship Continuity","difficulty":"B","question_type":"T3","question":"Which practice does the Brazil guide describe as helpful in important negotiations?","options":["Maintaining continuity through repeated contact with the same people.","Changing the negotiating team frequently.","Relying only on one short email exchange."],"answer":0,"explanation":"The guide notes that Brazilian executives often prefer continuous working relationships and multiple meetings with the same people.","quick_rule":"Continuity can build trust.","source_ids":["SRC38"],"source_url":"https://www.trade.gov/knowledge-product/brazil-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q071","module":"World Cultures","subcategory":"Brazil","topic":"In-Person Negotiation","difficulty":"B","question_type":"T4","question":"A foreign firm tries to close an important Brazilian deal entirely through brief emails. What adjustment best matches the guide?","options":["Replace communication with expensive gifts.","Avoid any direct contact with decision-makers.","Assume virtual meetings are unacceptable under all circumstances.","Use in-person interaction where possible, especially for important negotiations."],"answer":3,"explanation":"The guide says important negotiations are often best facilitated in person, while virtual meetings can supplement rather than fully replace them.","quick_rule":"In-person matters, but do not make an absolute rule.","source_ids":["SRC38"],"source_url":"https://www.trade.gov/knowledge-product/brazil-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q072","module":"World Cultures","subcategory":"Brazil","topic":"Personal Space","difficulty":"C","question_type":"T2","question":"A Brazilian counterpart stands closer and uses more touch during conversation than a U.S. visitor expects. Which concept most directly describes the spatial aspect?","options":["Uncertainty Avoidance.","Divergence.","Chronemics.","Proxemics."],"answer":3,"explanation":"The guide notes that personal-space standards can involve closer contact; the spatial dimension is proxemics.","quick_rule":"Distance → proxemics.","source_ids":["SRC38"],"source_url":"https://www.trade.gov/knowledge-product/brazil-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Proxemics"},{"id":"WC2Q073","module":"World Cultures","subcategory":"Brazil","topic":"Interruptions","difficulty":"C","question_type":"T4","question":"Several Brazilian participants speak over one another enthusiastically during a discussion. What is the best first interpretation based on the guide?","options":["It necessarily shows interpersonal conflict.","It proves the meeting has failed.","It is evidence of low power distance.","Frequent interruption can signal interest rather than disrespect in this context."],"answer":3,"explanation":"The guide says simultaneous conversation and frequent interruptions may be signs of interest rather than disrespect.","quick_rule":"Same behavior can carry different pragmatic meanings.","source_ids":["SRC38"],"source_url":"https://www.trade.gov/knowledge-product/brazil-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Pragmatics"},{"id":"WC2Q074","module":"World Cultures","subcategory":"Brazil","topic":"Gifts","difficulty":"B","question_type":"T3","question":"Which gift practice is most consistent with the Brazil guide?","options":["A modest promotional item may be acceptable, while an expensive gift can be problematic.","An expensive personal gift is expected at the first meeting.","Gifts are required before any negotiation begins."],"answer":0,"explanation":"The guide says modest promotional gifts may be customary, while expensive gifts can be misunderstood as bribes.","quick_rule":"Gift value changes the social meaning.","source_ids":["SRC38"],"source_url":"https://www.trade.gov/knowledge-product/brazil-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q075","module":"World Cultures","subcategory":"Brazil","topic":"Time and Context","difficulty":"C","question_type":"T4","question":"A visitor reaches a Brazilian meeting late because of severe city traffic. What does the guide recommend for future planning?","options":["Schedule meetings with no travel margin.","Adopt lateness as a cultural norm.","Remain punctual in intent but build transportation buffers for predictable delays.","Arrive late deliberately to match local practice."],"answer":2,"explanation":"The guide advises punctuality while also recommending sufficient buffer for traffic and unforeseen delays.","quick_rule":"Logistical delay ≠ cultural preference.","source_ids":["SRC38"],"source_url":"https://www.trade.gov/knowledge-product/brazil-business-travel","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Chronemics / context"},{"id":"WC2Q076","module":"World Cultures","subcategory":"Mexico","topic":"Business vs Social Time","difficulty":"C","question_type":"T2","question":"Which statement best reflects the Mexico guide?","options":["All Mexican events require exact-to-the-minute arrival.","Flexible social time means business punctuality is unimportant.","Business meetings are normally unscheduled.","Business appointments generally value punctuality even though social-event timing may be more flexible."],"answer":3,"explanation":"The guide explicitly distinguishes business/government punctuality from more flexible social timing.","quick_rule":"Separate contexts before applying a time norm.","source_ids":["SRC39"],"source_url":"https://www.trade.gov/country-commercial-guides/mexico-business-travel-and-etiquette","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"Chronemics"},{"id":"WC2Q077","module":"World Cultures","subcategory":"Mexico","topic":"Small Talk","difficulty":"B","question_type":"T4","question":"At a Mexican business lunch, what is a culturally sensible opening according to the guide?","options":["Allow some discussion of family, recent events, or other social topics before moving fully into business.","Use only written communication during the meal.","Begin with aggressive bargaining before greetings.","Demand that no personal topic be mentioned."],"answer":0,"explanation":"The guide notes that small talk commonly precedes business discussion and that business lunches support relationship-building.","quick_rule":"Small talk can be functional relationship work.","source_ids":["SRC39"],"source_url":"https://www.trade.gov/country-commercial-guides/mexico-business-travel-and-etiquette","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q078","module":"World Cultures","subcategory":"Mexico","topic":"Indirect Refusal","difficulty":"C","question_type":"T4","question":"A Mexican partner says “yes, we will see” but gives no concrete commitment. What is the best response?","options":["Treat the phrase cautiously, clarify specifics politely, and avoid assuming a literal commitment.","Conclude that indirect communication is irrational.","Assume the deal is final because “yes” was used.","Accuse the partner of dishonesty."],"answer":0,"explanation":"The guide says tactful and indirect phrasing is common and that “yes” does not always function as a firm yes.","quick_rule":"Pragmatic meaning can differ from literal wording.","source_ids":["SRC39"],"source_url":"https://www.trade.gov/country-commercial-guides/mexico-business-travel-and-etiquette","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"High-context / pragmatics"},{"id":"WC2Q079","module":"World Cultures","subcategory":"Mexico","topic":"Negotiation Style","difficulty":"B","question_type":"T4","question":"Which negotiating behavior does the Mexico guide advise against?","options":["Being overly aggressive.","Using a business lunch to discuss matters.","Maintaining professional appearance.","Building rapport before business."],"answer":0,"explanation":"The guide explicitly warns against overly aggressive negotiating behavior.","quick_rule":"Assertiveness and aggression are not the same.","source_ids":["SRC39"],"source_url":"https://www.trade.gov/country-commercial-guides/mexico-business-travel-and-etiquette","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A"},{"id":"WC2Q080","module":"World Cultures","subcategory":"Mexico","topic":"Theory Integration","difficulty":"D","question_type":"T2","question":"A Mexican colleague avoids a blunt “no” to preserve smooth interaction. Which interpretation is best?","options":["The colleague is necessarily being deceptive.","Indirect pragmatic communication may be serving relational or face concerns; clarify meaning rather than judging intent.","The behavior is best explained by proxemics.","The behavior proves every Mexican communicator is high-context."],"answer":1,"explanation":"The guide documents tactful indirect phrasing; intercultural analysis should connect the behavior to context without turning it into a universal national trait.","quick_rule":"Indirect wording + relationship concern; avoid essentialism.","source_ids":["SRC39"],"source_url":"https://www.trade.gov/country-commercial-guides/mexico-business-travel-and-etiquette","status":"official_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-19","knowledge_updated_at":"2026-10-19","verification_tier":"A","theory_link":"High-context + face"},{"id":"CC3Q001","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Ren vs Li","difficulty":"B","question_type":"T2","question":"Which pairing is most accurate in Confucian ethics?","options":["ren — caring humaneness; li — ritual propriety","ren — ritual law; li — personal freedom","ren — nonaction; li — spontaneity"],"answer":0,"explanation":"SEP describes ren as caring for others and li as patterned/ritual forms of appropriate conduct.","quick_rule":"ren = humaneness; li = ritual propriety.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q002","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Ren","difficulty":"B","question_type":"T2","question":"Which statement best captures ren (仁)?","options":["It is a central Confucian virtue concerned with humane care for others.","It means complete withdrawal from social relations.","It refers primarily to written legal codes."],"answer":0,"explanation":"Ren is a unifying Confucian virtue closely tied to humane concern for others.","quick_rule":"ren → humaneness / caring for others.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q003","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Li","difficulty":"B","question_type":"T2","question":"In a Confucian context, li (礼) is best understood as:","options":["ritual propriety and appropriate patterned conduct","the rejection of all social conventions","a synonym for political punishment"],"answer":0,"explanation":"Li concerns ritual forms and appropriate social conduct, not merely law or empty ceremony.","quick_rule":"li → ritual propriety.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q004","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Filiality","difficulty":"C","question_type":"T2","question":"Which statement about xiao (孝) is most accurate?","options":["It combines respectful care with family obligation and is not reducible to material support or blind obedience.","It requires unquestioning obedience in every moral conflict.","It refers mainly to loyalty between business partners."],"answer":0,"explanation":"SEP notes that filiality includes respectful care and discusses limits to simple obedience.","quick_rule":"xiao ≠ blind obedience.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q005","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Junzi","difficulty":"B","question_type":"T2","question":"In the Analects tradition, junzi is best understood as:","options":["an ethically exemplary person cultivated through virtue","a hereditary prince by definition in every passage","a Daoist recluse who rejects social roles"],"answer":0,"explanation":"In Confucian ethics junzi develops into an ideal of ethical nobility or exemplary person.","quick_rule":"junzi → ethical exemplar.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q006","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Relational Ethics","difficulty":"C","question_type":"T2","question":"Why are ren and li often described as relational values?","options":["They place human relationships and appropriate conduct within them near the center of ethical life.","They deny that social relationships have moral importance.","They describe only private mystical experience."],"answer":0,"explanation":"SEP characterizes Confucian ethics as relational partly because ren and li organize care and conduct in relationships.","quick_rule":"ren + li → relational ethics.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q007","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Wuwei","difficulty":"B","question_type":"T2","question":"Which interpretation of wuwei (无为) is most accurate?","options":["non-coercive or non-assertive action rather than total inactivity","doing absolutely nothing under all circumstances","strict obedience to ritual hierarchy"],"answer":0,"explanation":"SEP explicitly cautions that wuwei does not mean total inaction.","quick_rule":"wuwei ≠ doing nothing.","source_ids":["SRC41"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q008","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Wuwei","difficulty":"C","question_type":"T4","question":"A leader intervenes as little as necessary and avoids forcing outcomes when circumstances can unfold on their own. Which Daoist idea is the closest match?","options":["wuwei","ren","li"],"answer":0,"explanation":"This resembles the Laozi ideal of non-coercive action rather than forceful intervention.","quick_rule":"non-coercive action → wuwei.","source_ids":["SRC41"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q009","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Laozi vs Confucianism","difficulty":"C","question_type":"T2","question":"Which contrast is most defensible?","options":["Laozi often questions coercive, self-serving action, while Confucian ethics gives major weight to cultivated relationships and ritual conduct.","Laozi and Confucius use exactly the same ethical vocabulary in the same way.","Confucian ethics rejects social roles while Laozi centers ritual propriety."],"answer":0,"explanation":"The traditions overlap historically but emphasize different ethical vocabularies and problems.","quick_rule":"Daoist non-coercion vs Confucian relational cultivation.","source_ids":["SRC40","SRC41"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q010","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Zhuangzi","difficulty":"B","question_type":"T2","question":"Zhuangzi is most closely associated with:","options":["Classical philosophical Daoism","Legalist statecraft","Neo-Confucian examination policy"],"answer":0,"explanation":"SEP describes Zhuangzi as a pivotal figure in Classical Philosophical Daoism.","quick_rule":"Zhuangzi → Daoism.","source_ids":["SRC42"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q011","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Zhuangzi","difficulty":"C","question_type":"T2","question":"Which feature is especially characteristic of the Zhuangzi?","options":["stories, paradoxes and shifting perspectives used to question fixed distinctions","a systematic code of ritual ranks for court ceremonies","a census of Han administrative offices"],"answer":0,"explanation":"The Zhuangzi is famous for imaginative dialogues, stories and challenges to fixed distinctions and perspectives.","quick_rule":"Zhuangzi → perspective + paradox.","source_ids":["SRC42"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q012","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Confucianism vs Hofstede","difficulty":"C","question_type":"T2","question":"A question asks about ren and li. Which framework should you use first?","options":["Confucian ethical concepts","Hofstede’s uncertainty avoidance","Hall’s proxemics"],"answer":0,"explanation":"Ren and li are indigenous philosophical concepts; forcing them directly into a modern national-culture dimension loses precision.","quick_rule":"Use indigenous concept before imported framework.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B","theory_link":"Avoid over-mapping culture theories"},{"id":"CC3Q013","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Filiality Scenario","difficulty":"C","question_type":"T4","question":"A student says, “Filial piety simply means obeying parents no matter what.” What is the best correction?","options":["Confucian discussions of filiality emphasize respectful care and allow moral tension between service and obedience.","Yes; filiality has always meant unconditional obedience only.","No; filiality has nothing to do with parents."],"answer":0,"explanation":"SEP discusses filial care as richer than material support and distinguishes service from simple obedience.","quick_rule":"filiality = respectful care, not blind obedience.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q014","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Ren-Li Scenario","difficulty":"C","question_type":"T4","question":"A museum label says Confucian ethics values humane concern but also patterned forms of respectful conduct. Which pair best fits?","options":["ren and li","wuwei and ziran","proxemics and haptics"],"answer":0,"explanation":"The label combines humane care (ren) and ritual/appropriate conduct (li).","quick_rule":"care + propriety → ren + li.","source_ids":["SRC40"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q015","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Dao","difficulty":"B","question_type":"T2","question":"In early Chinese philosophy, dao is most literally associated with the idea of:","options":["a way or path","a written criminal statute","a musical instrument"],"answer":0,"explanation":"Dao is commonly rendered as way/path, though traditions interpret it differently.","quick_rule":"dao → way / path.","source_ids":["SRC40","SRC42"],"status":"academic_guided_simulation","dynamic_fact":false,"fact_checked_at":"2026-10-20","knowledge_updated_at":"2026-10-20","verification_tier":"B"},{"id":"CC3Q016","module":"Chinese Culture","subcategory":"Philosophy & Values","topic":"Essentialism Trap","difficulty":"D","question_type":"T4","question":"Which statement shows the best intercultural use of Chinese philosophical concepts?","options":["They can illuminate cultural traditions, but they should not be used to predict every Chinese individual’s behavior.","Because ren is important historically, every Chinese
